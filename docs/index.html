<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c5d66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jurnal">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Yo'qlama jurnali</title>
<style>
:root{
  --win:#f5f1e8;--base:#fffdf8;--alt:#f8f4eb;--soft:#efe8da;--line:#e4dccb;--text:#1b2a2f;--muted:#6c7774;
  --acc:#0b6f79;--acc-d:#08525a;--acc-fg:#ffffff;--acc-soft:#e1efee;--today:#f2c14e;--today-cell:#fdf3d4;--danger:#b8322a;--ok:#2f7a3a;
  --side-bg:linear-gradient(175deg,#0c5d66 0%,#083f46 100%);--side-fg:#e8f3f2;--side-mut:#9fc4c3;
  --sh:0 1px 2px rgba(60,45,20,.05),0 6px 20px -10px rgba(60,45,20,.18);--sh-lg:0 2px 4px rgba(60,45,20,.06),0 18px 40px -16px rgba(60,45,20,.30);
  --r:18px;--side:232px;
}
:root[data-theme="dark"]{
  --win:#0e1517;--base:#151f22;--alt:#1a262a;--soft:#223136;--line:#2a3b40;--text:#e9eeec;--muted:#93a4a3;
  --acc:#3fb8c2;--acc-d:#6ccdd5;--acc-fg:#062427;--acc-soft:#173a3e;--today:#d9a93a;--today-cell:#3a3320;--danger:#f07a70;--ok:#72c27a;
  --side-bg:linear-gradient(175deg,#0f2a2e 0%,#0a1b1e 100%);--side-fg:#e3efee;--side-mut:#86a7a7;
  --sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);--sh-lg:0 2px 6px rgba(0,0,0,.35),0 20px 48px -18px rgba(0,0,0,.75);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="dark"]){
    --win:#0e1517;--base:#151f22;--alt:#1a262a;--soft:#223136;--line:#2a3b40;--text:#e9eeec;--muted:#93a4a3;
    --acc:#3fb8c2;--acc-d:#6ccdd5;--acc-fg:#062427;--acc-soft:#173a3e;--today:#d9a93a;--today-cell:#3a3320;--danger:#f07a70;--ok:#72c27a;
    --side-bg:linear-gradient(175deg,#0f2a2e 0%,#0a1b1e 100%);--side-fg:#e3efee;--side-mut:#86a7a7;
    --sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);--sh-lg:0 2px 6px rgba(0,0,0,.35),0 20px 48px -18px rgba(0,0,0,.75);
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--win);color:var(--text);font:15px/1.45 "Liberation Serif","Times New Roman",Tinos,Times,serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
/* chap panel */
.side{width:var(--side);flex:none;background:var(--base);border-right:1px solid var(--line);padding:20px 14px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;padding:0 6px 18px}
.logo b{width:36px;height:36px;border-radius:10px;background:var(--acc);color:var(--acc-fg);display:grid;place-items:center;font-weight:800}
.logo span{display:flex;flex-direction:column;font-weight:800;line-height:1.2}.logo small{color:var(--muted);font-weight:500}
.nav{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;border:0;background:transparent;font-weight:600;text-align:left;width:100%}
.nav:hover{background:var(--soft)}
.nav.on{background:var(--acc);color:var(--acc-fg)}
.nav svg{width:20px;height:20px;flex:none}
.side .grow{flex:1}
.compact .side{width:76px}.compact .side .lbl,.compact .logo span{display:none}.compact .nav{justify-content:center;padding:11px 0}
main{flex:1;min-width:0;padding:26px 32px 40px}
/* mobil */
.tabbar{display:none}
@media (max-width:820px){
  .side{display:none}
  main{padding:16px 14px 96px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--base);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tabbar .nav{flex-direction:column;gap:2px;padding:6px 0;font-size:12px;justify-content:center;align-items:center;text-align:center}
}
h1{font-size:28px;font-weight:800;margin:0;line-height:1.2}
h2{font-size:19px;font-weight:800;margin:0}
@media (max-width:820px){h1{font-size:22px}}
.muted{color:var(--muted)}
.card{background:var(--base);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.hot{border:2px solid var(--acc)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:6px}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--base);font-weight:600;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-fg);font-weight:700}
.btn.pri:hover{background:var(--acc-d)}
.btn.sm{min-height:34px;padding:0 12px;font-size:14px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
a.btn{text-decoration:none;color:inherit}a.btn.pri{color:var(--acc-fg)}
.link{border:0;background:none;color:var(--acc);font-weight:700;padding:4px}
.chip{min-height:38px;padding:0 15px;border-radius:99px;border:1px solid var(--line);background:var(--base);font-weight:600;white-space:nowrap}
.chip.on{background:var(--text);border-color:var(--text);color:var(--base)}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:4px;gap:3px}
.seg button{white-space:nowrap;min-height:32px;padding:0 12px;border:0;border-radius:8px;background:transparent;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--base);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.tag{color:var(--acc);font-weight:800;font-size:12px;letter-spacing:1px}
.ok{color:var(--ok);font-weight:700}.warn{color:var(--danger);font-weight:700}
.grid{display:grid;gap:16px}
.lessons{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.two{grid-template-columns:3fr 2fr;align-items:start}
@media (max-width:1000px){.two{grid-template-columns:1fr}}
.big{font-size:24px;font-weight:800}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--soft)}
.av{width:38px;height:38px;border-radius:12px;background:var(--soft);color:var(--acc);display:grid;place-items:center;font-weight:800;flex:none}
.badge{font-size:11px;font-weight:800;color:#b42318;background:#fde8e6;padding:1px 7px;border-radius:99px;margin-left:6px;white-space:nowrap}
input[type=text],input[type=date],input[type=password],input[type=number],select,textarea{background:var(--base);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:40px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
textarea{min-height:120px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:14px}
/* jurnal jadvali */
.tblwrap{overflow:auto;background:var(--base);border:1px solid var(--line);border-radius:var(--r);padding:6px;max-height:calc(100vh - 270px)}
@media (max-width:820px){.tblwrap{max-height:none}}
table.j{border-collapse:separate;border-spacing:4px;font-size:14px}
table.j th{font-weight:700;color:var(--muted);position:sticky;top:0;background:var(--base);z-index:2;padding:4px 0}
table.j th.d{min-width:40px;text-align:center;line-height:1.15;border-radius:8px}
table.j th.d small{display:block;font-size:11px;font-weight:600}
table.j th.d.today{background:var(--today);color:#12303a}
table.j th.d.x{opacity:.55}
table.j th.d.m small{color:var(--acc);font-weight:800}
table.j .nm{position:sticky;left:0;background:var(--base);box-shadow:-8px 0 0 var(--base),4px 0 0 var(--base);z-index:1;white-space:nowrap;font-weight:600;padding:0 8px 0 2px;max-width:240px;overflow:hidden;text-overflow:ellipsis}
table.j th.nm{z-index:3}
table.j .nm i{font-style:normal;color:var(--muted);font-weight:500;display:inline-block;min-width:22px}
table.j tr.cur .nm{color:var(--acc)}
table.j td.c{padding:0}
.cell{width:100%;min-width:40px;height:36px;border:0;border-radius:7px;font-weight:700;font-size:15px;background:var(--alt);color:var(--text);padding:0;line-height:1}
.cell.t{background:var(--today-cell)}
.cell.sel{box-shadow:0 0 0 3px var(--acc)}
.cell.ro{cursor:default}
table.j td.s{text-align:center;font-weight:800;padding:0 6px;white-space:nowrap}
table.j td.s.a{color:var(--muted);font-weight:600}
.dense table.j{border-spacing:2px;font-size:12.5px}
.dense table.j th.d{min-width:27px}
.dense .cell{min-width:27px;height:23px;font-size:12px;border-radius:4px}
.dense table.j .nm{max-width:190px}
.dense .tblwrap{max-height:calc(100vh - 230px)}
.keys{position:sticky;bottom:0;margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--base);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;z-index:5}
@media (max-width:820px){
  .keys{bottom:64px;flex-wrap:nowrap;overflow-x:auto;padding:8px;gap:5px}
  .keys .hint{flex:none;max-width:120px;white-space:normal;font-size:12px}
  .key{min-width:40px;height:40px;flex:none}
  .chips{flex-wrap:nowrap!important;overflow-x:auto;padding-bottom:2px}
  table.j .nm{max-width:130px}
  .foot .muted{font-size:13px}
}
.key{min-width:44px;height:44px;border-radius:10px;border:1px solid var(--line);font-weight:800;font-size:16px}
.dense .key{min-width:36px;height:34px;font-size:14px}
.keys .hint{flex-basis:100%;font-weight:700;font-size:14px}
@media (min-width:821px){.keys .hint{flex-basis:auto;margin-right:6px}}
/* dars */
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps button{border:0;border-radius:99px;padding:6px 14px;background:var(--soft);color:var(--muted);font-weight:700}
.steps button.on{background:var(--acc);color:var(--acc-fg)}
.lrow{display:flex;align-items:center;gap:10px;padding:9px 4px;border-top:1px solid var(--soft);flex-wrap:wrap}
.lrow .n{width:24px;color:var(--muted)}
.lrow .who{flex:1 1 180px;font-weight:700}
.lrow .who.dim{color:var(--muted);font-weight:500}
.tg{min-height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--base);font-weight:600}
.gb{width:36px;height:34px;border-radius:7px;border:1px solid var(--line);background:var(--base);font-weight:700;padding:0}
.gb:disabled{opacity:.35}
@media (max-width:820px){.tg{padding:0 8px;font-size:13px}.gb{width:30px}}
.foot{position:sticky;bottom:0;background:var(--win);padding:12px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:10px}
@media (max-width:820px){.foot{bottom:60px}}
/* sozlamalar */
.set{display:grid;grid-template-columns:250px 1fr;gap:18px;align-items:start}
@media (max-width:820px){.set{grid-template-columns:1fr}}
.secs{display:flex;flex-direction:column;gap:3px;padding:8px}
@media (max-width:820px){.secs{flex-direction:row;overflow-x:auto}}
.secs button{border:0;background:transparent;text-align:left;padding:10px 14px;border-radius:10px;font-weight:600;white-space:nowrap}
.secs button.on{background:var(--soft)}
.srow{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:14px 0;border-top:1px solid var(--soft);flex-wrap:wrap}
.srow>div:first-child{flex:1 1 260px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{min-width:46px;min-height:38px;border-radius:9px;border:1px solid var(--line);background:var(--base);font-weight:700}
.days button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-fg)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:820px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--alt);border-radius:12px;padding:12px 14px}.tile div:last-child{font-size:22px;font-weight:800}
table.r{border-collapse:collapse;width:100%;font-size:14px}
table.r th,table.r td{padding:8px 8px;border-bottom:1px solid var(--soft);text-align:left}
table.r th{color:var(--muted);font-weight:700}
table.r td.n{text-align:center}
.pill{display:inline-block;min-width:44px;text-align:center;border-radius:7px;padding:2px 6px;font-weight:800}
/* oyna */
.modal{position:fixed;inset:0;background:rgba(10,25,30,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal .card{width:min(560px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--base);padding:10px 18px;border-radius:10px;z-index:60;font-weight:600;max-width:90vw}
@media (max-width:820px){.toast{bottom:80px}}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--base);border-radius:var(--r);padding:14px 16px}
.opt:hover{border-color:var(--acc)}
.opt b{display:block;font-size:16px}
.hide{display:none!important}
/* summativ */
table.sum th{white-space:nowrap;padding:4px 3px}
table.sum th small{display:block;font-size:11px;font-weight:600}
@media (max-width:820px){.seg{max-width:100%;overflow-x:auto}}
table.sum th.wk{padding:0}
.wbtn{border:0;border-radius:8px;padding:4px 6px;font-weight:800;min-width:56px;line-height:1.15;background:#e3f0fb;color:#0d47a1}
.wbtn.chsb{background:#f1e6f8;color:#6a1b9a}
.wbtn small{display:block;font-weight:600;font-size:11px}
input.sc{width:58px;min-height:36px;height:36px;padding:0 4px;text-align:center;font-weight:700;background:var(--alt);border-radius:7px;border:1px solid transparent}
input.sc.ab{color:var(--danger)}
input.sc.lt{width:76px;color:#6d4c41;background:#efe3dc}
input.sc.bad{border-color:var(--danger);background:#fde8e6}
select.g5{width:62px;min-height:34px;padding:0 4px}
.warnbox{border-color:#f0b4ae;background:#fff4f2;color:#8a1c12}
:root[data-theme="dark"] .warnbox{background:#3a2020;color:#ffb4a8}
.key.on2{background:var(--acc);color:var(--acc-fg)}
table.j td.nm[data-st]{cursor:pointer}
.nmlink{padding:0;text-align:left;color:var(--text)}
/* kartochka */
.modal .card.wide{width:min(760px,100%)}
.seg.tabs{flex-wrap:wrap}
svg.growth{width:100%;height:auto;background:var(--alt);border-radius:10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* bo'sh varaq */
table.bl{border-collapse:collapse;width:100%;font-size:13px;margin-top:8px}
table.bl th,table.bl td{border:1px solid #777;padding:6px 4px;text-align:center;height:28px}
table.bl th{background:#eee;color:#222;font-weight:700}
table.bl .bn{text-align:left;min-width:150px}
.lrow .tg .sh{display:none}
@media (max-width:560px){
  .lrow .tg .lg{display:none}.lrow .tg .sh{display:inline}
  .lrow .tg{min-width:42px;padding:0 6px}
  .lrow .who{flex:1 1 100%}
  .lrow .tgs{display:flex;gap:5px;flex:1}.lrow .tgs .tg{flex:1}
  .gb{width:calc((100vw - 120px)/10);min-width:26px}
  .modal{padding:8px;align-items:end}
  .modal .card{max-height:92vh;padding:16px}
  .tiles .tile div:last-child{font-size:19px}
}

/* ───── Yangi dizayn (2026-10): qog'oz fon, to'q panel, yumshoq soyalar ───── */
body{font-size:15.5px;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
::selection{background:var(--acc);color:var(--acc-fg)}
.side{background:var(--side-bg);border-right:0;color:var(--side-fg);padding:22px 14px 16px;box-shadow:inset -1px 0 0 rgba(255,255,255,.04)}
.logo{padding:2px 8px 22px;margin-bottom:8px;border-bottom:1px solid rgba(255,255,255,.10)}
.logo b{width:40px;height:40px;border-radius:12px;background:#fffdf8;color:#0b5d66;font-size:21px;box-shadow:0 4px 12px -4px rgba(0,0,0,.45)}
.logo span{font-size:17px;letter-spacing:.01em}.logo small{color:var(--side-mut);font-style:italic;font-weight:400;font-size:13px}
.side .nav{color:var(--side-fg);opacity:.86;font-size:16px;padding:11px 14px;border-radius:12px;position:relative;transition:background .15s,opacity .15s}
.side .nav:hover{background:rgba(255,255,255,.08);opacity:1}
.side .nav.on{background:rgba(255,255,255,.14);color:#fff;opacity:1;box-shadow:inset 0 0 0 1px rgba(255,255,255,.10)}
.side .nav.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--today)}
.side .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);color:var(--side-fg)}
.side .btn:hover{background:rgba(255,255,255,.16)}
.compact .side .nav.on::before{left:-14px}
main{padding:30px 40px 48px;max-width:1500px}
h1{font-size:34px;font-weight:700;letter-spacing:-.015em;line-height:1.15}
h2{font-size:21px;font-weight:700;letter-spacing:-.005em}
@media (max-width:820px){h1{font-size:26px}}
.tag{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase}
.card{border-color:var(--line);box-shadow:var(--sh);padding:20px 22px}
.hot{border:1px solid var(--acc);box-shadow:0 0 0 3px var(--acc-soft),var(--sh)}
.lessons .card{transition:transform .18s ease,box-shadow .18s ease}
.lessons .card:hover{transform:translateY(-2px);box-shadow:var(--sh-lg)}
.btn{border-radius:12px;min-height:42px;transition:background .15s,box-shadow .15s,transform .05s;box-shadow:0 1px 0 rgba(60,45,20,.04)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 88%,#fff) 0%,var(--acc) 100%);box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 6px 14px -8px var(--acc)}
.btn.pri:hover{background:var(--acc-d)}
.chip{transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--acc)}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-fg);box-shadow:0 6px 14px -8px var(--acc)}
.seg{background:var(--soft);border-radius:12px}
.seg button{border-radius:9px;transition:background .15s,color .15s}
.seg button.on{box-shadow:0 1px 3px rgba(60,45,20,.18)}
input[type=text],input[type=date],input[type=password],input[type=number],select,textarea{border-radius:12px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.av{border-radius:50%;background:var(--acc-soft);color:var(--acc);font-size:14px;letter-spacing:.02em}
.item{border-top-color:var(--soft)}
.badge{letter-spacing:.03em}
.tblwrap{border-radius:var(--r);box-shadow:var(--sh);padding:8px}
.cell{border-radius:8px;transition:transform .08s ease,box-shadow .12s}
.cell:not(.ro):hover{transform:scale(1.06);box-shadow:0 3px 8px -3px rgba(0,0,0,.25)}
.keys{border-radius:var(--r);box-shadow:var(--sh-lg)}
.key{border-radius:12px;transition:transform .06s;background:var(--base);color:var(--text)}
.key:active{transform:scale(.94)}
.tiles{gap:14px}
.tile{background:var(--base);border:1px solid var(--line);border-radius:14px;padding:14px 16px;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--acc)}
.tile div:first-child{font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.tile div:last-child{font-size:26px;font-weight:700}
table.r th{font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;border-bottom:2px solid var(--line)}
table.r tr:hover td{background:var(--alt)}
.pill{border-radius:99px;padding:2px 9px}
.modal{background:rgba(20,28,30,.38);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal .card{box-shadow:var(--sh-lg);border-radius:22px}

<body>
<div class="app" id="app">
  <aside class="side" id="side"></aside>
  <main id="main"></main>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<input type="file" id="file" accept=".json,application/json" class="hide">
<script>
"use strict";
/* ───────── ma'lumot: 1-versiyadagi journal.json bilan bir xil tuzilma ───────── */
const STORE_KEY = "yoqlama_jurnal";
const WD = ["Du", "Se", "Ch", "Pa", "Ju", "Sh", "Ya"];
const WD_FULL = ["Dushanba", "Seshanba", "Chorshanba", "Payshanba", "Juma", "Shanba", "Yakshanba"];
const MONTHS = ["Yanvar", "Fevral", "Mart", "Aprel", "May", "Iyun", "Iyul", "Avgust", "Sentabr", "Oktabr", "Noyabr", "Dekabr"];
const MONTHS_GEN = ["yanvar", "fevral", "mart", "aprel", "may", "iyun", "iyul", "avgust", "sentabr", "oktabr", "noyabr", "dekabr"];
const ATT = ["s", "dq", "k", "kq"];
const ABSENT_NAMES = {s: "sababsiz", dq: "sababli", k: "kasal", kq: "kech qoldi", ch: "chet elda", x: "dars yo'q"};
const DEFAULTS = {
  ranges: [{min: 1, color: "#ef9a9a", name: "Past"}, {min: 5, color: "#fff59d", name: "O'rta"}, {min: 8, color: "#81c784", name: "Yaxshi"}],
  attendance: {s: "#c62828", dq: "#90caf9", k: "#ce93d8", kq: "#a1887f", ch: "#80cbc4", x: "#cfd8dc"},
  method_weekday: null, lesson_weekdays: [0, 1, 2, 3, 4, 5], quarters: [null, null, null, null],
  holidays: ["01-01", "03-08", "03-21", "05-09", "09-01", "10-01", "12-08"],
  protect: {enabled: true, auto_lock_min: 10, pin: null},
  risk: {avg_below: 5.0, att_below: 80, s_ge: 3, min_n: 3, few_lt: 4, avg_min_grades: 3, consec_ge: 3, drop_ge: 1.5, work_below: 40,
         on: {avg: true, few: true, min_n: true, att: true, s: true, qgrade: true, consec: false, drop: false, work: false}},
};
const clone = (o) => JSON.parse(JSON.stringify(o));
let D = null;

function normalize(d) {
  d = d && typeof d === "object" ? d : {};
  d.version = d.version || 2;
  d.classes = Array.isArray(d.classes) ? d.classes : [];
  const st = d.settings = Object.assign(clone(DEFAULTS), d.settings || {});
  st.attendance = Object.assign(clone(DEFAULTS.attendance), st.attendance || {});
  st.protect = Object.assign(clone(DEFAULTS.protect), st.protect || {});
  const r = st.risk || {};
  st.risk = Object.assign(clone(DEFAULTS.risk), r);
  st.risk.on = Object.assign(clone(DEFAULTS.risk.on), r.on || {});
  if (!Array.isArray(st.quarters) || st.quarters.length !== 4) st.quarters = [null, null, null, null];
  for (const c of d.classes) {
    c.subject = c.subject || ""; c.dates = (c.dates || []).slice().sort();
    c.extra_x = c.extra_x || []; c.held = c.held || []; c.lessons = c.lessons || {}; c.works = c.works || [];
    c.att_ok = c.att_ok || []; c.students_off = c.students_off || []; c.students = (c.students || []).map((s) => Object.assign({marks: {}}, s));
  }
  d.web = Object.assign({density: "oddiy", theme: "auto", gen: []}, d.web || {});
  d.v2 = d.v2 || {};
  if (!d.v2.ranges3 && !d.web.ranges3) { st.ranges = clone(DEFAULTS.ranges); d.web.ranges3 = true; }
  return d;
}
function load() {
  try { const t = localStorage.getItem(STORE_KEY); if (t) return normalize(JSON.parse(t)); } catch (e) { console.warn(e); }
  return normalize({});
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(D)); }
  catch (e) { toast("Saqlab bo'lmadi: brauzer xotirasi to'lgan yoki yopiq. «Sozlamalar → Ma'lumotlar»dan faylga saqlang."); }
}

/* ───────── belgilar ───────── */
function gradesOf(m) {
  if (!m) return [];
  const g = m.endsWith("kq") ? m.slice(0, -2) : m;
  const p = g ? g.split("/") : [];
  return p.length && p.every((x) => /^\d+$/.test(x)) ? p.map(Number) : [];
}
const lateOf = (m) => !!m && m.endsWith("kq");
function attPart(m) { if (!m) return ""; if (!gradesOf(m).length && m !== "kq") return m; return lateOf(m) ? "kq" : ""; }
const buildMark = (gs, late) => gs.join("/") + (late ? "kq" : "");
function displayMark(m) {
  if (!m) return ""; const gs = gradesOf(m);
  if (gs.length) return (lateOf(m) ? "KQ " : "") + gs.join("/");
  return m === "x" ? "×" : m.toUpperCase();
}
function gradeColor(v) { let c = null; for (const r of ranges()) if (v >= r.min) c = r.color; return c; }
const ranges = () => D.settings.ranges.slice().sort((a, b) => a.min - b.min);
function contrast(hex) {
  const n = parseInt(hex.slice(1), 16); const r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return 0.299 * r + 0.587 * g + 0.114 * b > 150 ? "#12303a" : "#ffffff";
}
function markColors(m) {
  if (!m) return null; const gs = gradesOf(m);
  const c = gs.length ? gradeColor(gs.reduce((a, b) => a + b, 0) / gs.length) : D.settings.attendance[m];
  return c ? [c, contrast(c)] : null;
}
function combineMark(old, v) {
  if (v === "") return "";
  const gs = gradesOf(old), late = lateOf(old);
  if (v === "kq") return buildMark(gs, !late);
  if (/^\d+$/.test(v)) return buildMark([+v], late);
  return v;
}

/* ───────── sanalar ───────── */
const pad = (n) => String(n).padStart(2, "0");
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const pdate = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const pyWd = (s) => (pdate(s).getDay() + 6) % 7;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const todayIso = () => iso(new Date());
const fmt = (s) => `${s.slice(8)}.${s.slice(5, 7)}.${s.slice(0, 4)}`;
const longDate = (s) => `${WD_FULL[pyWd(s)]}, ${+s.slice(8)}-${MONTHS_GEN[+s.slice(5, 7) - 1]}`;
const label = (c) => c.subject ? `${c.name} · ${c.subject}` : c.name;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (ch) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[ch]));

function qRange(q) { const r = D.settings.quarters[q - 1]; return r && r[0] && r[1] ? r : null; }
function quarterOf(s) { for (let q = 1; q <= 4; q++) { const r = qRange(q); if (r && r[0] <= s && s <= r[1]) return q; } return null; }
function isNoLesson(c, s) {
  if (c.extra_x.includes(s)) return true;
  const mw = D.settings.method_weekday;
  return mw !== null && mw !== undefined && mw >= 0 && pyWd(s) === mw && !c.held.includes(s);
}
function holidaySet(y) {
  const out = new Set();
  for (let h of D.settings.holidays || []) { h = String(h).trim(); if (/^\d{2}-\d{2}$/.test(h)) out.add(`${y}-${h}`); else if (/^\d{4}-\d{2}-\d{2}$/.test(h)) out.add(h); }
  return out;
}
function genQuarter(q, classes) {
  const r = qRange(q); if (!r) return 0; let added = 0;
  for (const c of classes || D.classes) {
    const wds = c.weekdays && c.weekdays.length ? c.weekdays : D.settings.lesson_weekdays;
    const have = new Set(c.dates); const fresh = [];
    for (let d = pdate(r[0]); iso(d) <= r[1]; d = addDays(d, 1)) { const s = iso(d); if (wds.includes(pyWd(s)) && !have.has(s)) fresh.push(s); }
    for (const s of fresh) if (holidaySet(+s.slice(0, 4)).has(s) && !c.held.includes(s) && !c.extra_x.includes(s)) c.extra_x.push(s);
    c.dates = [...have, ...fresh].sort(); added += fresh.length;
  }
  return added;
}
function autoDates() {             // joriy chorak boshlanganda dars kunlari o'zi yaratiladi (har sinf uchun bir marta)
  const q = quarterOf(todayIso()); if (!q) return;
  let n = 0;
  D.classes.forEach((c) => {
    const key = `${q}:${qRange(q)[0]}:${c.name}:${c.subject}`;
    if (c.weekdays && c.weekdays.length && !D.web.gen.includes(key)) { n += genQuarter(q, [c]); D.web.gen.push(key); }
  });
  if (n) save();
}

/* ───────── davr (Kun / Hafta / Oy / Chorak) ───────── */
const V = {mode: "month", anchor: todayIso()};
function quarterNo() {
  const q = quarterOf(V.anchor); if (q) return q;
  const rs = [1, 2, 3, 4].filter(qRange); if (!rs.length) return null;
  const nxt = rs.filter((i) => qRange(i)[0] > V.anchor); return nxt.length ? nxt[0] : rs[rs.length - 1];
}
function vRange() {
  const a = pdate(V.anchor);
  if (V.mode === "day") return [V.anchor, V.anchor];
  if (V.mode === "week") { const st = addDays(a, -pyWd(V.anchor)); return [iso(st), iso(addDays(st, 6))]; }
  if (V.mode === "quarter" && quarterNo()) return qRange(quarterNo());
  return [iso(new Date(a.getFullYear(), a.getMonth(), 1)), iso(new Date(a.getFullYear(), a.getMonth() + 1, 0))];
}
function vShift(n) {
  const a = pdate(V.anchor);
  if (V.mode === "day") V.anchor = iso(addDays(a, n));
  else if (V.mode === "week") V.anchor = iso(addDays(a, 7 * n));
  else if (V.mode === "quarter" && quarterNo()) {
    const qs = [1, 2, 3, 4].filter(qRange); const k = qs.indexOf(quarterNo()) + n;
    if (k >= 0 && k < qs.length) { const r = qRange(qs[k]); V.anchor = r[0] <= todayIso() && todayIso() <= r[1] ? todayIso() : r[0]; }
  } else { const d = new Date(a.getFullYear(), a.getMonth() + n, 1); V.anchor = iso(d); }
}
function vTitle() {
  const [lo, hi] = vRange();
  if (V.mode === "day") return `${fmt(lo)} · ${WD_FULL[pyWd(lo)]}`;
  if (V.mode === "week") return `${fmt(lo).slice(0, 5)} – ${fmt(hi)}`;
  if (V.mode === "quarter" && quarterNo()) return `${quarterNo()}-chorak · ${fmt(lo).slice(0, 5)} – ${fmt(hi)}`;
  return `${MONTHS[+lo.slice(5, 7) - 1]} ${lo.slice(0, 4)}`;
}

/* ───────── hisob-kitob ───────── */
function periodNow() {
  const t = todayIso(), q = quarterOf(t);
  return q ? [qRange(q)[0], t, q] : [t.slice(0, 8) + "01", t, null];
}
/* Python'dagi f"{x:.1f}" bilan bir xil yaxlitlash (aniq o'rtada juft raqamga) */
function pyFixed(x, d) {
  const ex = Math.abs(x).toFixed(Math.min(100, d + 60)), dot = ex.indexOf(".");
  if (!/^50*$/.test(ex.slice(dot + 1 + d))) return x.toFixed(d);
  const trunc = ex.slice(0, d ? dot + 1 + d : dot);
  return +trunc[trunc.length - 1] % 2 ? x.toFixed(d) : (x < 0 ? "-" : "") + trunc;
}
function reportRows(c, lo, hi, q = null) {
  const t = todayIso(), rk = D.settings.risk, on = rk.on;
  const dates = c.dates.filter((d) => lo <= d && d <= hi && d <= t && !isNoLesson(c, d));
  const lessons = dates.length, hasQ = !!(q && qRange(q)), works = hasQ ? worksInQuarter(c, q) : [];
  const bsbTaken = c.works.some((w) => w.type === "bsb" && lo <= w.date && w.date <= (hi < t ? hi : t));
  const rows = c.students.map((s) => {
    const vals = dates.filter((d) => s.marks[d]).map((d) => s.marks[d]);
    const gr = vals.flatMap(gradesOf);
    const cnt = {s: 0, dq: 0, k: 0, kq: 0};
    for (const v of vals) { if (lateOf(v)) cnt.kq++; else if (cnt[v] !== undefined) cnt[v]++; }
    const absent = cnt.s + cnt.dq + cnt.k, nch = vals.filter((v) => v === "ch").length, own = lessons - nch;
    const att = own > 0 ? +pyFixed(100 * (own - absent) / own, 1) : null;
    const avg = gr.length ? +pyFixed(gr.reduce((a, b) => a + b, 0) / gr.length, 2) : null;
    const qr = hasQ ? quarterResult(c, s, q, works) : null;
    const why = [];
    if (on.avg && avg !== null && gr.length >= Math.max(1, rk.avg_min_grades) && avg < rk.avg_below) why.push(`o'rtacha ${pyFixed(avg, 1)} < ${rk.avg_below}`);
    const few = !!(on.few && lessons && lessons >= (rk.few_lt ?? 4) && gr.length < (rk.few_lt ?? 4));
    if (few) why.push(`shu kungacha ${gr.length} ta baho (< ${rk.few_lt ?? 4})`);
    if (!few && on.min_n && rk.min_n && lessons && bsbTaken && gr.length < rk.min_n) why.push(`baholar soni ${gr.length} < ${rk.min_n}`);
    if (on.att && att !== null && att < rk.att_below) why.push(`davomat ${pyFixed(att, 0)}% < ${rk.att_below}%`);
    if (on.s && cnt.s >= rk.s_ge) why.push(`sababsiz ${cnt.s} ta`);
    if (on.qgrade && qr && qr.complete && qr.grade === 2) why.push("chorak bahosi 2");
    if (on.consec) {
      let run = 0, best = 0;
      for (const d of dates) { run = ["s", "dq", "k"].includes(attPart(s.marks[d] || "")) ? run + 1 : 0; best = Math.max(best, run); }
      if (best >= Math.max(2, rk.consec_ge ?? 3)) why.push(`ketma-ket ${best} dars qoldirgan`);
    }
    if (on.drop && gr.length >= 4) {
      const hh = Math.floor(gr.length / 2), a1 = gr.slice(0, hh).reduce((a, b) => a + b, 0) / hh, a2 = gr.slice(hh).reduce((a, b) => a + b, 0) / (gr.length - hh);
      if (a1 - a2 >= +(rk.drop_ge ?? 1.5)) why.push(`baholar pasaymoqda (${pyFixed(a1, 1)} → ${pyFixed(a2, 1)})`);
    }
    if (on.work) for (const w of c.works) {
      const v = (s.scores || {})[w.id];
      if (lo <= w.date && w.date <= hi && isNum(v) && w.max) { const pct = 100 * v / w.max; if (pct < +(rk.work_below ?? 40)) why.push(`${w.type.toUpperCase()} ${fmt(w.date).slice(0, 5)}: ${pyFixed(pct, 0)}%`); }
    }
    return {name: s.name, n: gr.length, avg, att, ...cnt, ch: nch, absent, q: qr, why, risk: why.length > 0};
  });
  return {rows, lessons, dates};
}
function riskOverview() {
  const [lo, hi, q] = periodNow(); const out = [];
  D.classes.forEach((c, ci) => {
    const bad = reportRows(c, lo, hi, q).rows.filter((r) => r.why.some((w) => !w.startsWith("baholar soni")));
    if (bad.length) out.push({ci, names: bad});
  });
  return out;
}
const hasMarks = (c, s) => c.students.some((st) => st.marks[s]);
function lessonsToday() {
  const t = todayIso();
  return D.classes.map((c, ci) => ({c, ci})).filter(({c}) => c.dates.includes(t) && !isNoLesson(c, t))
    .map(({c, ci}) => ({c, ci, done: hasMarks(c, t) || c.att_ok.includes(t)}));
}
function upcoming(days = 7) {
  const t = todayIso(), hi = iso(addDays(new Date(), days)), out = [];
  for (const c of D.classes) for (const w of c.works) if (t <= w.date && w.date <= hi) {
    const left = Math.round((pdate(w.date) - pdate(t)) / 864e5);
    out.push([w.date, `${w.type.toUpperCase()} — ${label(c)} (${left === 0 ? "bugun" : left === 1 ? "ertaga" : fmt(w.date)})`]);
  }
  const q = quarterOf(t);
  if (q) { const e = qRange(q)[1]; const left = Math.round((pdate(e) - pdate(t)) / 864e5); if (left >= 0 && left <= 7) out.push([e, `${q}-chorak ${fmt(e)} da tugaydi — baholarni tekshiring`]); }
  return out.sort().map((x) => x[1]);
}

/* ───────── belgini matndan o'qish (qo'lda yozilganda va importda) ───────── */

async function checkPin(pin, rec) {
  try {
    const salt = new Uint8Array(rec.salt.match(/../g).map((h) => parseInt(h, 16)));
    const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits({name: "PBKDF2", hash: "SHA-256", salt, iterations: +rec.iters}, key, 256);
    return [...new Uint8Array(bits)].map((b) => b.toString(16).padStart(2, "0")).join("") === rec.hash;
  } catch (e) { return false; }
}
async function makePin(pin) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({name: "PBKDF2", hash: "SHA-256", salt, iterations: 200000}, key, 256);
  const hex = (a) => [...a].map((b) => b.toString(16).padStart(2, "0")).join("");
  return {salt: hex(salt), hash: hex(new Uint8Array(bits)), iters: 200000};
}
async function unlock() {
  const p = D.settings.protect;
  if (!p.pin) { unlockedUntil = Date.now() + (p.auto_lock_min || 10) * 60000; render(); toast("Qulf ochildi: qo'yilgan baholarni o'zgartirish mumkin"); return true; }
  const pin = await ask("Qulfni ochish", "Parolni kiriting:", "", "password");
  if (pin === null) return false;
  if (await checkPin(pin, p.pin)) { unlockedUntil = Date.now() + (p.auto_lock_min || 10) * 60000; render(); toast("Qulf ochildi"); return true; }
  toast("Parol noto'g'ri"); return false;
}

async function settingsAction(a, i) {
  const st = D.settings;
  if (a === "addc") addClassDialog();
  else if (a === "stud") addStudents(i);
  else if (a === "rmst") studentsDialog(i);
  else if (a === "edit") editClass(i);
  else if (a === "del") {
    const c = D.classes[i]; const n = c.students.reduce((x, s) => x + Object.keys(s.marks).length, 0);
    if (n && isLocked() && !await unlock()) return;
    if (await confirmBox("Sinfni olib tashlash", `«${label(c)}» sinfi olib tashlansinmi? ${c.students.length} o'quvchi va ${n} ta baho/yo'qlama o'chadi.`, "Olib tashlash")) {
      if (n) { D.changelog = D.changelog || []; D.changelog.push({t: new Date().toISOString().slice(0, 19), cls: label(c), student: "(butun sinf)", date: "", old: `${n} ta belgi`, new: "", kind: "del_class"}); }
      D.classes.splice(i, 1); S.ci = 0; save(); render();
    }
  } else if (a === "genq") {
    let n = 0; for (let q = 1; q <= 4; q++) if (qRange(q)) n += genQuarter(q, D.classes.filter((c) => c.weekdays && c.weekdays.length));
    save(); toast(n ? `${n} ta dars sanasi qo'shildi` : "Yangi sana yo'q (dars kunlari yoki choraklar belgilanmagan bo'lishi mumkin)"); render();
  } else if (a === "prot") { if (st.protect.enabled && isLocked() && !await unlock()) return; st.protect.enabled = !st.protect.enabled; save(); render(); }
  else if (a === "pin") {
    if (st.protect.pin) { const cur = await ask("Parol", "Joriy parol:", "", "password"); if (cur === null) return; if (!await checkPin(cur, st.protect.pin)) { toast("Joriy parol noto'g'ri"); return; } }
    const p1 = await ask("Yangi parol", "Kamida 4 belgi. Unutsangiz, qulfni ochib bo'lmaydi:", "", "password"); if (p1 === null) return;
    if (p1.length < 4) { toast("Parol kamida 4 belgidan iborat bo'lishi kerak"); return; }
    const p2 = await ask("Yangi parol", "Parolni takrorlang:", "", "password"); if (p2 !== p1) { toast("Parollar mos kelmadi"); return; }
    st.protect.pin = await makePin(p1); save(); render(); toast("Parol o'rnatildi");
  } else if (a === "nopin") {
    const cur = await ask("Parolni olib tashlash", "Joriy parol:", "", "password"); if (cur === null) return;
    if (!await checkPin(cur, st.protect.pin)) { toast("Parol noto'g'ri"); return; } st.protect.pin = null; save(); render();
  } else if (a === "ktrw") { st.auto = Object.assign({}, st.auto, {ktr_works: !ktrWorksOn()}); save(); reflowAll(); save(); render(); }
  else if (a === "inst") { if (installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; render(); }); } }
  else if (a === "xls") importExcel();
  else if (a === "emk") emkDialog();
  else if (a === "roll") rollover();
  else if (a === "exp") exportJson();
  else if (a === "imp") importJson();
  else if (a === "hist") {
    const all = D.changelog || [], lg = all.map((e, k) => [e, k]).slice(-300).reverse();
    modal(`<h2>O'zgarishlar tarixi</h2><div class="muted">Qo'yilgan baho o'zgartirilgan yoki o'chirilgan holatlar. «Qaytarish» — eski qiymatni tiklaydi.</div><div style="overflow:auto;max-height:60vh"><table class="r"><tr><th>Vaqt</th><th>Sinf</th><th>O'quvchi</th><th>Sana / ish</th><th>Eski</th><th>Yangi</th><th></th></tr>
      ${lg.map(([e, k]) => `<tr><td>${esc(String(e.t).replace("T", " ").slice(0, 16))}</td><td>${esc(e.cls)}</td><td>${esc(e.student)}</td><td>${e.date ? fmt(e.date) : ""}${e.wt ? " " + esc(e.wt) : ""}</td><td>${esc(shownVal(e, e.old))}</td><td>${esc(shownVal(e, e.new) || "—")}</td>
        <td>${["edit", "clear", "revert"].includes(e.kind) && e.student && !String(e.student).startsWith("(") && e.date !== "" || e.work ? `<button class="btn sm" data-rv="${k}">Qaytarish</button>` : ""}</td></tr>`).join("") || `<tr><td colspan="7" class="muted">Hozircha yozuv yo'q</td></tr>`}</table></div>
      <div class="row"><span class="sp"></span><button class="btn" data-x>Yopish</button></div>`, (mm, close) => {
      $("[data-x]", mm).onclick = () => close();
      mm.querySelectorAll("[data-rv]").forEach((b) => b.onclick = async () => { close(); if (await revertEntry(all[+b.dataset.rv])) render(); settingsAction("hist"); });

  }

function exportJson() {
  D.web.exported = new Date().toISOString(); save();
  const t = new Date(); download(`journal_${iso(t)}_${pad(t.getHours())}${pad(t.getMinutes())}.json`, JSON.stringify(D, null, 1));
}
function importJson() {
  const f = $("#file"); f.value = "";
  f.onchange = async () => {
    const file = f.files[0]; if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (!data || !Array.isArray(data.classes)) throw new Error("bu jurnal fayli emas");
      if (D.classes.length && !await confirmBox("Fayldan yuklash", `Hozirgi ${D.classes.length} ta sinf o'rniga fayldagi ${data.classes.length} ta sinf yuklanadi. Davom etamizmi?`, "Yuklash")) return;
      D = normalize(data); autoDates(); save(); S.ci = 0; go("today"); toast(`${D.classes.length} ta sinf yuklandi`);
    } catch (e) { toast("Faylni o'qib bo'lmadi: " + e.message); }
  };
  f.click();
}

function addClassDialog() {
  modal(`<h2>Yangi sinf</h2>
    <div class="row"><label class="f sp">Sinf<input type="text" id="cn" placeholder="6-A"></label><label class="f sp">Fan<input type="text" id="cs" placeholder="Matematika"></label></div>
    <label class="f">O'quvchilar (har qatorda bittadan — ro'yxatni nusxalab qo'yish mumkin)<textarea id="cl" placeholder="Aliyev Sardor&#10;Karimova Madina"></textarea></label>
    <div class="f"><b style="font-size:14px">Dars kunlari</b><div class="days" id="cw">${WD.slice(0, 6).map((w, k) => `<button data-k="${k}">${w}</button>`).join("")}</div></div>
    <div class="row"><span class="sp"></span><button class="btn" data-x>Bekor qilish</button><button class="btn pri" data-ok>Qo'shish</button></div>`, (mm, close) => {
    $("#cn", mm).focus();
    mm.querySelectorAll("#cw button").forEach((b) => b.onclick = () => b.classList.toggle("on"));
    $("[data-x]", mm).onclick = () => close();
    $("[data-ok]", mm).onclick = () => {
      const name = $("#cn", mm).value.trim(), subject = $("#cs", mm).value.trim();
      if (!name) { toast("Sinf nomini yozing"); return; }
      if (D.classes.some((c) => c.name === name && c.subject === subject)) { toast("Bunday sinf bor"); return; }
      const studs = $("#cl", mm).value.split(/\r?\n/).map((s) => s.replace(/^\s*\d+[.)]?\s*/, "").trim()).filter(Boolean);
      const weekdays = [...mm.querySelectorAll("#cw button.on")].map((b) => +b.dataset.k);
      const c = normalize({classes: [{name, subject, weekdays, dates: [], students: studs.map((n) => ({name: n, marks: {}}))}]}).classes[0];
      D.classes.push(c); const q = quarterOf(todayIso()); if (q && weekdays.length) genQuarter(q, [c]);
      save(); S.ci = D.classes.length - 1; close(); go("journal"); toast(`«${label(c)}» qo'shildi: ${studs.length} o'quvchi`);
    };
  });
}

/* ───────── o'quvchini faolsizlantirish: jurnal, hisobot va hisob-kitoblardan yashiriladi, ma'lumoti saqlanadi ─────────
   Faolsizlar c.students_off da turadi (kompyuter dasturi bu kalitni bilmaydi, shuning uchun u yerda ham ko'rinmaydi). */
const nMarks = (s) => Object.keys(s.marks).length + Object.keys(s.scores || {}).length;
const offLog = (c, s, kind) => (D.changelog = D.changelog || []).push({t: new Date().toISOString().slice(0, 19), cls: label(c), student: s.name, date: "", old: kind === "off" ? "faol" : "faolsiz", new: kind === "off" ? "faolsiz" : "faol", kind: kind === "off" ? "deactivate" : "activate"});
function deactivate(c, idx) {
  const items = idx.slice().sort((a, b) => a - b).map((i) => [i, c.students[i]]);
  for (const [i, st] of items) { st.off = {at: todayIso(), prev: i ? c.students[i - 1].name : null}; c.students_off.push(st); offLog(c, st, "off"); }
  c.students = c.students.filter((_, i) => !idx.includes(i));
  pushUndo([{kind: "off", c, items: items.map(([, st]) => st)}]); S.sel = null; save();
}
function activate(c, list) {
  for (const st of list) {
    c.students_off = c.students_off.filter((x) => x !== st);
    // o'z joyiga: faolsizlantirilgandagi oldingi qo'shnisidan keyin (u ham faolsiz bo'lsa — uning qo'shnisidan)
    let prev = st.off ? st.off.prev : undefined, pos = c.students.length;
    for (let guard = 0; prev !== undefined && guard < 1000; guard++) {
      if (prev === null) { pos = 0; break; }
      const k = c.students.findIndex((x) => x.name === prev); if (k >= 0) { pos = k + 1; break; }
      const o = c.students_off.find((x) => x.name === prev); prev = o && o.off ? o.off.prev : undefined;
    }
    delete st.off; c.students.splice(pos, 0, st); offLog(c, st, "on");
  }
  S.sel = null; save();
}

function makeDemo() {
  const names = ["Abdullayev Sardor", "Aliyeva Madina", "Botirov Jasur", "G'aniyeva Nodira", "Hasanov Bekzod", "Ismoilova Zarina", "Karimov Otabek", "Mirzayeva Dilnoza", "Nazarov Sherzod", "Olimova Gulnoza", "Qodirov Javohir", "Rahimova Nilufar"];
  const t = new Date(), y = t.getMonth() >= 8 ? t.getFullYear() : t.getFullYear() - 1;
  if (!D.settings.quarters.some(Boolean)) D.settings.quarters = [[`${y}-09-02`, `${y}-10-29`], [`${y}-11-05`, `${y}-12-27`], [`${y + 1}-01-08`, `${y + 1}-03-18`], [`${y + 1}-03-27`, `${y + 1}-05-25`]];
  const wd = [0, 2, 4, pyWd(todayIso())].filter((v, i, a) => v < 6 && a.indexOf(v) === i);
  const c = normalize({classes: [{name: "Namuna 6-A", subject: "Matematika", weekdays: wd, dates: [], students: names.map((n) => ({name: n, marks: {}}))}]}).classes[0];
  D.classes.push(c); const q = quarterOf(todayIso()); if (q) genQuarter(q, [c]);
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  for (const s of c.students) { const weak = rnd() < 0.2; for (const d of c.dates) { if (d >= todayIso() || isNoLesson(c, d)) continue; const r = rnd();
    if (r < (weak ? 0.15 : 0.04)) s.marks[d] = ["s", "s", "dq", "k"][Math.floor(rnd() * 4)]; else if (r < 0.45) s.marks[d] = String(weak ? 2 + Math.floor(rnd() * 4) : 5 + Math.floor(rnd() * 6)); } }

const UNDO = [];
function pushUndo(batch) { if (batch.length) { UNDO.push(batch); if (UNDO.length > 100) UNDO.shift(); } }
async function undoLast() {
  const batch = UNDO.pop(); if (!batch) { toast("Bekor qilinadigan o'zgarish yo'q"); return; }
  if (batch[0].kind === "off") {
    const {c, items} = batch[0], back = items.filter((st) => c.students_off.includes(st));
    if (!D.classes.includes(c) || !back.length) { toast("Bu o'quvchilar allaqachon faol"); return; }
    activate(c, back); render(); toast(`${back.length} ta o'quvchi qayta faollashtirildi`); return;
  }
  const live = batch.filter((u) => D.classes.includes(u.c) && u.c.students.includes(u.s) &&
    ((u.kind === "mark" ? u.s.marks[u.key] : (u.s.scores || {})[u.key]) ?? "") === u.nw);
  if (!live.length) { toast("Bu o'zgarish keyin yana o'zgargan — bekor qilinmadi"); return; }
  const prot = live.some((u) => { if (u.old === "") return false; if (u.kind !== "mark") return true; return !isAdditive(u.old, u.nw); });
  if (prot && isLocked() && !await unlock()) { UNDO.push(batch); return; }
  for (const u of live) {
    const b = u.kind === "mark" ? u.s.marks : (u.s.scores = u.s.scores || {});
    if (u.old === "") delete b[u.key]; else b[u.key] = u.old;
    if (u.nw !== "" && u.old !== "") (u.kind === "mark" ? log(u.c, u.s, u.key, u.nw, u.old) : logScore(u.c, u.s, u.key, u.nw, u.old));
  }
  save(); render(); toast(`Bekor qilindi: ${live.length} ta katak`);
}

  if (old !== "" && isLocked() && !await unlock()) return false;
  if (nv === "") delete sc[key]; else sc[key] = nv;

/* ───────── emaktab.uz saytidan to'g'ridan-to'g'ri (xatcho'p) ─────────
   Brauzer bu ilovaga emaktab.uz ga o'zi kirishga ruxsat bermaydi. Shuning uchun o'qituvchi emaktab'ga kirgan holda
   xatcho'pni bosadi: emkGrab() emaktab sahifasining ichida ishlaydi, Excel jurnallarni o'sha yerdan oladi va
   postMessage bilan shu ilovaga yuboradi. Login/parol hech qayerga uzatilmaydi. */
function emkGrab() {
  const APP = "__APP__", AO = new URL(APP).origin;
  const box = document.createElement("div");
  box.style.cssText = "position:fixed;top:12px;right:12px;z-index:2147483647;background:#fffdf8;color:#1b2a2f;border:2px solid #0b6f79;border-radius:14px;padding:12px 16px;font:15px/1.4 serif;max-width:360px;box-shadow:0 10px 30px rgba(0,0,0,.25);white-space:pre-line";
  const say = (t) => { box.textContent = "📒 Yo'qlama jurnali\n" + t; };
  document.body.appendChild(box);
  if (location.hostname !== "schools.emaktab.uz") {
    say("emaktab.uz ga kiring va «Sinflarim» sahifasida shu tugmani yana bosing.");
    if (confirm("Yo'qlama jurnali: «Sinflarim» sahifasi ochilsinmi? Ochilgach, tugmani yana bir bor bosing.")) location.href = "https://schools.emaktab.uz/v2/myclasses";
    setTimeout(() => box.remove(), 8000); return;
  }
  let ready = false;
  addEventListener("message", (e) => { if (e.origin === AO && e.data && e.data.type === "jurnal-ready") ready = true; });
  const w = window.open(APP + "#emaktab", "yoqlama_jurnal");
  if (!w) { say("Brauzer yangi oynani to'sib qo'ydi. emaktab.uz uchun qalqib chiquvchi oynalarga ruxsat bering va qayta bosing."); return; }
  const get = async (u) => { const r = await fetch(u, {credentials: "include"}); if (!r.ok) throw new Error("HTTP " + r.status); return r; };
  const state = (html) => {
    const i = html.indexOf("__JOURNAL__INITIAL__STATE__"); if (i < 0) return null;
    const k = html.indexOf("{", i); let d = 0, q = false, esc = false;
    for (let j = k; j < html.length; j++) {
      const ch = html[j];
      if (q) { if (esc) esc = false; else if (ch === "\\") esc = true; else if (ch === '"') q = false; }
      else if (ch === '"') q = true; else if (ch === "{") d++; else if (ch === "}" && !--d) return JSON.parse(html.slice(k, j + 1));
    }
    return null;
  };
  (async () => {
    say("Sinflar ro'yxati o'qilmoqda…");
    const r0 = await get("/v2/myclasses");
    if (/login\./.test(new URL(r0.url).hostname)) throw new Error("emaktab'ga kirilmagan — avval saytga kiring.");
    const doc = new DOMParser().parseFromString(await r0.text(), "text/html"), root = doc.getElementById("ContentPanelTeacher") || doc;
    const jobs = [], seen = new Set(); let cls = null;
    for (const a of root.querySelectorAll("a[href]")) {
      const href = new URL(a.getAttribute("href"), r0.url).href;
      if (href.includes("/v2/class?class=")) cls = a.textContent.trim();
      else if (cls && /\/journal\/school\/\d+\/group\/\d+\/subject\/\d+/.test(href) && !seen.has(href)) { seen.add(href); jobs.push({cls, subject: (a.title || a.textContent).trim(), url: href}); }
    }
    if (!jobs.length) throw new Error("«Sinflarim» sahifasida jurnal topilmadi.");
    const files = [], errs = [];
    for (const [n, jb] of jobs.entries()) {
      say(`Jurnallar yuklanmoqda: ${n + 1} / ${jobs.length}\n${jb.cls} · ${jb.subject}`);
      try {
        const st = state(await (await get(jb.url)).text()), hd = st && st.journalHeader;
        if (!hd) throw new Error("chorak topilmadi");
        const [, school, group, subject] = jb.url.match(/\/school\/(\d+)\/group\/(\d+)\/subject\/(\d+)/);
        const x = await get(`/v2/excel?action=gjsxls&school=${school}&group=${group}&subgroup=0&subject=${subject}&period=${hd.currentPeriodId}`);
        if (/html/i.test(x.headers.get("content-type") || "")) throw new Error("Excel o'rniga sahifa keldi");
        files.push({name: `${jb.cls}_${jb.subject}.xls`, data: await x.arrayBuffer()});
      } catch (e) { errs.push(`${jb.cls} · ${jb.subject}: ${e.message}`); }
    }
    if (!files.length) throw new Error("Hech bir jurnal yuklanmadi.\n" + errs.join("\n"));
    say("Jurnal ilovasiga yuborilmoqda…");
    for (let t = 0; !ready && t < 100; t++) await new Promise((r) => setTimeout(r, 200));
    if (!ready || w.closed) throw new Error("Jurnal ilovasi javob bermadi. Ilova oynasi yopilmaganini tekshirib, qayta bosing.");
    w.postMessage({type: "emaktab-files", files}, AO, files.map((f) => f.data));
    say(`✓ ${files.length} ta jurnal yuborildi — Jurnal oynasida tasdiqlang.` + (errs.length ? `\nYuklanmadi:\n${errs.join("\n")}` : ""));
    try { w.focus(); } catch (e) {}
  })().catch((e) => say("✗ " + e.message));
}

  const fs = rowH < 5 ? 7.5 : rowH < 6.5 ? 9 : 10.5;
  const printCss = `<style>@media print{@page{size:A4 ${wide ? "landscape" : "portrait"};margin:10mm}
    .blank{break-inside:avoid}.blank h2{font-size:14pt}.blank .row{margin-bottom:2mm}
    table.bl{margin-top:0;font-size:${fs}pt;table-layout:fixed;width:100%}table.bl .bn{min-width:0;width:${nameW}%;overflow:hidden;white-space:nowrap}table.bl .nr{width:7mm}table.bl td{height:${rowH.toFixed(2)}mm;padding:0 1.5mm}table.bl th{height:auto;padding:1mm}}</style>`;
  return `${printCss}<div class="row noprint" style="gap:8px"><div class="seg">${[["day", "Kun"], ["week", "Hafta"], ["month", "Oy"]].map(([k, n]) => `<button class="${mode === k ? "on" : ""}" data-bm="${k}">${n}</button>`).join("")}</div>
      <input type="date" id="bday" value="${S.bday || t}" style="max-width:180px"><span class="muted">Faqat ismlar va dars kunlari — belgilar chiqmaydi.</span></div>
    ${chunks.map((ds, n) => `<div class="blank ${n ? "pb" : ""}"><div class="row"><h2 class="sp">${esc(label(c))}</h2><span>${fmt(lo)} – ${fmt(hi)}</span></div>
      <table class="bl"><tr><th ${two ? 'rowspan="2"' : ""} class="nr">№</th><th ${two ? 'rowspan="2"' : ""} class="bn">O'quvchi</th>${ds.map((d) => two ? `<th colspan="2">${fmt(d).slice(0, 5)} ${WD[pyWd(d)]}</th>` : `<th>${mode === "month" ? d.slice(8) : fmt(d).slice(0, 5)}<br><small>${WD[pyWd(d)]}</small></th>`).join("")}</tr>
      ${two ? `<tr>${ds.map(() => "<th><small>Davomat</small></th><th><small>Ball</small></th>").join("")}</tr>` : ""}
      ${c.students.map((s, i) => `<tr><td>${i + 1}</td><td class="bn">${esc(s.name)}</td>${"<td></td>".repeat(ds.length * (two ? 2 : 1))}</tr>`).join("")}</table></div>`).join("")}
    ${dates.length ? "" : `<div class="muted">Bu davrda dars kunlari yo'q.</div>`}`;
}

/* ───────── yangi o'quv yiliga o'tish ───────── */
function bumpName(n) { return String(n).replace(/^(\d+)/, (x) => String(+x + 1)); }
function rollover() {
  modal(`<h2>Yangi o'quv yiliga o'tish</h2>
    <div class="muted">Avval butun jurnal arxiv fayl sifatida yuklab olinadi. Keyin tanlangan sinflar uchun o'sha o'quvchilar bilan yangi, bo'sh jurnal ochiladi (baholar, yo'qlama, summativ ishlar yangi jurnalga o'tmaydi). Nomni bo'sh qoldirsangiz, sinf olib tashlanadi.</div>
    ${D.classes.map((c, i) => `<div class="row" style="gap:8px;flex-wrap:nowrap"><input type="checkbox" data-ri="${i}" checked style="width:20px;height:20px;flex:none"><span style="flex:1 1 40%"><b>${esc(label(c))}</b></span>→<input type="text" data-rn="${i}" value="${esc(bumpName(c.name))}" style="flex:1 1 40%"></div>`).join("")}
    <label class="row" style="gap:8px"><input type="checkbox" id="rq" checked style="width:20px;height:20px"> Chorak sanalarini tozalash (yangi yil uchun qayta kiritasiz)</label>
    <div class="row"><span class="sp"></span><button class="btn" data-x>Bekor qilish</button><button class="btn pri" data-ok>Arxivlash va o'tish</button></div>`, (mm, close) => {
    $("[data-x]", mm).onclick = () => close();
    $("[data-ok]", mm).onclick = async () => {
      const items = D.classes.map((c, i) => ({c, on: $(`[data-ri="${i}"]`, mm).checked, nw: $(`[data-rn="${i}"]`, mm).value.trim()})).filter((x) => x.on);
      if (!items.length) { toast("Hech qaysi sinf tanlanmagan"); return; }
      const keys = items.filter((x) => x.nw).map((x) => clsKey(x.nw) + "|" + clsKey(x.c.subject));
      if (new Set(keys).size !== keys.length) { toast("Yangi nomlar takrorlanmoqda"); return; }
      const rolled = new Set(items.map((x) => x.c));
      const clash = items.find((x) => x.nw && D.classes.some((c) => !rolled.has(c) && clsKey(c.name) === clsKey(x.nw) && clsKey(c.subject) === clsKey(x.c.subject)));
      if (clash) { toast(`«${clash.nw}» nomli jurnal allaqachon bor`); return; }
      const resetQ = $("#rq", mm).checked; close();
      if (isLocked() && !await unlock()) return;
      const lbl = (() => { const y = new Date().getFullYear(); return new Date().getMonth() >= 8 ? `${y}-${y + 1}` : `${y - 1}-${y}`; })();
      D.web.exported = new Date().toISOString(); download(`journal_arxiv_${lbl}_${todayIso()}.json`, JSON.stringify(D, null, 1));
      const created = items.filter((x) => x.nw).map((x) => normalize({classes: [{name: x.nw, subject: x.c.subject, weekdays: (x.c.weekdays || []).slice(), has_exam: !!x.c.has_exam,
        students: x.c.students.map((s) => ({name: s.name, marks: {}}))}]}).classes[0]);
      D.classes = D.classes.filter((c) => !rolled.has(c)).concat(created).sort((a, b) => a.name.localeCompare(b.name, "uz", {numeric: true}) || a.subject.localeCompare(b.subject));
      if (resetQ) D.settings.quarters = [null, null, null, null];
      D.web.gen = []; UNDO.length = 0;
      (D.changelog = D.changelog || []).push({t: new Date().toISOString().slice(0, 19), cls: "(o'quv yili)", student: "(yangi yilga o'tkazish)", date: "", old: lbl, new: `${items.length} jurnal → ${created.length} yangi`, kind: "rollover"});
      save(); S.ci = 0; S.sec = resetQ ? 1 : 5; go("settings"); toast(`Arxiv yuklab olindi. ${created.length} ta yangi jurnal ochildi${resetQ ? " — endi choraklarni kiriting" : ""}`);
    };
  });
}
function backupAge() { if (!D.web.exported) return null; return Math.floor((Date.now() - Date.parse(D.web.exported)) / 864e5); }

/* ───────── PWA: o'rnatish va oflayn ishlash ───────── */
let installEvt = null;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvt = e; if (S.page === "settings") render(); });
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;

/* ───────── ishga tushirish ───────── */
if (document.getElementById("app")) {
  D = load(); autoDates(); if (D.classes.some((c) => c.plan && c.plan.on)) { reflowAll(); save(); }
  if (D.web.density === "kompakt") V.mode = "quarter";
  render(); emkReady();
  setInterval(() => { if (S.page === "journal" && isLocked() !== $("[data-lock]")?.textContent.includes("🔒")) renderNav(); }, 30000);
}
</script>
