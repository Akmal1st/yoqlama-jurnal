  if (ab.length) return toks.length === 1 ? ab[0] : null;
  const gs = []; let late = false;
  for (const x of toks) { if (x === "kq") { if (late) return null; late = true; } else if (/^(10|[1-9])$/.test(x)) gs.push(+x); else return null; }

function morphKids(a, b) {
  const an = [...a.childNodes], bn = [...b.childNodes];
  if (an.length !== bn.length) { a.replaceChildren(...bn); return; }
  an.forEach((x, i) => morphNode(x, bn[i]));
}
function morphNode(a, b) {
  if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName) { a.replaceWith(b); return; }
  if (a.nodeType !== 1) { if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue; return; }
  if (a.isEqualNode(b)) return;
  const sameAttrs = a.attributes.length === b.attributes.length && [...a.attributes].every((x) => b.getAttribute(x.name) === x.value);
  if (!sameAttrs || !a.children.length || /^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(a.nodeName)) { a.replaceWith(b); return; }
  morphKids(a, b);
}

// davr oynasi: rejim (Kun/Hafta/Oy/Chorak) va oy taqvimi — nuqta dars kuni, bosilgan sana «Kun»da ochiladi
function perPop(btn) {
  const old = $(".perpop"); if (old) { old.remove(); return; }
  const c = D.classes[S.ci], t = todayIso(); let mo = V.anchor.slice(0, 7);
  const el = h(`<div class="perpop" role="dialog" aria-label="Davrni tanlash"></div>`); document.body.append(el);
  const close = () => { el.remove(); document.removeEventListener("mousedown", out, true); document.removeEventListener("keydown", esc2, true); };
  const out = (e) => { if (!el.contains(e.target) && !btn.contains(e.target)) close(); };
  const esc2 = (e) => { if (e.key === "Escape") { e.stopPropagation(); close(); } };
  const draw = () => {
    const [y, mm] = mo.split("-").map(Number), first = `${mo}-01`, n = new Date(y, mm, 0).getDate(), [lo, hi] = vRange();
    let cells = WD.map((w) => `<span class="pw">${w}</span>`).join("") + "<span></span>".repeat(pyWd(first));
    for (let k = 1; k <= n; k++) {
      const d = `${mo}-${pad(k)}`, les = c.dates.includes(d) && !isNoLesson(c, d);
      cells += `<button class="pd ${les ? "les" : ""} ${d === t ? "today" : ""} ${lo <= d && d <= hi ? "inr" : ""}" data-day="${d}" title="${fmt(d)}${les ? " · dars" : ""}">${k}</button>`;
    }
    el.innerHTML = `<div class="seg pmodes">${viewModes().map(([k, nm]) => `<button class="${V.mode === k ? "on" : ""}" data-mode="${k}">${nm}</button>`).join("")}</div>
      <div class="pch"><button class="btn btn-sm" data-cm="-1" aria-label="Oldingi oy">‹</button><b>${MONTHS[mm - 1]} ${y}</b><button class="btn btn-sm" data-cm="1" aria-label="Keyingi oy">›</button></div>
      <div class="pcal">${cells}</div><div class="muted pnote">Nuqta — dars kuni. Sanani bossangiz, o'sha dars «Kun» ko'rinishida ochiladi.</div>`;
    el.querySelectorAll("[data-mode]").forEach((b) => b.onclick = () => { V.mode = b.dataset.mode; close(); render(); scrollToday(); });
    el.querySelectorAll("[data-cm]").forEach((b) => b.onclick = () => { const z = new Date(y, mm - 1 + +b.dataset.cm, 1); mo = iso(z).slice(0, 7); draw(); });
    el.querySelectorAll("[data-day]").forEach((b) => b.onclick = () => { V.anchor = b.dataset.day; V.mode = "day"; close(); render(); });
  };
  draw();
  const r = btn.getBoundingClientRect(), w = el.offsetWidth;
  el.style.top = r.bottom + 8 + "px"; el.style.left = Math.max(8, Math.min(r.left + r.width / 2 - w / 2, window.innerWidth - w - 8)) + "px";
  document.addEventListener("mousedown", out, true); document.addEventListener("keydown", esc2, true);
}

function swipeDrag(el, done) {
  let x0 = null, dx = 0;
  el.addEventListener("pointerdown", (e) => { x0 = e.clientX; dx = 0; el.setPointerCapture(e.pointerId); el.style.transition = "none"; });
  el.addEventListener("pointermove", (e) => {
    if (x0 === null) return; dx = e.clientX - x0;
    el.style.transform = `translateX(${dx}px) rotate(${dx / 25}deg)`;
    el.classList.toggle("yes", dx > 40); el.classList.toggle("no", dx < -40);
  });
  const end = () => {
    if (x0 === null) return; x0 = null; el.style.transition = "";
    if (Math.abs(dx) > 80) { el.style.transform = `translateX(${dx > 0 ? 120 : -120}%)`; setTimeout(() => done(dx), 120); }
    else { el.style.transform = ""; el.classList.remove("yes", "no"); }
  };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
}

// any=true — ilk ochilishdagi «Fayldan»: journal.json, zaxira yoki eMaktab Excel; turi o'zi aniqlanadi (boshlash.js)
function importJson(any) {
  const f = $("#file"); f.value = "";
  f.accept = any ? ".json,.xls,.xlsx,application/json,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" : ".json,application/json"; f.multiple = !!any;
  f.onchange = async () => {
    const all = [...f.files], file = all[0]; if (!file) return;
    if (all.some((x) => !/\.json$/i.test(x.name)) || all.length > 1) { importEmaktabFiles(all, {}); return; }
    try {
      let data = JSON.parse(await file.text());
      data = await openSealed(data);
      if (data && data.type === "emaktab-bundle") { importEmaktabFiles(bundleFiles(data)); return; }
      if (!data || !Array.isArray(data.classes)) throw new Error("bu jurnal fayli emas");
      if (tooNew(data)) throw new Error("fayl ilovaning yangiroq versiyasida saqlangan — sahifani yangilang");
      if (D.classes.length && !await confirmBox("Fayldan yuklash", `Hozirgi ${D.classes.length} ta sinf o'rniga fayldagi ${data.classes.length} ta sinf yuklanadi. Davom etamizmi?`, "Yuklash")) return;
      await keepBefore();
      D = migrate(normalize(data)); autoDates(); save(); S.ci = 0; go("today"); toast(`${D.classes.length} ta sinf yuklandi`);
    } catch (e) { toast("Faylni o'qib bo'lmadi: " + e.message); }
  };
  f.click();
}

/* ───────── o'quvchini faolsizlantirish: jurnal, hisobot va hisob-kitoblardan yashiriladi, ma'lumoti saqlanadi ─────────
   Faolsizlar c.students_off da turadi. */
const nMarks = (s) => Object.keys(s.marks).length + Object.keys(s.scores || {}).length;
const offLog = (c, s, kind) => (D.changelog = D.changelog || []).push({t: nowLocal(), cls: label(c), student: s.name, date: "", old: kind === "off" ? "faol" : "faolsiz", new: kind === "off" ? "faolsiz" : "faol", kind: kind === "off" ? "deactivate" : "activate"});
function deactivate(c, idx, join = false) {
  const items = idx.slice().sort((a, b) => a - b).map((i) => [i, c.students[i]]);
  for (const [i, st] of items) { st.off = {at: todayIso(), prev: i ? c.students[i - 1].name : null}; c.students_off.push(st); offLog(c, st, "off"); }
  c.students = c.students.filter((_, i) => !idx.includes(i));
  const u = {kind: "off", c, items: items.map(([, st]) => st)};
  // join — oldingi faolsizlantirish bilan bitta ↶ da qaytadi (boshqa fanlar)
  if (join && UNDO.length && UNDO[UNDO.length - 1][0].kind === "off") UNDO[UNDO.length - 1].push(u); else pushUndo([u]);
  S.sel = null; save();
}
/* shu sinfning boshqa fanlari (sinf nomi bir xil) va ulardagi shu ismli o'quvchilar: off=true — faolsizlar ichidan */
function sameInOthers(c, names, off = false) {
  const want = new Set(names.map(normName));
  return D.classes.filter((o) => o !== c && clsKey(o.name) === clsKey(c.name))
    .map((o) => ({c: o, list: (off ? o.students_off : o.students).filter((s) => want.has(normName(s.name)))})).filter((x) => x.list.length);
}
const subjList = (others) => others.map((x) => x.c.subject || x.c.name).join(", ");
function offOthers(others) {
  for (const {c, list} of others) deactivate(c, list.map((s) => c.students.indexOf(s)).filter((i) => i >= 0), true);
}
async function askOthers(c, names, off) {
  const others = sameInOthers(c, names, off); if (!others.length) return 0;
  const who = names.length === 1 ? `«${names[0]}»` : `${names.length} ta o'quvchi`;
  if (!await confirmBox(off ? "Boshqa fanlarda ham faollashtirish" : "Boshqa fanlarda ham faolsizlantirish",
    `${who} ${c.name} sinfining boshqa fanlarida ham bor: ${subjList(others)}.\nUlarda ham ${off ? "faollashtirilsinmi" : "faolsizlantirilsinmi"}?`, off ? "Ha, faollashtirish" : "Ha, faolsizlantirish")) return 0;
  if (off) for (const x of others) activate(x.c, x.list); else offOthers(others);
  render(); return others.length;
}
function activate(c, list) {
  for (const st of list) {
    c.students_off = c.students_off.filter((x) => x !== st);
    // o'z joyiga: faolsizlantirilgandagi oldingi qo'shnisidan keyin (u ham faolsiz bo'lsa — uning qo'shnisidan)
    let prev = st.off ? st.off.prev : undefined, pos = c.students.length;
    for (let guard = 0; prev !== undefined && guard < 1000; guard++) {
      if (prev === null) { pos = 0; break; }
      const k = c.students.findIndex((x) => x.name === prev); if (k >= 0) { pos = k + 1; break; }
      const o = c.students_off.find((x) => x.name === prev); prev = o && o.off ? o.off.prev : undefined;
    }
    delete st.off; c.students.splice(pos, 0, st); offLog(c, st, "on");
  }
  S.sel = null; save();
}

  if (!D.settings.quarters.some(Boolean)) D.settings.quarters = [[`${y}-09-02`, `${y}-10-29`], [`${y}-11-05`, `${y}-12-27`], [`${y + 1}-01-08`, `${y + 1}-03-18`], [`${y + 1}-03-27`, `${y + 1}-05-25`]];
  const wd = [0, 2, 4, pyWd(todayIso())].filter((v, i, a) => v < 6 && a.indexOf(v) === i);
  const c = normalize({classes: [{name: "Namuna 6-A", subject: "Matematika", weekdays: wd, dates: [], students: names.map((n) => ({name: n, marks: {}}))}]}).classes[0];
  D.classes.push(c); const q = quarterOf(todayIso()); if (q) genQuarter(q, [c]);
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  for (const s of c.students) { const weak = rnd() < 0.2; for (const d of c.dates) { if (d >= todayIso() || isNoLesson(c, d)) continue; const r = rnd();
    if (r < (weak ? 0.15 : 0.04)) s.marks[d] = ["s", "s", "dq", "k"][Math.floor(rnd() * 4)]; else if (r < 0.45) s.marks[d] = String(weak ? 2 + Math.floor(rnd() * 4) : 5 + Math.floor(rnd() * 6)); } }

}

const UNDO = [];
function pushUndo(batch) { if (batch.length) { UNDO.push(batch); if (UNDO.length > 100) UNDO.shift(); } }
async function undoLast() {
  const batch = UNDO.pop(); if (!batch) { toast("Bekor qilinadigan o'zgarish yo'q"); return; }
  if (batch[0].kind === "off") {
    let n = 0;
    for (const {c, items} of batch) { const back = items.filter((st) => c.students_off.includes(st)); if (D.classes.includes(c) && back.length) { activate(c, back); n += back.length; } }
    if (!n) { toast("Bu o'quvchilar allaqachon faol"); return; }
    render(); toast(`${batch.length > 1 ? `${batch.length} ta fanda ` : ""}${n} ta o'quvchi qayta faollashtirildi`); return;
  }
  if (batch[0].kind === "pay") {
    const {c, s, p, i} = batch[0];
    if (!D.classes.includes(c) || !c.students.includes(s)) { toast("Bu o'quvchi endi jurnalda yo'q — to'lov qaytarilmadi"); return; }
    if (isLocked() && !await unlock()) { UNDO.push(batch); return; }
    s.pays = s.pays || []; if (!s.pays.includes(p)) { s.pays.splice(Math.min(i, s.pays.length), 0, p); if (p.pk) s.pkBase = (s.pkBase || 0) + p.pk; }
    save(); render(); toast(`To'lov qaytarildi: ${s.name}, ${som(p.sum)}`); return;
  }
  const live = batch.filter((u) => D.classes.includes(u.c) && u.c.students.includes(u.s) &&
    ((u.kind === "mark" ? u.s.marks[u.key] : (u.s.scores || {})[u.key]) ?? "") === u.nw);
  if (!live.length) { toast("Bu o'zgarish keyin yana o'zgargan — bekor qilinmadi"); return; }
  const arq = live.find((u) => u.kind === "mark" ? ARX.dateLocked(u.key, u.c) : ARX.scoreLocked(u.c, u.key));
  if (arq) { UNDO.push(batch); ARX.deny(arq.kind === "mark" ? quarterOf(arq.key) : ARX.scoreQ(arq.c, arq.key)); return; }
  const prot = live.some((u) => { if (u.old === "") return false; if (u.kind !== "mark") return true; return !isAdditive(u.old, u.nw); });
  if (prot && isLocked() && !await unlock()) { UNDO.push(batch); return; }
  for (const u of live) {
    const b = u.kind === "mark" ? u.s.marks : (u.s.scores = u.s.scores || {});
    if (u.old === "") delete b[u.key]; else b[u.key] = u.old;
    if (u.kx) for (const [f, v] of [["fk", u.kx[0]], ["fp", u.kx[1]]]) { if (v) (u.s[f] = u.s[f] || {})[u.key] = v; else if (u.s[f]) { delete u.s[f][u.key]; if (!Object.keys(u.s[f]).length) delete u.s[f]; } }   // kriterial belgilar (kriterial.js)
    if (u.nw !== "" && u.old !== "") (u.kind === "mark" ? log(u.c, u.s, u.key, u.nw, u.old) : logScore(u.c, u.s, u.key, u.nw, u.old));
  }
  save(); render(); toast(`Bekor qilindi: ${live.length} ta katak`);
}

function logScore(c, s, key, old, nw) {

  const wt = w ? wTypeName(w) : ({exam: "IMTIHON", "final:y": "YILLIK", "final:f": "YAKUNIY"}[key] || (key.startsWith("final:q") ? `${key.slice(7)}-CHORAK` : key));
  lg.push({t: nowLocal(), cls: label(c), student: s.name, sid: s.id, date: w ? w.date : "", old, new: nw, kind: nw === "" ? "clear" : "edit", work: key, wt});
}
async function putScore(c, s, key, nv, batch) {
  const sc = s.scores = s.scores || {}, old = sc[key] ?? "";
  if (old === nv) return true;
  if (ARX.scoreLocked(c, key)) { ARX.deny(ARX.scoreQ(c, key)); return false; }
  if (old !== "" && isLocked() && !await unlock()) return false;
  if (nv === "") delete sc[key]; else sc[key] = nv;
  logScore(c, s, key, old, nv); ARX.noteScore(c, s, key, old, nv); (batch || []).push({kind: "score", c, s, key, old, nw: nv}); if (!batch) pushUndo([{kind: "score", c, s, key, old, nw: nv}]);

}

const gnum = (v) => String(+(+v).toPrecision(6));

function bsbStats(qmax, rows, ceilTotal) {   // ceilTotal: CHSB testi — umumiy ball yuqoriga butunga yaxlitlanadi

  out.mastery = out.mean_pct;                     // o'zlashtirish: sinf to'plagan jami ball / mumkin bo'lgan jami ball (Akmal, 2026-11-02)
  const ranked = stu.slice().sort((a, b) => b.total - a.total), k = Math.max(1, +pyFixed(0.27 * n, 0));

function bsbRecs(an) {

  if (!n || !an.questions.length) return {good, bad: ["Tahlil uchun ishtirok etgan o'quvchilar va ballar kerak."], tips};
  const g = an.grades, qs = an.questions, stu = an.students, qp = (q) => `${q.i}-savol (${f0(q.pct)}%)`;
  // — yutuqlar —
  if (an.quality >= 60) good.push(`Bilim sifati yuqori: ${f0(an.quality)}% o'quvchi «4» va «5» baho olgan.`);
  if (g[5]) good.push(`«5» baho olganlar: ${g[5]} ta (${bsbNames(stu.filter((s) => s.grade === 5).map((s) => s.name))}).`);
  const easy = qs.filter((q) => q.pct >= 75);
  if (easy.length) good.push("Yaxshi o'zlashtirilgan savollar: " + easy.map(qp).join(", ") + " — bu mavzular bo'yicha bilim mustahkam.");
  if (!g[2]) good.push("Ishtirok etgan barcha o'quvchi «3» dan past bo'lmagan baho olgan.");
  if (an.mean_pct >= 66 && !good.length) good.push(`O'rtacha natija yaxshi: ${f0(an.mean_pct)}%.`);
  if (!good.length) good.push("Sezilarli yutuqlar aniqlanmadi — quyidagi tavsiyalarga e'tibor bering.");
  // — kamchiliklar —
  const hard = qs.filter((q) => q.pct < 50).sort((a, b) => a.pct - b.pct);
  if (hard.length) bad.push("O'zlashtirishi past savollar: " + hard.map(qp).join(", ") + ".");
  const skipped = qs.filter((q) => q.zero >= Math.max(2, 0.3 * n));
  if (skipped.length) bad.push("Ko'pchilik 0 ball olgan savollar: " + skipped.map((q) => `${q.i}-savol (${q.zero} ta)`).join(", ") + " — mavzu o'tilmagan, shart tushunarsiz yoki vaqt yetmagan bo'lishi mumkin.");
  const weakD = qs.filter((q) => q.d !== null && q.d < 0.2 && q.pct < 90);
  if (weakD.length) bad.push("Kuchli va kuchsiz o'quvchilarni yaxshi ajratmagan savollar: " + weakD.map((q) => `${q.i}-savol`).join(", ") + " — savol shakli yoki murakkabligini ko'rib chiqing.");
  if (qs.length >= 6) {
    const t = Math.floor(qs.length / 3), first = sumOf(qs.slice(0, t).map((q) => q.pct)) / t, last = sumOf(qs.slice(-t).map((q) => q.pct)) / t;
    if (first - last >= 25) bad.push(`Oxirgi savollar (${f0(last)}%) boshidagilardan (${f0(first)}%) ancha past — vaqt yetmagan yoki murakkab topshiriqlar qiyinlik tug'dirgan bo'lishi mumkin.`);
  }
  if (g[2]) bad.push(`«2» baho olganlar: ${g[2]} ta (${f0(100 * g[2] / n)}%): ${bsbNames(stu.filter((s) => s.grade === 2).map((s) => s.name))}.`);
  if (an.quality < 40) bad.push(`Bilim sifati past: faqat ${f0(an.quality)}% o'quvchi «4» va «5» baho olgan.`);
  if (an.absent.length) bad.push(`Ishtirok etmaganlar: ${an.absent.length} ta (${bsbNames(an.absent)}).`);
  if (an.empty_cells) bad.push(`${an.empty_cells} ta katak to'ldirilmagan — hisobda 0 ball deb olindi.`);
  if (!bad.length) bad.push("Jiddiy kamchiliklar aniqlanmadi.");
  // — tavsiyalar —
  for (const q of hard.slice(0, 4)) tips.push(`${q.i}-savol (${f0(q.pct)}%): ${q.pct < 35 ? "mavzuni qayta tushuntiring, o'xshash misollarni sinfda birgalikda yeching" : "xatolarni tahlil qiling va qo'shimcha mashqlar bering"}.`);

    break;
  }
  if (near.length) tips.push("Yuqori bahoga yaqin o'quvchilar — qisqa takrorlash bilan natijani oshirish mumkin: " + bsbNames(near) + ".");
  const top = stu.filter((s) => s.grade === 5).map((s) => s.name);

function printDoc(html, land, fit, fname) {
  let el = document.getElementById("pdoc"); if (!el) { el = document.createElement("div"); el.id = "pdoc"; document.body.append(el); }
  el.innerHTML = `<div class="pd">${html}</div>`; document.body.classList.add("pdoc");
  let st = document.getElementById("pdoc-css"); if (!st) { st = document.createElement("style"); st.id = "pdoc-css"; document.head.append(st); }
  let zoom = 1, mg = 12;
  if (fit) {                       // bitta varaqqa sig'dirish: har ikki yo'nalishda o'lchab, yozuv kattaroq chiqqanini olamiz
    mg = 10; const pd = el.firstChild, mm = 96 / 25.4, keep = el.getAttribute("style");
    el.setAttribute("style", "display:block;position:absolute;left:-99999px;top:0;visibility:hidden");
    const best = (lnd) => {
      const pw = (lnd ? 277 : 190) * mm, ph = (lnd ? 190 : 277) * mm;
      const fits = (z) => { pd.style.width = pw / z + "px"; return pd.scrollHeight * z <= ph * 0.96 && pd.scrollWidth <= pw / z + 1; };
      if (fits(1)) return 1;
      let lo = 0.25, hi = 1; for (let i = 0; i < 12; i++) { const mid = (lo + hi) / 2; if (fits(mid)) lo = mid; else hi = mid; }
      return lo;
    };
    const zp = best(!!land), zo = best(!land);
    if (zo > zp * 1.05) { land = !land; zoom = zo; } else zoom = zp;
    pd.style.width = ""; if (keep === null) el.removeAttribute("style"); else el.setAttribute("style", keep);
  }
  st.textContent = `@media print{@page{size:A4 ${land ? "landscape" : "portrait"};margin:${mg}mm}${fit ? `#pdoc>.pd{zoom:${zoom.toFixed(3)}}` : ""}}`;
  if (fname) {                     // «PDF sifatida saqlash» fayl nomini sahifa sarlavhasidan oladi
    const old = document.title, back = () => { document.title = old; window.removeEventListener("afterprint", back); };
    document.title = fname; window.addEventListener("afterprint", back); setTimeout(back, 120000);
  }
  window.print();                // tozalash keyingi render() da (ba'zi telefonlarda print() kutmaydi)
}
function clearPrintDoc() { document.body.classList.remove("pdoc"); const st = document.getElementById("pdoc-css"); if (st) st.remove(); }

      $("#ti", mm).textContent = !w ? "Yangi ish yaratiladi: sana — tahlil sanasi, maksimal ball — savollar yig'indisi." : Math.abs(w.max - tot) < 1e-9 ? "Ballar o'zgarishsiz yoziladi." : `Tahlildagi maksimal ball (${gnum(tot)}) ishning maksimalidan (${fmtNum(w.max)}) farq qiladi — ballar proporsional qayta hisoblanadi.`; };
    $("#tw", mm).onchange = info; info();

  });

  let w = works.find((x) => x.id === wid);
  if (!w) {
    if (!quarterOf(B.date)) { toast(`${fmt(B.date)} biror chorakka kirmaydi — «Sozlamalar → Dars kunlari va choraklar»da choraklarni belgilang`); return; }
    reviveWork(c, "bsb", B.date); w = {id: newWorkId(c), type: "bsb", date: B.date, max: Math.round(tot * 10) / 10, title: B.title.trim()}; c.works.push(w); save();
  }
  const scale = Math.abs(w.max - tot) > 1e-9, batch = []; let done = 0, skipped = 0;
  for (const s of an.students) {
    const st = c.students.find((x) => x.name === s.name), v = Math.round((scale ? s.total * w.max / tot : s.total) * 10) / 10;
    if (await putScore(c, st, w.id, v, batch)) done++; else skipped++;
  }
  pushUndo(batch); const q = quarterOf(w.date); if (q) S.sq = q;
  toast(`BSB (${fmt(w.date)}, maks. ${fmtNum(w.max)}): ${done} ta o'quvchining bali yozildi${skipped ? `; ${skipped} tasi himoya tufayli o'zgarmadi` : ""}${an.absent.length ? `; ishtirok etmaganlar (${an.absent.length}) bo'sh qoldi` : ""}`);
  render();
}

/* ───────── emaktab Excel import ───────── */
function importExcel() {
  const f = document.createElement("input"); f.type = "file"; f.accept = ".xls,.xlsx,.json,application/json,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"; f.multiple = true;
  f.onchange = () => { if (f.files.length) importEmaktabFiles([...f.files]); };
  f.click();
}
// xatcho'p saqlagan «emaktab_jurnallar.json» ichidagi Excel fayllar
function bundleFiles(data) {
  return (data.files || []).map((f) => { const bin = atob(f.b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new File([u], f.name || "emaktab.xls"); });
}
async function expandFiles(files) {
  const out = [];
  for (const f of files) {
    if (!/\.json$/i.test(f.name)) { out.push(f); continue; }
    let d = null; try { d = JSON.parse(await f.text()); } catch (e) { /* jurnal fayli emas */ }
    if (d && d.type === "emaktab-bundle") out.push(...bundleFiles(d)); else throw new Error(`«${f.name}» emaktab fayli emas`);
  }
  return out;
}
// tasdiq oynasisiz import, natija va «Bekor qilish» — emk-bir.js (Akmal, 2026-11-06)
function importEmaktabFiles(files, opts) { return EMK1.run(files, opts || {}); }

/* eMaktab sahifalarini o'qish: xatcho'p (emkGrab) va ilovaning o'zidan import (emk-server.js) uchun umumiy.
   emkGrab ichiga matn bo'lib qo'yiladi (emkCode, tests/make_emk.mjs), shuning uchun tashqi nomlarga tayanmaydi. */
function emkLib() {
  // html[k] === "{" dan boshlangan JSON obyektini o'qiydi (qavslar sanaladi, satr ichidagilari hisobga olinmaydi)
  const jsonAt = (html, k) => {
    if (k < 0 || html[k] !== "{") return null;
    let d = 0, q = false, esc = false;
    for (let j = k; j < html.length; j++) {
      const ch = html[j];
      if (q) { if (esc) esc = false; else if (ch === "\\") esc = true; else if (ch === '"') q = false; }
      else if (ch === '"') q = true; else if (ch === "{") d++; else if (ch === "}" && !--d) { try { return JSON.parse(html.slice(k, j + 1)); } catch (e) { return null; } }
    }
    return null;
  };
  const state = (html) => { const i = html.indexOf("__JOURNAL__INITIAL__STATE__"); return i < 0 ? null : jsonAt(html, html.indexOf("{", i)); };
  /* «Mening sinflarim» → [{cls, subject, url}]. Yangi sahifada sinflar havolalarda emas, skript ichidagi JSON da
     (window.__TEACHERV2__INITIAL__STATE__ = {groups: {"groups": [{name, journal: [{subjectName, subgroupName, journalUrl}]}]}}) —
     shu asosiy manba. Eski sahifa (havolalar): jurnal sinfga tartib bo'yicha emas, guruh ID si bo'yicha biriktiriladi —
     bir sinfning bir nechta havolasi (rasm, «Fayllar», sinf rahbari menyusi) sinf nomini buzmaydi. */
  const CLS = /^\d{1,2}\s*[-–—]?\s*\p{L}/u;
  // jurnal havolasi ikki ko'rinishda bo'ladi: …/journal/school/S/group/G/subject/X yoki …/journals/?school=S&group=G&subject=X
  // (eski sahifa, «Rejalashtirish»). Ikkalasi bitta jurnalga keltiriladi; periodId / period (emaktabda ba'zan «=» siz) — chorak
  const jref = (href) => {
    href = String(href || ""); const m = href.match(/\/journal\/school\/(\d+)\/group\/(\d+)\/subject\/(\d+)/);
    let s, g, x; if (m) [, s, g, x] = m;
    else { if (!/\/journals?[/?]/.test(href)) return null; const q = (k) => (href.match(new RegExp(`[?&]${k}=(\\d+)`)) || [])[1]; s = q("school"); g = q("group"); x = q("subject"); if (!s || !g || !x) return null; }
    return {g, key: `${s}/${g}/${x}`, path: !!m, url: m ? href.slice(0, m.index + m[0].length) : `https://emaktab.uz/journal/school/${s}/group/${g}/subject/${x}`,
      pid: (href.match(/[?&](?:periodId|period)=?(\d+)/) || [])[1] || null};
  };
  const catalog = (html, base) => {
    const jobs = [], seen = {}, clean = (t) => String(t || "").replace(/\s+/g, " ").trim();
    const push = (cls, subject, href) => { const j = jref(href); if (!j || !cls) return; const ex = seen[j.key];
      if (!ex) { seen[j.key] = {cls, subject: clean(subject), url: j.url, pid: j.pid, path: j.path}; jobs.push(seen[j.key]); }
      else if (j.path && !ex.path) Object.assign(ex, {subject: clean(subject) || ex.subject, url: j.url, pid: j.pid || ex.pid, path: true}); };
    const i = html.indexOf("__TEACHERV2__INITIAL__STATE__");
    if (i >= 0) {
      const re = /["']?groups["']?\s*:\s*\{/g; re.lastIndex = i; const m = re.exec(html), st = m && jsonAt(html, m.index + m[0].length - 1);
      for (const g of st && Array.isArray(st.groups) ? st.groups : []) {
        const cls = clean(g && g.name);
        for (const j of (g && Array.isArray(g.journal) ? g.journal : [])) if (j) push(cls, clean(j.subjectName) + (j.subgroupName ? ` (${clean(j.subgroupName)})` : ""), String(j.journalUrl || ""));
      }
      if (jobs.length) return jobs;
    }
    // sinflar ro'yxati ikki panelda: #ContentPanelTeacher (dars beradigan sinflar) va #ContentPanelMyClasses (sinf rahbari),
    // har birining .cc qismida; .cc topilmasa — panelning o'zi, panel ham bo'lmasa — butun sahifa
    const doc = new DOMParser().parseFromString(html, "text/html"), byId = {}, pend = [], P = "#ContentPanelTeacher, #ContentPanelMyClasses";
    let roots = [...doc.querySelectorAll("#ContentPanelTeacher .cc, #ContentPanelMyClasses .cc")].filter((x) => !x.parentElement.closest(".cc"));
    if (!roots.length) roots = [...doc.querySelectorAll(P)]; if (!roots.length) roots = [doc];
    let last = null;
    for (const a of roots.flatMap((r) => [...r.querySelectorAll("a[href]")])) {
      let u; try { u = new URL(a.getAttribute("href"), base); } catch (e) { continue; }
      const text = clean(a.textContent), id = /\/v2\/class$/.test(u.pathname) && u.searchParams.get("class");
      if (id) { const c = byId[id] = byId[id] || {name: ""}; if (text && (!c.name || (CLS.test(text) && !CLS.test(c.name)))) c.name = text.slice(0, 40); last = c; continue; }
      const j = jref(u.href); if (j) pend.push([byId[j.g] || last || (byId[j.g] = {name: ""}), a.title || text, u.href]);
    }
    for (const [c, subject, href] of pend) push(c.name, subject, href);
    return jobs;
  };
  return {jsonAt, state, jref, catalog};
}
/* ───────── emaktab.uz saytidan to'g'ridan-to'g'ri (xatcho'p) ─────────
   Brauzer bu ilovaga emaktab.uz ga o'zi kirishga ruxsat bermaydi. Shuning uchun o'qituvchi emaktab'ga kirgan holda
   xatcho'pni bosadi: emkGrab() emaktab sahifasining ichida ishlaydi, Excel jurnallarni o'sha yerdan oladi va
   postMessage bilan shu ilovaga yuboradi. Login/parol hech qayerga uzatilmaydi.
   Bir bosishda (Akmal, 2026-11-06): schools.emaktab.uz ning istalgan sahifasida ishlaydi, chorak so'ralmaydi — joriy chorak va
   ilovada hali yo'q oldingi choraklar olinadi (ilova «jurnal-ready» javobida qaysi choraklari borligini aytadi), ilova oynasi
   ochilmasa bitta «Ilovaga yuborish» tugmasi chiqadi, ish tugagach oyna o'zi yopiladi. */
function emkGrab() {
  const APP = "__APP__", AO = new URL(APP).origin;
  const box = document.createElement("div");
  box.style.cssText = "position:fixed;top:12px;right:12px;z-index:2147483647;background:#fffdf8;color:#1b2a2f;border:2px solid #0b6f79;border-radius:14px;padding:12px 16px;font:15px/1.4 serif;max-width:360px;box-shadow:0 10px 30px rgba(0,0,0,.25);white-space:pre-line";
  const say = (t) => { box.textContent = "📒 Yo'qlama jurnali\n" + t; };
  document.body.appendChild(box);
  if (location.hostname !== "schools.emaktab.uz") {
    if (/(^|\.)emaktab\.uz$/.test(location.hostname) && !/^login\./.test(location.hostname)) {
      say("eMaktab sahifasi ochilmoqda… Ochilgach, xatcho'pni yana bir bor bosing."); location.href = "https://schools.emaktab.uz/v2/myclasses";
    } else say("Avval emaktab.uz ga kiring, so'ng xatcho'pni bosing.");
    setTimeout(() => box.remove(), 8000); return;
  }
  // ilova javobi: {type: "jurnal-ready", have: [{n: sinf, s: fan, q: [jurnalda belgisi bor choraklar]}]} (have — eski ilovada yo'q)
  let ready = false, have = null;
  addEventListener("message", (e) => { if (e.origin === AO && e.data && e.data.type === "jurnal-ready") { ready = true; if (Array.isArray(e.data.have)) have = e.data.have; } });
  const ping = (w) => { try { w.postMessage({type: "emaktab-ping"}, AO); } catch (e) {} };
  const waitApp = async (w, ms, need) => { for (let t = 0; t < ms / 200 && !(ready && (!need || have)) && !w.closed; t++) { ping(w); await new Promise((r) => setTimeout(r, 200)); } };
  // ilova oynasi ochilmasa ham (qalqib chiquvchi oyna to'silgan, telefon) oxirida «Ilovaga yuborish» tugmasi chiqadi
  let w = null; try { w = window.open(APP + "#emaktab", "yoqlama_jurnal"); } catch (e) { w = null; }
  const btns = (opts) => new Promise((res) => {
    const row = document.createElement("div"); row.style.cssText = "display:flex;gap:8px;flex-wrap:wrap;margin-top:10px";
    opts.forEach(([k, l], i) => { const b = document.createElement("button"); b.textContent = l; b.dataset.emk = k;
      b.style.cssText = `font:inherit;font-size:14px;padding:8px 12px;border-radius:9px;border:1px solid #0b6f79;cursor:pointer;background:${i ? "#fff;color:#0b6f79" : "#0b6f79;color:#fff"}`;
      b.onclick = () => { row.remove(); res(k); }; row.append(b); });
    box.append(row);
  });
  const b64 = (buf) => { const u = new Uint8Array(buf); let x = ""; for (let i = 0; i < u.length; i += 32768) x += String.fromCharCode.apply(null, u.subarray(i, i + 32768)); return btoa(x); };
  const saveFile = (files) => {
    const blob = new Blob([JSON.stringify({type: "emaktab-bundle", v: 1, files: files.map((f) => ({name: f.name, b64: b64(f.data)}))})], {type: "application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "emaktab_jurnallar.json"; document.body.append(a); a.click(); a.remove();
  };
  const get = async (u) => { const r = await fetch(u, {credentials: "include"}); if (!r.ok) throw new Error("HTTP " + r.status); return r; };
  // sahifa tahlili (sinflar ro'yxati, jurnal holati) — emkLib(): ilovaning o'zidan importda ham shu kod ishlatiladi
  const {jsonAt, state, catalog} = (__EMKLIB__)();
  (async () => {
    say("Sinflar ro'yxati o'qilmoqda…");
    const r0 = await get("/v2/myclasses");
    if (/login\./.test(new URL(r0.url).hostname)) throw new Error("emaktab'ga kirilmagan — avval saytga kiring.");
    const jobs = catalog(await r0.text(), r0.url);
    if (!jobs.length) throw new Error("«Sinflarim» sahifasida jurnal topilmadi.");
    // choraklar: birinchi jurnal holatidan; «Yil boshidan» — joriy chorakkacha hammasi
    const perOf = (hd) => { const ps = ((hd.periods || {})[hd.currentGroupId] || {}).periods || []; const cur = ps.find((p) => p.id === hd.currentPeriodId); return {ps, cur}; };
    // jurnal sahifasi boshqa manzilda bo'lishi mumkin (emaktab.uz/journal/… — brauzer uni bu sahifadan o'qishga ruxsat bermasligi mumkin):
    // o'qilmasa shu saytdagi (schools.emaktab.uz) manzil sinaladi, u ham bo'lmasa havoladagi periodId (joriy chorak) olinadi
    const journal = async (u) => {
      try { return state(await (await get(u)).text()); }
      catch (e) { const p = new URL(u); if (p.origin === location.origin) return null; try { return state(await (await get(location.origin + p.pathname)).text()); } catch (e2) { return null; } }
    };
    const first = await journal(jobs[0].url);
    // ilovada qaysi choraklar bor — jurnal o'shandan bilinadi; ilova javob bermasa hamma choraklar olinadi (ilova keraksizini o'zi tashlaydi)
    if (w) await waitApp(w, 4000, true);
    const nk = (t) => String(t || "").toLowerCase().replace(/\(.*?\)/g, "").replace(/[^\p{L}\p{N}]/gu, "");
    const hasQ = (jb) => { if (!have) return null; const x = have.find((h) => nk(h.n) === nk(jb.cls) && nk(h.s) === nk(jb.subject)); return x ? x.q || [] : null; };
    const files = [], errs = [];
    for (const [n, jb] of jobs.entries()) {
      say(`Jurnallar yuklanmoqda: ${n + 1} / ${jobs.length}\n${jb.cls} · ${jb.subject}`);
      try {
        const st = n ? await journal(jb.url) : first, hd = (st && st.journalHeader) || (jb.pid ? {currentPeriodId: jb.pid} : null);
        if (!hd) throw new Error("chorak topilmadi");
        const [, school, group, subject] = jb.url.match(/\/school\/(\d+)\/group\/(\d+)\/subject\/(\d+)/);
        // chorak raqami — tartib bo'yicha (emaktabda number 0 dan ham boshlanadi); joriy chorak doim, oldingilari — ilovada yo'q bo'lsa
        const {ps, cur} = perOf(hd), ord = [...ps].sort((a, b) => a.number - b.number), hq = hasQ(jb);
        const want = cur ? ord.filter((p, i) => p.number < cur.number ? !(hq && hq.includes(i + 1)) : p.id === cur.id) : [{id: hd.currentPeriodId, name: ""}];
        for (const p of want) {
          const x = await get(`/v2/excel?action=gjsxls&school=${school}&group=${group}&subgroup=0&subject=${subject}&period=${p.id}`);
          if (/html/i.test(x.headers.get("content-type") || "")) throw new Error("Excel o'rniga sahifa keldi");
          files.push({name: `${jb.cls}_${jb.subject}${p.name && want.length > 1 ? "_" + p.name : ""}.xls`, data: await x.arrayBuffer()});
        }
      } catch (e) { errs.push(`${jb.cls} · ${jb.subject}: ${e.message}`); }
    }
    if (!files.length) throw new Error("Hech bir jurnal yuklanmadi.\n" + errs.join("\n"));
    const bad = errs.length ? `\nYuklanmadi:\n${errs.join("\n")}` : "";
    const send = () => {
      w.postMessage({type: "emaktab-files", files}, AO);
      say(`✓ ${files.length} ta jurnal yuborildi.\nNatija Jurnal ilovasida.` + bad);
      try { w.focus(); } catch (e) {}
      if (!bad) setTimeout(() => box.remove(), 4000);
      else btns([["ok", "Yopish"]]).then(() => box.remove());
    };
    if (w && !w.closed) { say("Jurnal ilovasiga yuborilmoqda…"); await waitApp(w, 15000); }
    if (w && ready && !w.closed) { send(); return; }
    // ilova oynasi ochilmadi (qalqib chiquvchi oyna to'silgan) — tugma bosilsa brauzer ruxsat beradi; zaxira: faylga saqlash
    for (;;) {
      say(`✓ ${files.length} ta jurnal olindi. Ilovaga yuborish uchun tugmani bosing.` + bad);
      const k = await btns([["open", "📒 Ilovaga yuborish"], ["save", "💾 Faylga saqlash"], ["x", "Bekor qilish"]]);
      if (k === "x") { box.remove(); return; }
      if (k === "save") { saveFile(files); say("✓ «emaktab_jurnallar.json» saqlandi (Yuklab olinganlar papkasi). Endi uni Jurnal ilovasida «eMaktab'dan import» → «Fayl orqali» bo'limida tanlang."); return; }
      ready = false; try { w = window.open(APP + "#emaktab", "yoqlama_jurnal"); } catch (e) { w = null; }
      if (w) { say("Jurnal ilovasiga yuborilmoqda…"); await waitApp(w, 15000); }
      if (w && ready && !w.closed) { send(); return; }
    }
  })().catch((e) => say("✗ " + e.message));
}
const appUrl = () => location.origin + location.pathname.replace(/index\.html$/, "");
const emkCode = () => `(${emkGrab.toString().replace("__APP__", appUrl()).replace("__EMKLIB__", () => emkLib.toString())})()`;
// xatcho'p manzili: kodlangan (telefon manzil maydoni qator o'tkazishni o'chiradi — «//» izohlar qolgan kodni yutib yuborardi)
// kompyuter xatcho'pi ham har bosilganda eng yangi kodni saytdagi emk.js dan yuklaydi — ilova yangilansa xatcho'pni qayta qo'shish

/* Sinflarni solishtirish: har sinf uchun bitta reportRows (keshdan) + ishlar ballari bir o'tishda.
   Jami qatori vaznli: o'rtacha baho — baholar soni bo'yicha, davomat — o'quvchilar bo'yicha, BSB/CHSB — ballar yig'indisi bo'yicha. */
function compareRows(lo, hi, q = null) {
  return D.classes.filter((c) => !isGrp(c)).map((c) => {
    const {rows, lessons} = reportRows(c, lo, hi, q), gr = rows.filter((r) => r.avg !== null);
    const nGr = gr.reduce((a, r) => a + r.n, 0), sGr = gr.reduce((a, r) => a + r.avg * r.n, 0), avg = nGr ? sGr / nGr : null;
    const at = rows.filter((r) => r.att !== null), att = at.length ? at.reduce((a, r) => a + r.att, 0) / at.length : null;
    const P = {bsb: [0, 0], chsb: [0, 0]};
    for (const w of c.works) { if (w.date < lo || w.date > hi) continue; const acc = P[w.type === "chsb" ? "chsb" : "bsb"]; /* Loyiha ishi — BSB qismida (chorak bahosidagi kabi) */ for (const s of c.students) { const v = (s.scores || {})[w.id]; if (isNum(v)) { acc[0] += v; acc[1] += +w.max; } } }
    const ql = q ? qualityOf(rows) : null, qp = q ? qProgress(c, q, hi) : null;
    return {c, n: c.students.length, qp, lessons, avg, att, nGr, sGr, nAt: at.length, sAt: at.reduce((a, r) => a + r.att, 0), risk: rows.filter((r) => r.risk).length, P,
      bsb: P.bsb[1] ? 100 * P.bsb[0] / P.bsb[1] : null, chsb: P.chsb[1] ? 100 * P.chsb[0] / P.chsb[1] : null,
      qn: ql ? ql.n : 0, by: ql ? ql.by : [0, 0, 0, 0], q45: ql ? ql.by[0] + ql.by[1] : 0, qt: ql ? ql.t : 0, qq: ql ? ql.q : null, qu: ql ? ql.u : null};

// guruhlar: tasodifiy yoki teng kuchli (o'rtacha baho bo'yicha muvozanatlangan)
function makeGroups(pool, k, mode, rnd = Math.random) {
  const a = pool.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  const G = Array.from({length: k}, () => []);
  if (mode === "even") {
    // «ilon» usulida tarqatib, keyin guruhlar o'rtachasi yaqinlashguncha o'quvchilarni almashtiramiz
    const v = (x) => x.avg ?? 6, mean = (g) => g.reduce((t, x) => t + v(x), 0) / (g.length || 1);
    const spread = () => { const ms = G.map(mean), m = ms.reduce((t, x) => t + x, 0) / k; return ms.reduce((t, x) => t + (x - m) ** 2, 0); };
    a.sort((x, y) => v(y) - v(x));
    a.forEach((x, i) => { const r = Math.floor(i / k), p = i % k; G[r % 2 ? k - 1 - p : p].push(x); });
    for (let pass = 0, better = true; better && pass < 50; pass++) {
      better = false;
      for (let g1 = 0; g1 < k; g1++) for (let g2 = g1 + 1; g2 < k; g2++) for (let i1 = 0; i1 < G[g1].length; i1++) for (let i2 = 0; i2 < G[g2].length; i2++) {
        const before = spread(); [G[g1][i1], G[g2][i2]] = [G[g2][i2], G[g1][i1]];
        if (spread() < before - 1e-9) better = true; else [G[g1][i1], G[g2][i2]] = [G[g2][i2], G[g1][i1]];
      }
    }
  } else a.forEach((x, i) => G[i % k].push(x));
  return G;
}

// D.web.seats[ckey] = {rows, cols, at: {"q-u": ism}} — har parta 2 o'rinli (cols juft)
function seatsOf(c, make) {
  const all = D.web.seats = D.web.seats || {}, k = ckey(c);
  let s = all[k];
  if (!s && make) s = all[k] = {rows: Math.max(3, Math.ceil(c.students.length / 6)), cols: 6, at: {}};
  if (s) { const names = new Set(c.students.map((x) => x.name)); for (const [p, n] of Object.entries(s.at)) if (!names.has(n)) delete s.at[p]; }
  return s || null;
}
const ATT_COL = {s: "var(--danger)", dq: "#1565c0", k: "#7b1fa2", kq: "#6d4c41", ch: "#00796b"};
// xarita HTML'i; sel — tanlangan o'rin (tahrirlashda), att — bugungi yo'qlama ko'rsatilsinmi
function seatGrid(c, s, {sel = null, att = false} = {}) {
  const idx = Object.fromEntries(c.students.map((x, i) => [x.name, i]));
  let h = `<div class="desk">🧑‍🏫 Doska</div><div class="seats" style="grid-template-columns:repeat(${s.cols},minmax(0,1fr))">`;
  for (let r = 0; r < s.rows; r++) for (let u = 0; u < s.cols; u++) {
    const p = `${r}-${u}`, n = s.at[p], si = n !== undefined ? idx[n] : -1, a = att && si >= 0 ? attOf(c, si) : "";
    h += `<button class="seat ${u % 2 ? "r" : "l"} ${n ? "" : "empty"} ${sel === p ? "on" : ""}" data-seat="${p}" ${a ? `style="background:${ATT_COL[a]};border-color:${ATT_COL[a]};color:#fff"` : ""}>${n ? `<span>${esc(shortName(n))}</span>${a ? `<small>${a.toUpperCase()}</small>` : ""}` : ""}</button>`;
  }
  return h + "</div>";
}
function seatAuto(c, s) {
  s.at = {}; const need = Math.ceil(c.students.length / s.cols); if (s.rows < need) s.rows = need;
  c.students.forEach((x, i) => { s.at[`${Math.floor(i / s.cols)}-${i % s.cols}`] = x.name; });

  });

// s.bday = "YYYY-MM-DD" (yil noma'lum bo'lsa "0000-MM-DD")
// matndan sana: 12.03.2013, 12/03/2013, 2013-03-12, 12.03
function parseBday(txt) {
  const t = String(txt || "").trim(); let m;
  if ((m = t.match(/(\d{4})-(\d{1,2})-(\d{1,2})/))) return bdayOk(+m[1], +m[2], +m[3]);
  if ((m = t.match(/(\d{1,2})[./-](\d{1,2})(?:[./-](\d{2,4}))?/))) { let y = m[3] ? +m[3] : 0; if (m[3] && m[3].length === 2) y += y > 30 ? 1900 : 2000; return bdayOk(y, +m[2], +m[1]); }
  return null;
}
function bdayOk(y, mo, d) {
  if (mo < 1 || mo > 12 || d < 1 || d > [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][mo - 1]) return null;
  return `${String(y).padStart(4, "0")}-${pad(mo)}-${pad(d)}`;
}
const fmtBday = (b) => b ? `${b.slice(8, 10)}.${b.slice(5, 7)}${b.startsWith("0000") ? "" : "." + b.slice(0, 4)}` : "";
// days kun ichidagi tug'ilgan kunlar: [{ci, s, left, age}]
function birthdays(days = 7, now = todayIso()) {
  const t0 = pdate(now), out = [];
  D.classes.forEach((c, ci) => c.students.forEach((s) => {
    if (!s.bday) return;
    const mo = +s.bday.slice(5, 7), d = +s.bday.slice(8, 10);
    for (const y of [t0.getFullYear(), t0.getFullYear() + 1]) {
      // 29-fevral kabisa bo'lmagan yilda 28-fevralda nishonlanadi
      let day = new Date(y, mo - 1, d); if (day.getMonth() !== mo - 1) day = new Date(y, mo - 1, d - 1);
      const left = Math.round((day - t0) / 864e5);
      if (left >= 0 && left <= days) { out.push({ci, s, left, age: s.bday.startsWith("0000") ? null : y - +s.bday.slice(0, 4)}); break; }
    }
  }));
  const seen = new Set();   // bir o'quvchi bir necha fanda — bir marta
  return out.sort((a, b) => a.left - b.left || a.s.name.localeCompare(b.s.name)).filter((x) => { const k = normName(x.s.name) + "|" + D.classes[x.ci].name; if (seen.has(k)) return false; seen.add(k); return true; });
}
function bdaysDialog(ci) {
  const c = D.classes[ci];
  const body = () => `<div class="lsns">${c.students.map((s, si) => `<div class="hrow" style="gap:8px;flex-wrap:nowrap"><span class="sp" style="min-width:0">${esc(s.name)}</span>
      <input class="form-control" type="text" data-bd="${si}" value="${fmtBday(s.bday)}" placeholder="kk.oo.yyyy" inputmode="numeric" style="width:130px;flex:none"></div>`).join("")}</div>`;
  return modal(`<h2>🎂 Tug'ilgan kunlar · ${esc(label(c))}</h2>

    <details><summary><b>Ro'yxatdan qo'yish</b> (masalan, Excel yoki emaktabdan nusxalab)</summary>
      <div class="vcol" style="gap:6px;margin-top:6px"><textarea id="bdp" placeholder="Abdullayev Sardor 12.03.2013&#10;Aliyeva Madina	05.11.2012"></textarea><button class="btn" data-bdp>Matndan to'ldirish</button></div></details>
    <div id="bdb">${body()}</div>
    <div class="hrow"><span class="sp"></span><button class="btn btn-primary" data-x>Yopish</button></div>`, (m, close) => {
    // bir xil ismli o'quvchi barcha jurnallarda (fanlarda) bir xil tug'ilgan kunga ega
    const setAll = (name, v) => { const k = normName(name); D.classes.forEach((x) => x.students.concat(x.students_off).forEach((s) => { if (normName(s.name) === k) { if (v) s.bday = v; else delete s.bday; } })); };
    const bind = () => m.querySelectorAll("[data-bd]").forEach((x) => x.onchange = () => {
      const s = c.students[+x.dataset.bd], v = x.value.trim() ? parseBday(x.value) : "";

    });

      let n = 0; const miss = [];
      for (const line of $("#bdp", m).value.split(/\n/)) {
        const v = parseBday(line); if (!v) continue;
        const nm = normName(line.replace(/\d{1,4}[./-]\d{1,2}(?:[./-]\d{2,4})?/, " ").replace(/[\t;,]+/g, " "));
        const s = c.students.find((x) => normName(x.name) === nm) || c.students.find((x) => nm && (nm.startsWith(normName(x.name)) || normName(x.name).startsWith(nm)));
        if (s) { setAll(s.name, v); n++; } else miss.push(line.trim());
      }
      save(); $("#bdb", m).innerHTML = body(); bind();
      toast(`${n} ta tug'ilgan kun qo'yildi${miss.length ? ` · topilmadi: ${miss.length} qator` : ""}`);
    };
    $("[data-x]", m).onclick = () => { close(); render(); };
  });
}

function normPhone(t) {

// D.web.schedule = {bells: [["08:00","08:45"], …], days: [[jurnal kaliti | "" har soat uchun] × 6 kun (Du…Sh)]}
const SCH_DEF_BELLS = [["08:00", "08:45"], ["08:50", "09:35"], ["09:40", "10:25"], ["10:35", "11:20"], ["11:25", "12:10"], ["12:15", "13:00"]];
const ckey = (c) => `${c.name}|${c.subject}`;
function sched() { const s = D.web.schedule; return s && Array.isArray(s.days) && s.days.some((d) => d.some(Boolean)) ? s : null; }
function schedEmpty() { return {bells: clone(SCH_DEF_BELLS), days: Array.from({length: 6}, () => SCH_DEF_BELLS.map(() => ""))}; }
// bugungi darslar soat tartibida: [{c, ci, no, from, to}]
function schedToday(t = todayIso()) {
  const s = sched(), wd = pyWd(t); if (!s || wd > 5) return [];
  return (s.days[wd] || []).map((k, no) => { const ci = D.classes.findIndex((c) => ckey(c) === k); return k && ci >= 0 ? {c: D.classes[ci], ci, no, from: (s.bells[no] || [])[0] || "", to: (s.bells[no] || [])[1] || ""} : null; }).filter(Boolean);
}
// jadvaldan har sinfning dars kunlarini olish; o'chgan kunlardagi bo'sh kelajak sanalar olib tashlanadi
function schedApplyWeekdays() {
  const s = sched(); if (!s) return 0; const q = quarterOf(todayIso()), t = todayIso(); let n = 0;
  for (const c of D.classes) {
    const wds = [0, 1, 2, 3, 4, 5].filter((d) => (s.days[d] || []).includes(ckey(c)));
    if (!wds.length || JSON.stringify(wds) === JSON.stringify((c.weekdays || []).slice().sort())) continue;
    c.weekdays = wds; n++;
    c.dates = c.dates.filter((d) => d < t || wds.includes(pyWd(d)) || hasMarks(c, d) || c.lessons[d] || c.works.some((w) => w.date === d));
    if (q) genQuarter(q, [c]);
  }

}
const normCls = (x) => String(x || "").toUpperCase().replace(/[«»"'ʻʼ`‘’\s._-]/g, "");
// Excel jadvalni o'qish: kunlar ustunlarda (yoki qatorlarda), har katakda «6-A», «6-A Matematika» kabi yozuv
function parseSchedule(rows) {
  const DAYRX = [/^(du|dush|пн|пон)/i, /^(se|sesh|вт|вто)/i, /^(ch|chor|ср|сре)/i, /^(pa|pay|чт|чет)/i, /^(ju|jum|пт|пят)/i, /^(sh|shan|сб|суб)/i];
  const dayOf = (v) => { const t = String(v || "").trim(); if (t.length < 2) return -1; return DAYRX.findIndex((r) => r.test(t)); };
  rows = rows.map((r) => (r || []).map((v) => v == null ? "" : String(v).trim()));
  let grid = rows, hr = grid.findIndex((r) => r.filter((v) => dayOf(v) >= 0).length >= 3);
  if (hr < 0) { // kunlar birinchi ustunlarda bo'lsa — jadvalni ag'darib qo'yamiz
    const w = Math.max(0, ...rows.map((r) => r.length));
    grid = Array.from({length: w}, (_, j) => rows.map((r) => r[j] || ""));
    hr = grid.findIndex((r) => r.filter((v) => dayOf(v) >= 0).length >= 3);
  }
  if (hr < 0) throw new Error("Jadvalda hafta kunlari (Dushanba, Seshanba …) topilmadi");
  const cols = grid[hr].map(dayOf), TRX = /(\d{1,2})[:.](\d{2})\s*[-–—]\s*(\d{1,2})[:.](\d{2})/;
  const byCls = new Map(); for (const c of D.classes) { const k = normCls(c.name); if (!byCls.has(k)) byCls.set(k, []); byCls.get(k).push(c); }
  const out = {bells: [], days: Array.from({length: 6}, () => [])}, miss = new Set();
  for (const r of grid.slice(hr + 1)) {
    if (r.join("").trim() === "") continue;
    const tm = r.map((v) => v.match(TRX)).find(Boolean);
    const no = out.bells.length; out.bells.push(tm ? [`${pad(+tm[1])}:${tm[2]}`, `${pad(+tm[3])}:${tm[4]}`] : (SCH_DEF_BELLS[no] || ["", ""]).slice());
    for (let d = 0; d < 6; d++) out.days[d][no] = "";
    r.forEach((v, j) => {
      const d = cols[j]; if (d < 0 || d > 5 || !v || v === "-" || v === "—") return;
      // «6 - A», «6-«A»», «6A» → «6A»; so'ng so'zlarga bo'lib sinf nomini qidiramiz
      const toks = new Set(v.toUpperCase().replace(/[«»"'ʻʼ`‘’]/g, "").replace(/(\d)\s*[-–.]?\s*([A-ZА-ЯЁ])(?![A-ZА-ЯЁ])/g, "$1$2").split(/[^0-9A-ZА-ЯЁ]+/));
      const hit = [...byCls.keys()].filter((k) => k && toks.has(k));
      const k = hit.sort((a, b) => b.length - a.length)[0];
      if (!k) { miss.add(v); return; }
      const list = byCls.get(k), low = v.toLowerCase();
      const c = list.find((x) => x.subject && low.includes(x.subject.toLowerCase().slice(0, 4))) || list[0];
      out.days[d][no] = ckey(c);
    });
  }
  while (out.bells.length && out.days.every((d) => !d[out.bells.length - 1])) { out.bells.pop(); out.days.forEach((d) => d.pop()); }
  return {schedule: out, missing: [...miss]};
}

// D.web.remind = {on, min}; ilova ochiq (yoki fonda) turganda ishlaydi — server yo'q
const remCfg = () => Object.assign({on: false, min: 5}, D.web.remind || {});
const REM = {timers: [], fired: new Set()};
function remPlan(now = new Date()) {
  const t = iso(now), {min} = remCfg(), out = [];
  for (const x of schedToday(t)) {
    if (!x.from) continue;
    const [hh, mm] = x.from.split(":").map(Number), start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh, mm);
    if (isNoLesson(x.c, t) || start <= now) continue;
    const prev = x.c.dates.filter((d) => d < t && !isNoLesson(x.c, d)).pop(), hw = prev && (x.c.lessons[prev] || {}).hw;
    const topic = (x.c.lessons[t] || {}).topic;
    out.push({key: `${t}|${x.no}`, at: new Date(start - min * 6e4), ci: x.ci, title: `${x.no + 1}-soat · ${x.from} — ${label(x.c)}`,
      body: [topic ? `Mavzu: ${topic}` : "", hw ? `Uyga berilgan edi: ${hw}` : "", `${x.c.students.length} o'quvchi`].filter(Boolean).join("\n")});
  }
  return out;
}
async function remShow(p) {
  if (REM.fired.has(p.key)) return; REM.fired.add(p.key);
  toast(`🔔 ${p.title}`);
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  const opt = {body: p.body, tag: "dars-" + p.key, icon: "icon-192.png", badge: "icon-192.png", data: {ci: p.ci}};
  try { const r = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(); if (r) return await r.showNotification(p.title, opt); } catch (e) { /* oddiy bildirishnomaga o'tamiz */ }
  try { const n = new Notification(p.title, opt); n.onclick = () => { window.focus(); n.close(); }; } catch (e) { /* telefon brauzeri faqat SW orqali ruxsat beradi */ }
}
function remSchedule() {
  REM.timers.forEach(clearTimeout); REM.timers = [];
  const now = new Date();
  eveSchedule(now);
  if (!remCfg().on) { REM.timers.push(setTimeout(remSchedule, new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 1) - now)); return; }
  for (const p of remPlan(now)) {
    const ms = p.at - now;
    if (ms <= 0) remShow(p);   // eslatma vaqti o'tgan, lekin dars hali boshlanmagan — darhol
    else if (ms < 864e5) REM.timers.push(setTimeout(() => remShow(p), ms));
  }
  // yarim tunda ertangi kun uchun qayta rejalashtirish
  const mid = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 1);
  REM.timers.push(setTimeout(remSchedule, mid - now));
}
// kechki eslatma: D.web.eve = "18:00" (bo'sh — o'chiq); bugungi to'ldirilmagan darslar bo'lsa bildirishnoma
function eveSchedule(now = new Date()) {
  const e = D.web.eve; if (!e || !feat("gaps")) return;
  const [hh, mm] = e.split(":").map(Number), at = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh, mm), t = iso(now);
  const fire = () => { const g = lessonGaps(t, 1); if (g.length) remShow({key: "eve" + t, ci: g[0].ci, title: `📝 Bugun ${g.length} ta dars to'ldirilmagan`, body: g.map((x) => `${label(x.c)}: ${[x.noAtt ? "yo'qlama" : "", x.noTopic ? "mavzu" : ""].filter(Boolean).join(", ")}`).join("\n")}); };
  if (at > now) REM.timers.push(setTimeout(fire, at - now));
  else if (now - at < 3 * 36e5) fire();   // ilova kechroq ochilsa ham (3 soat ichida) eslatadi
}
async function remToggle() {
  const c = remCfg();

    if (!sched()) { toast("Avval dars jadvalini kiriting — eslatma jadvaldagi soatlarga qarab keladi"); return; }

}
