function cmdPalette() {
  if ($(".modal .cmdl")) return;

    const q = $("#cmdq", m), box = $(".cmdl", m); let list = [], k = 0;
    const draw = () => {
      const v = normName(q.value);
      list = (v ? all.filter((x) => normName(x.t + " " + x.s).includes(v)) : all.filter((x) => x.ic !== "👤")).slice(0, 60);
      k = Math.min(k, Math.max(list.length - 1, 0));
      box.innerHTML = list.length ? list.map((x, i) => `<button role="option" class="${i === k ? "on" : ""}" data-ci="${i}"><span class="ic">${x.ic}</span><span>${esc(x.t)}</span><small>${esc(x.s)}</small></button>`).join("") : `<div class="emp">Hech narsa topilmadi</div>`;
      box.querySelectorAll("[data-ci]").forEach((b) => b.onclick = () => pick(+b.dataset.ci));
      const on = box.querySelector(".on"); if (on) on.scrollIntoView({block: "nearest"});
    };
    const pick = (i) => { const x = list[i]; if (!x) return; close(); x.run(); };
    q.oninput = () => { k = 0; draw(); };
    q.onkeydown = (e) => {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); k = (k + (e.key === "ArrowDown" ? 1 : -1) + list.length) % Math.max(list.length, 1); draw(); }
      else if (e.key === "Enter") { e.preventDefault(); pick(k); }
    };
    draw(); q.focus();
  });
}

function labelTables(root) {
  root.querySelectorAll("table.r").forEach((t) => {
    if (!t.rows.length) return;
    const hs = [...t.rows[0].cells].map((c) => c.dataset.h || c.textContent.trim());
    let hd = hs[0] === "№" ? 1 : 0;
    [...t.rows].slice(1).forEach((r) => [...r.cells].forEach((td, j) => {
      if (hs[j] === "№") td.classList.add("no");
      else if (j === hd) td.classList.add("hd");

    }));
  });

  for (const h of hwOverview()) { const x = risk.find((r) => r.ci === h.ci && r.name === h.name); if (x) x.why = x.why.concat(h.why); else risk.push(h); }

  const hm = `${pad(new Date().getHours())}:${pad(new Date().getMinutes())}`;

  const cards = L.length ? L.map(({c, ci, done, slots}) => {

function jOrder(c, rows) {
  const k = S.jsort || "list", idx = c.students.map((_, i) => i); if (k === "list" || !rows) return idx;

}

// narx: har o'quvchi bilan kelishiladi — maktabda oylik, uyida kunlik (o'tilgan dars × narx)
function planOf(c, s) { const p = s.plan || {}, t = p.t === "day" ? "day" : "month"; return {t, sum: +p.sum || +(c.fee || {})[t] || 0}; }
const planTxt = (c, s) => { const p = planOf(c, s); return p.t === "day" ? `uyda · ${som(p.sum)} / dars` : `maktabda · ${som(p.sum)} / oy`; };
const absentMark = (mk) => ["s", "dq", "k", "ox"].includes(attPart(mk || ""));
// shu oy o'tilgan darslar: faqat «o'tildi» belgisi qo'yilganlari
/* Hisob daftari (ledger): guruh sanalari bir marta oylarga ajratiladi, har o'quvchi uchun oylar bo'yicha
   o'tilgan darslar, hisoblangan summa va to'lovlar bitta o'tishda yig'iladi. Avval har chaqiruvda butun sanalar
   ro'yxati qayta ko'rilardi (o'quvchi × oy × sana); endi — sana bir marta, keyin faqat kesh. */
function grpMonths(c, t = todayIso()) {
  return memo(c, "gm|" + t, () => {
    const cur = monthOf(t), lessonM = new Set(), held = new Map();
    for (const d of c.dates) { if (isNoLesson(c, d)) continue; const m = monthOf(d); lessonM.add(m); if (d <= t) (held.get(m) || held.set(m, []).get(m)).push(d); }
    return {cur, lessonM, held, months: [...new Set([...lessonM].filter((m) => m <= cur).concat(cur))].sort()};
  });
}
function ledgerOf(c, s, t = todayIso()) {
  return memo(s, `lg|${c.dates.length}|${t}`, () => {
    const G = grpMonths(c, t), p = planOf(c, s), jm = s.joined ? monthOf(s.joined) : "", held = {}, charge = {}, paid = {};
    let ch = 0, pd = 0;
    for (const x of s.pays || []) { const v = +x.sum || 0; paid[x.m] = (paid[x.m] || 0) + v; pd += v; }
    for (const m of G.months) {
      let h = 0; for (const d of G.held.get(m) || []) if (s.marks[d] === "ot" && !preJoin(c, s, d)) h++;
      const v = jm > m ? 0 : p.t === "day" ? p.sum * h : G.lessonM.has(m) ? p.sum : 0;

}
function heldIn(c, s, m, t = todayIso()) { return ledgerOf(c, s, t).held[m] || 0; }
function chargeOf(c, s, m, t = todayIso()) { return ledgerOf(c, s, t).charge[m] || 0; }

function debtOf(c, s, t = todayIso()) { return ledgerOf(c, s, t).debt; }

function grpInsights(c, t = todayIso(), lock = false) {
  const held = c.dates.filter((d) => d <= t && !isNoLesson(c, d)), mo = monthOf(t), pm = shiftMonth(mo, -1), out = [];

    const add = (lv, txt) => out.push({lv, si, txt});
    let streak = 0; for (let i = mk.length - 1; i >= 0 && mk[i][1] === "ox"; i--) streak++;
    const miss30 = mk.filter(([d, v]) => v === "ox" && d >= since(30)).length;
    if (streak >= 3) add(0, `${streak} ta dars ketma-ket qatnashmadi — ota-onasi bilan bog'laning`);
    else if (miss30 >= 3) add(1, `so'nggi 30 kunda ${miss30} ta darsni qoldirdi`);

      const rate = (a) => a.filter(([, v]) => v === "ot").length / a.length, last = mk.slice(-4), prev = mk.slice(-8, -4);
      if (rate(prev) - rate(last) >= 0.5) add(1, `faolligi pasaydi: avvalgi 4 darsda ${Math.round(100 * rate(prev))}% → oxirgi 4 darsda ${Math.round(100 * rate(last))}%`);
    }
    if (c.kind === "paid" && !lock) {
      const dbt = debtOf(c, s, t); if (dbt > 0) add(1, `to'lov qarzi ${som(dbt)}`);
    }
    if (c.kind === "club") {
      const a = (s.ach || []).map((x) => x.d || "").sort(), la = a[a.length - 1] || "";
      if (la && la >= since(30)) add(3, `yaqinda yutuq qayd etilgan (${(s.ach || []).length} ta jami)`);
      else if (mk.length >= 4 && (!la || la < since(90))) add(2, `so'nggi 3 oyda yutuq qayd etilmagan — musobaqa yoki ko'rgazmaga taklif qiling`);
    }

  });

}

function snapCols() {

  const tb = d.closest("table"), sp = parseFloat(getComputedStyle(tb).borderSpacing) || 0;

    <p class="muted" style="margin:0">Yakuniy qarz = boshlang'ich qarz + hisoblangan − tushum. Hisoblangan — xizmat ko'rsatilgan oyga, tushum — to'lov sanasiga ko'ra. Manfiy qarz — oldindan to'lov. Xususiy darslar maktab hisobotiga kirmaydi — ular faqat shaxsiy hisob uchun ko'rsatilgan. Ilova pul qabul qilmaydi, faqat yozib boradi.</p>`;

    .concat(SC.length ? [[], ["Taqsimot (maktab xizmati)", "Ulushi %", "Summa"], ["O'qituvchilar mehnatiga haq", share, toT], ["Qolgan qism (11-band tartibida)", 100 - share, TS.got - toT]] : []);
  return [sec, [`moliyaviy hisobot ${lo} ${hi}`, aoa, [30, 16, 10, 16, 14, 14, 14]]];
}

function exportJson() {
  D.web.exported = new Date().toISOString(); save();
  const t = new Date(); download(`journal_${iso(t)}_${pad(t.getHours())}${pad(t.getMinutes())}.json`, JSON.stringify(D, null, 1));

function importJson() {
  const f = $("#file"); f.value = "";
  f.onchange = async () => {
    const file = f.files[0]; if (!file) return;
    try {
      let data = JSON.parse(await file.text());
      data = await openSealed(data);
      if (data && data.type === "emaktab-bundle") { importEmaktabFiles(bundleFiles(data)); return; }
      if (!data || !Array.isArray(data.classes)) throw new Error("bu jurnal fayli emas");
      if (tooNew(data)) throw new Error("fayl ilovaning yangiroq versiyasida saqlangan — sahifani yangilang");
      if (D.classes.length && !await confirmBox("Fayldan yuklash", `Hozirgi ${D.classes.length} ta sinf o'rniga fayldagi ${data.classes.length} ta sinf yuklanadi. Davom etamizmi?`, "Yuklash")) return;
      await keepBefore();
      D = migrate(normalize(data)); autoDates(); save(); S.ci = 0; go("today"); toast(`${D.classes.length} ta sinf yuklandi`);
    } catch (e) { toast("Faylni o'qib bo'lmadi: " + e.message); }
  };
  f.click();
}

const UNDO = [];
function pushUndo(batch) { if (batch.length) { UNDO.push(batch); if (UNDO.length > 100) UNDO.shift(); } }
async function undoLast() {
  const batch = UNDO.pop(); if (!batch) { toast("Bekor qilinadigan o'zgarish yo'q"); return; }
  if (batch[0].kind === "off") {
    let n = 0;
    for (const {c, items} of batch) { const back = items.filter((st) => c.students_off.includes(st)); if (D.classes.includes(c) && back.length) { activate(c, back); n += back.length; } }

  }

    ((u.kind === "mark" ? u.s.marks[u.key] : (u.s.scores || {})[u.key]) ?? "") === u.nw);
  if (!live.length) { toast("Bu o'zgarish keyin yana o'zgargan — bekor qilinmadi"); return; }

  if (prot && isLocked() && !await unlock()) { UNDO.push(batch); return; }
  for (const u of live) {

    if (u.old === "") delete b[u.key]; else b[u.key] = u.old;

const sumOf = (a) => a.reduce((x, y) => x + y, 0);

  if (an.quality < 40) bad.push(`Bilim sifati past: faqat ${f0(an.quality)}% o'quvchi «4» va «5» baho olgan.`);
  if (an.absent.length) bad.push(`Ishtirok etmaganlar: ${an.absent.length} ta (${bsbNames(an.absent)}).`);

  if (!bad.length) bad.push("Jiddiy kamchiliklar aniqlanmadi.");

  const btns = (opts) => new Promise((res) => {
    const row = document.createElement("div"); row.style.cssText = "display:flex;gap:8px;flex-wrap:wrap;margin-top:10px";
    opts.forEach(([k, l], i) => { const b = document.createElement("button"); b.textContent = l; b.dataset.emk = k;
      b.style.cssText = `font:inherit;font-size:14px;padding:8px 12px;border-radius:9px;border:1px solid #0b6f79;cursor:pointer;background:${i ? "#fff;color:#0b6f79" : "#0b6f79;color:#fff"}`;
      b.onclick = () => { row.remove(); res(k); }; row.append(b); });

  const b64 = (buf) => { const u = new Uint8Array(buf); let x = ""; for (let i = 0; i < u.length; i += 32768) x += String.fromCharCode.apply(null, u.subarray(i, i + 32768)); return btoa(x); };

    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "emaktab_jurnallar.json"; document.body.append(a); a.click(); a.remove();
  };
  const get = async (u) => { const r = await fetch(u, {credentials: "include"}); if (!r.ok) throw new Error("HTTP " + r.status); return r; };
  const state = (html) => {

  };
  (async () => {
    say("Sinflar ro'yxati o'qilmoqda…");
    const r0 = await get("/v2/myclasses");

      qn: ql ? ql.n : 0, q45: ql ? ql.by[0] + ql.by[1] : 0, q35: ql ? ql.by[0] + ql.by[1] + ql.by[2] : 0, qq: ql ? ql.q : null, qu: ql ? ql.u : null};

  const sum = (f) => L.reduce((a, r) => a + r[f], 0), nGr = sum("nGr"), nAt = sum("nAt"), qn = sum("qn");
  const pp = (k) => { const g = L.reduce((a, r) => a + r.P[k][0], 0), m = L.reduce((a, r) => a + r.P[k][1], 0); return m ? 100 * g / m : null; };

// bugun kelmaganlar (S/DQ/K) chiqarib tashlanadi; joriy davrdagi baholar soni va o'rtachasi
function classPool(c) {
  const t = todayIso(), [lo, hi] = periodNow();
  return c.students.map((s, si) => {
    const gr = Object.entries(s.marks).filter(([d]) => lo <= d && d <= hi && !isNoLesson(c, d)).flatMap(([, m]) => gradesOf(m));
    return {s, si, n: gr.length, avg: gr.length ? gr.reduce((a, b) => a + b, 0) / gr.length : null, today: gradesOf(s.marks[t] || "").length > 0};
  }).filter((x) => !["s", "dq", "k"].includes(attPart(x.s.marks[t] || "")));
}
// «kam so'ralganlar ko'proq»: baholari kam bo'lgan o'quvchining og'irligi katta, bugun baho olgan kamdan-kam chiqadi
function pickWeights(pool, fair) {
  const mx = Math.max(0, ...pool.map((x) => x.n));
  return pool.map((x) => !fair ? 1 : (mx - x.n + 1) * (x.today ? 0.15 : 1));
}
function weightedPick(pool, w, rnd = Math.random) {
  const sum = w.reduce((a, b) => a + b, 0); let r = rnd() * sum;
  for (let i = 0; i < pool.length; i++) { r -= w[i]; if (r < 0) return pool[i]; }
  return pool[pool.length - 1];
}
const CALLED = {};   // shu seansda chaqirilganlar: sinf kaliti → Set(ism)

// guruhlar: tasodifiy yoki teng kuchli (o'rtacha baho bo'yicha muvozanatlangan)
function makeGroups(pool, k, mode, rnd = Math.random) {
  const a = pool.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  const G = Array.from({length: k}, () => []);
  if (mode === "even") {
    // «ilon» usulida tarqatib, keyin guruhlar o'rtachasi yaqinlashguncha o'quvchilarni almashtiramiz
    const v = (x) => x.avg ?? 6, mean = (g) => g.reduce((t, x) => t + v(x), 0) / (g.length || 1);
    const spread = () => { const ms = G.map(mean), m = ms.reduce((t, x) => t + x, 0) / k; return ms.reduce((t, x) => t + (x - m) ** 2, 0); };
    a.sort((x, y) => v(y) - v(x));
    a.forEach((x, i) => { const r = Math.floor(i / k), p = i % k; G[r % 2 ? k - 1 - p : p].push(x); });
    for (let pass = 0, better = true; better && pass < 50; pass++) {
      better = false;
      for (let g1 = 0; g1 < k; g1++) for (let g2 = g1 + 1; g2 < k; g2++) for (let i1 = 0; i1 < G[g1].length; i1++) for (let i2 = 0; i2 < G[g2].length; i2++) {
        const before = spread(); [G[g1][i1], G[g2][i2]] = [G[g2][i2], G[g1][i1]];
        if (spread() < before - 1e-9) better = true; else [G[g1][i1], G[g2][i2]] = [G[g2][i2], G[g1][i1]];
      }
    }
  } else a.forEach((x, i) => G[i % k].push(x));
  return G;
}

  const text = () => G.map((g, i) => `${i + 1}-guruh: ${g.map((x) => x.s.name).join(", ")}`).join("\n");

        <div class="seg"><button class="${mode === "rand" ? "on" : ""}" data-gm="rand">Tasodifiy</button><button class="${mode === "even" ? "on" : ""}" data-gm="even">Teng kuchli</button></div></div>
      <div class="muted">Darsda: ${pool.length} o'quvchi (bugun kelmaganlar qo'shilmaydi).${mode === "even" ? " Teng kuchli: har guruhga kuchli va kuchsizroq o'quvchilar teng taqsimlanadi." : ""}</div>
      <div class="grps">${G.map((g, i) => `<div class="grp"><div class="hrow"><b class="sp">${i + 1}-guruh</b><span class="muted">${g.length} ta${mode === "even" ? ` · o'rt. ${avgOf(g)}` : ""}</span></div>

// D.web.seats[ckey] = {rows, cols, at: {"q-u": ism}} — har parta 2 o'rinli (cols juft)
function seatsOf(c, make) {
  const all = D.web.seats = D.web.seats || {}, k = ckey(c);
  let s = all[k];
  if (!s && make) s = all[k] = {rows: Math.max(3, Math.ceil(c.students.length / 6)), cols: 6, at: {}};
  if (s) { const names = new Set(c.students.map((x) => x.name)); for (const [p, n] of Object.entries(s.at)) if (!names.has(n)) delete s.at[p]; }
  return s || null;
}
const ATT_COL = {s: "var(--danger)", dq: "#1565c0", k: "#7b1fa2", kq: "#6d4c41"};
// xarita HTML'i; sel — tanlangan o'rin (tahrirlashda), att — bugungi yo'qlama ko'rsatilsinmi
function seatGrid(c, s, {sel = null, att = false} = {}) {
  const idx = Object.fromEntries(c.students.map((x, i) => [x.name, i]));
  let h = `<div class="desk">🧑‍🏫 Doska</div><div class="seats" style="grid-template-columns:repeat(${s.cols},minmax(0,1fr))">`;
  for (let r = 0; r < s.rows; r++) for (let u = 0; u < s.cols; u++) {
    const p = `${r}-${u}`, n = s.at[p], si = n !== undefined ? idx[n] : -1, a = att && si >= 0 ? attOf(c, si) : "";
    h += `<button class="seat ${u % 2 ? "r" : "l"} ${n ? "" : "empty"} ${sel === p ? "on" : ""}" data-seat="${p}" ${a ? `style="background:${ATT_COL[a]};border-color:${ATT_COL[a]};color:#fff"` : ""}>${n ? `<span>${esc(shortName(n))}</span>${a ? `<small>${a.toUpperCase()}</small>` : ""}` : ""}</button>`;
  }
  return h + "</div>";
}
function seatAuto(c, s) {
  s.at = {}; const need = Math.ceil(c.students.length / s.cols); if (s.rows < need) s.rows = need;
  c.students.forEach((x, i) => { s.at[`${Math.floor(i / s.cols)}-${i % s.cols}`] = x.name; });
}
function seatsDialog(ci) {

        <span>Partalar qatorda:</span><div class="seg">${[2, 3, 4].map((k) => `<button class="${k * 2 === s.cols ? "on" : ""}" data-sc="${k * 2}">${k}</button>`).join("")}</div></div>

    <div class="muted">Sinfdagi partalar joylashuvi. «Darsni boshlash → Yo'qlama → Xarita» rejimida kelmaganlarni shu xaritadan bosib belgilaysiz.</div>

// s.bday = "YYYY-MM-DD" (yil noma'lum bo'lsa "0000-MM-DD"); kompyuter dasturi o'quvchidagi qo'shimcha kalitlarni saqlab qoladi
// matndan sana: 12.03.2013, 12/03/2013, 2013-03-12, 12.03
function parseBday(txt) {
  const t = String(txt || "").trim(); let m;
  if ((m = t.match(/(\d{4})-(\d{1,2})-(\d{1,2})/))) return bdayOk(+m[1], +m[2], +m[3]);
  if ((m = t.match(/(\d{1,2})[./-](\d{1,2})(?:[./-](\d{2,4}))?/))) { let y = m[3] ? +m[3] : 0; if (m[3] && m[3].length === 2) y += y > 30 ? 1900 : 2000; return bdayOk(y, +m[2], +m[1]); }
  return null;
}
function bdayOk(y, mo, d) {
  if (mo < 1 || mo > 12 || d < 1 || d > [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][mo - 1]) return null;
  return `${String(y).padStart(4, "0")}-${pad(mo)}-${pad(d)}`;
}
const fmtBday = (b) => b ? `${b.slice(8, 10)}.${b.slice(5, 7)}${b.startsWith("0000") ? "" : "." + b.slice(0, 4)}` : "";
// days kun ichidagi tug'ilgan kunlar: [{ci, s, left, age}]
function birthdays(days = 7, now = todayIso()) {
  const t0 = pdate(now), out = [];
  D.classes.forEach((c, ci) => c.students.forEach((s) => {
    if (!s.bday) return;
    const mo = +s.bday.slice(5, 7), d = +s.bday.slice(8, 10);
    for (const y of [t0.getFullYear(), t0.getFullYear() + 1]) {
      // 29-fevral kabisa bo'lmagan yilda 28-fevralda nishonlanadi
      let day = new Date(y, mo - 1, d); if (day.getMonth() !== mo - 1) day = new Date(y, mo - 1, d - 1);
      const left = Math.round((day - t0) / 864e5);
      if (left >= 0 && left <= days) { out.push({ci, s, left, age: s.bday.startsWith("0000") ? null : y - +s.bday.slice(0, 4)}); break; }
    }
  }));
  const seen = new Set();   // bir o'quvchi bir necha fanda — bir marta
  return out.sort((a, b) => a.left - b.left || a.s.name.localeCompare(b.s.name)).filter((x) => { const k = normName(x.s.name) + "|" + D.classes[x.ci].name; if (seen.has(k)) return false; seen.add(k); return true; });
}
function bdaysDialog(ci) {
  const c = D.classes[ci];
  const body = () => `<div class="lsns">${c.students.map((s, si) => `<div class="hrow" style="gap:8px;flex-wrap:nowrap"><span class="sp" style="min-width:0">${esc(s.name)}</span>
      <input class="form-control" type="text" data-bd="${si}" value="${fmtBday(s.bday)}" placeholder="kk.oo.yyyy" inputmode="numeric" style="width:130px;flex:none"></div>`).join("")}</div>`;
  return modal(`<h2>🎂 Tug'ilgan kunlar · ${esc(label(c))}</h2>
    <div class="muted">Sanani 12.03.2013 ko'rinishida yozing (yilsiz ham bo'ladi: 12.03). Tug'ilgan kun «Bugun» sahifasida va dars boshlanganda eslatiladi. Shu ism bilan boshqa fan jurnallarida ham saqlanadi.</div>
    <details><summary><b>Ro'yxatdan qo'yish</b> (masalan, Excel yoki emaktabdan nusxalab)</summary>
      <div class="vcol" style="gap:6px;margin-top:6px"><textarea id="bdp" placeholder="Abdullayev Sardor 12.03.2013&#10;Aliyeva Madina	05.11.2012"></textarea><button class="btn" data-bdp>Matndan to'ldirish</button></div></details>
    <div id="bdb">${body()}</div>
    <div class="hrow"><span class="sp"></span><button class="btn btn-primary" data-x>Yopish</button></div>`, (m, close) => {
    // bir xil ismli o'quvchi barcha jurnallarda (fanlarda) bir xil tug'ilgan kunga ega
    const setAll = (name, v) => { const k = normName(name); D.classes.forEach((x) => x.students.concat(x.students_off).forEach((s) => { if (normName(s.name) === k) { if (v) s.bday = v; else delete s.bday; } })); };
    const bind = () => m.querySelectorAll("[data-bd]").forEach((x) => x.onchange = () => {

    });

        const v = parseBday(line); if (!v) continue;
        const nm = normName(line.replace(/\d{1,4}[./-]\d{1,2}(?:[./-]\d{2,4})?/, " ").replace(/[\t;,]+/g, " "));
        const s = c.students.find((x) => normName(x.name) === nm) || c.students.find((x) => nm && (nm.startsWith(normName(x.name)) || normName(x.name).startsWith(nm)));

  });

// telefon: «90 123-45-67», «+998 (90) 1234567» → «+998901234567»; noto'g'ri bo'lsa null
function normPhone(t) {
  const d = String(t || "").replace(/\D/g, "");
  if (d.length === 9) return "+998" + d;
  if (d.length === 12 && d.startsWith("998")) return "+" + d;
  return d.length >= 10 && d.length <= 15 ? "+" + d : null;
}
const normTg = (t) => { const m = String(t || "").trim().match(/^(?:https?:\/\/)?(?:t\.me\/|@)?([A-Za-z][A-Za-z0-9_]{3,31})$/); return m ? m[1] : null; };
const fmtPhone = (p) => /^\+998\d{9}$/.test(p) ? `+998 ${p.slice(4, 6)} ${p.slice(6, 9)}-${p.slice(9, 11)}-${p.slice(11)}` : esc(p);
// shu ismli o'quvchiga barcha fan jurnallarida yozish

// D.web.schedule = {bells: [["08:00","08:45"], …], days: [[jurnal kaliti | "" har soat uchun] × 6 kun (Du…Sh)]}
const SCH_DEF_BELLS = [["08:00", "08:45"], ["08:50", "09:35"], ["09:40", "10:25"], ["10:35", "11:20"], ["11:25", "12:10"], ["12:15", "13:00"]];
const ckey = (c) => `${c.name}|${c.subject}`;
function sched() { const s = D.web.schedule; return s && Array.isArray(s.days) && s.days.some((d) => d.some(Boolean)) ? s : null; }
function schedEmpty() { return {bells: clone(SCH_DEF_BELLS), days: Array.from({length: 6}, () => SCH_DEF_BELLS.map(() => ""))}; }
// bugungi darslar soat tartibida: [{c, ci, no, from, to}]
function schedToday(t = todayIso()) {
  const s = sched(), wd = pyWd(t); if (!s || wd > 5) return [];
  return (s.days[wd] || []).map((k, no) => { const ci = D.classes.findIndex((c) => ckey(c) === k); return k && ci >= 0 ? {c: D.classes[ci], ci, no, from: (s.bells[no] || [])[0] || "", to: (s.bells[no] || [])[1] || ""} : null; }).filter(Boolean);
}
// jadvaldan har sinfning dars kunlarini olish; o'chgan kunlardagi bo'sh kelajak sanalar olib tashlanadi
function schedApplyWeekdays() {
  const s = sched(); if (!s) return 0; const q = quarterOf(todayIso()), t = todayIso(); let n = 0;
  for (const c of D.classes) {
    const wds = [0, 1, 2, 3, 4, 5].filter((d) => (s.days[d] || []).includes(ckey(c)));
    if (!wds.length || JSON.stringify(wds) === JSON.stringify((c.weekdays || []).slice().sort())) continue;
    c.weekdays = wds; n++;
    c.dates = c.dates.filter((d) => d < t || wds.includes(pyWd(d)) || hasMarks(c, d) || c.lessons[d] || c.works.some((w) => w.date === d));
    if (q) genQuarter(q, [c]);
  }

}
const normCls = (x) => String(x || "").toUpperCase().replace(/[«»"'ʻʼ`‘’\s._-]/g, "");
// Excel jadvalni o'qish: kunlar ustunlarda (yoki qatorlarda), har katakda «6-A», «6-A Matematika» kabi yozuv
function parseSchedule(rows) {
  const DAYRX = [/^(du|dush|пн|пон)/i, /^(se|sesh|вт|вто)/i, /^(ch|chor|ср|сре)/i, /^(pa|pay|чт|чет)/i, /^(ju|jum|пт|пят)/i, /^(sh|shan|сб|суб)/i];
  const dayOf = (v) => { const t = String(v || "").trim(); if (t.length < 2) return -1; return DAYRX.findIndex((r) => r.test(t)); };
  rows = rows.map((r) => (r || []).map((v) => v == null ? "" : String(v).trim()));
  let grid = rows, hr = grid.findIndex((r) => r.filter((v) => dayOf(v) >= 0).length >= 3);
  if (hr < 0) { // kunlar birinchi ustunlarda bo'lsa — jadvalni ag'darib qo'yamiz
    const w = Math.max(0, ...rows.map((r) => r.length));
    grid = Array.from({length: w}, (_, j) => rows.map((r) => r[j] || ""));
    hr = grid.findIndex((r) => r.filter((v) => dayOf(v) >= 0).length >= 3);
  }
  if (hr < 0) throw new Error("Jadvalda hafta kunlari (Dushanba, Seshanba …) topilmadi");
  const cols = grid[hr].map(dayOf), TRX = /(\d{1,2})[:.](\d{2})\s*[-–—]\s*(\d{1,2})[:.](\d{2})/;
  const byCls = new Map(); for (const c of D.classes) { const k = normCls(c.name); if (!byCls.has(k)) byCls.set(k, []); byCls.get(k).push(c); }
  const out = {bells: [], days: Array.from({length: 6}, () => [])}, miss = new Set();
  for (const r of grid.slice(hr + 1)) {
    if (r.join("").trim() === "") continue;
    const tm = r.map((v) => v.match(TRX)).find(Boolean);
    const no = out.bells.length; out.bells.push(tm ? [`${pad(+tm[1])}:${tm[2]}`, `${pad(+tm[3])}:${tm[4]}`] : (SCH_DEF_BELLS[no] || ["", ""]).slice());
    for (let d = 0; d < 6; d++) out.days[d][no] = "";
    r.forEach((v, j) => {
      const d = cols[j]; if (d < 0 || d > 5 || !v || v === "-" || v === "—") return;
      // «6 - A», «6-«A»», «6A» → «6A»; so'ng so'zlarga bo'lib sinf nomini qidiramiz
      const toks = new Set(v.toUpperCase().replace(/[«»"'ʻʼ`‘’]/g, "").replace(/(\d)\s*[-–.]?\s*([A-ZА-ЯЁ])(?![A-ZА-ЯЁ])/g, "$1$2").split(/[^0-9A-ZА-ЯЁ]+/));
      const hit = [...byCls.keys()].filter((k) => k && toks.has(k));
      const k = hit.sort((a, b) => b.length - a.length)[0];
      if (!k) { miss.add(v); return; }
      const list = byCls.get(k), low = v.toLowerCase();
      const c = list.find((x) => x.subject && low.includes(x.subject.toLowerCase().slice(0, 4))) || list[0];
      out.days[d][no] = ckey(c);
    });
  }
  while (out.bells.length && out.days.every((d) => !d[out.bells.length - 1])) { out.bells.pop(); out.days.forEach((d) => d.pop()); }
  return {schedule: out, missing: [...miss]};
}
async function scheduleTemplate() {

  const aoa = [["Soat", "Vaqt", ...WD_FULL.slice(0, 6)], ...s.bells.map((b, i) => [i + 1, b[0] ? `${b[0]}-${b[1]}` : "", ...s.days.map((d) => lbl(d[i]))])];

  const wb = X.utils.book_new(); X.utils.book_append_sheet(wb, ws, "Dars jadvali"); X.writeFile(wb, "dars_jadvali.xlsx");
}
function scheduleImport(onOk = scheduleEditor) {
  const f = document.createElement("input"); f.type = "file"; f.accept = ".xls,.xlsx,.csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
  f.onchange = async () => {
    const file = f.files[0]; if (!file) return;
    try {
      const X = await loadXlsx(), wb = X.read(await file.arrayBuffer(), {type: "array"});
      let res = null, err = null;
      for (const n of wb.SheetNames) { try { res = parseSchedule(X.utils.sheet_to_json(wb.Sheets[n], {header: 1, raw: false, defval: ""})); if (res.schedule.days.some((d) => d.some(Boolean))) break; } catch (e) { err = e; } }
      if (!res || !res.schedule.days.some((d) => d.some(Boolean))) throw err || new Error("Jadvalda sizning sinflaringiz topilmadi");
      onOk(res.schedule, res.missing);
    } catch (e) { toast("Jadvalni o'qib bo'lmadi: " + e.message); }
  };
  f.click();
}

    return `<button class="${k === day ? "on" : ""}" data-day="${k}" aria-pressed="${k === day}">${w}<small>${n || "·"}</small></button>`; }).join("");

    <div class="schtabs" role="tablist" id="scht">${tabs()}</div>
    <div class="schlist" id="schg">${list()}</div>
    <div class="hrow wrap" style="gap:8px"><button class="btn btn-sm" data-add>＋ Soat</button><button class="btn btn-sm" data-del>− Soat</button></div>
    <div class="hrow wrap schx"><span class="muted">Jadval Excel'da bormi?</span><button class="btn btn-sm" data-sx title="Maktab jadvalini Excel fayldan o'qish">📊 Excel'dan yuklash</button><button class="btn btn-sm" data-st title="To'ldirish uchun namuna fayl">⬇ Namuna</button></div>
    <div class="hrow" style="gap:8px"><span class="sp"></span><button class="btn" data-x>Bekor qilish</button><button class="btn btn-primary" data-ok>Saqlash</button></div>`, (m, close) => {

      m.querySelectorAll("[data-sd]").forEach((x) => x.onchange = () => { const [k, i] = x.dataset.sd.split("|").map(Number); s.days[k][i] = x.value;

        if (!t && x.value.trim()) { toast("Vaqtni 08:00-08:45 ko'rinishida yozing"); return; }

/* ───────── dars eslatmasi: jadval bo'yicha darsdan N daqiqa oldin bildirishnoma ───────── */
// D.web.remind = {on, min}; ilova ochiq (yoki fonda) turganda ishlaydi — server yo'q
const remCfg = () => Object.assign({on: false, min: 5}, D.web.remind || {});
const REM = {timers: [], fired: new Set()};
function remPlan(now = new Date()) {
  const t = iso(now), {min} = remCfg(), out = [];
  for (const x of schedToday(t)) {
    if (!x.from) continue;
    const [hh, mm] = x.from.split(":").map(Number), start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh, mm);
    if (isNoLesson(x.c, t) || start <= now) continue;
    const prev = x.c.dates.filter((d) => d < t && !isNoLesson(x.c, d)).pop(), hw = prev && (x.c.lessons[prev] || {}).hw;
    const topic = (x.c.lessons[t] || {}).topic;
    out.push({key: `${t}|${x.no}`, at: new Date(start - min * 6e4), ci: x.ci, title: `${x.no + 1}-soat · ${x.from} — ${label(x.c)}`,
      body: [topic ? `Mavzu: ${topic}` : "", hw ? `Uyga berilgan edi: ${hw}` : "", `${x.c.students.length} o'quvchi`].filter(Boolean).join("\n")});
  }
  return out;
}
async function remShow(p) {
  if (REM.fired.has(p.key)) return; REM.fired.add(p.key);
  toast(`🔔 ${p.title}`);
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  const opt = {body: p.body, tag: "dars-" + p.key, icon: "icon-192.png", badge: "icon-192.png", data: {ci: p.ci}};
  try { const r = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(); if (r) return await r.showNotification(p.title, opt); } catch (e) { /* oddiy bildirishnomaga o'tamiz */ }
  try { const n = new Notification(p.title, opt); n.onclick = () => { window.focus(); n.close(); }; } catch (e) { /* telefon brauzeri faqat SW orqali ruxsat beradi */ }
}
function remSchedule() {
  REM.timers.forEach(clearTimeout); REM.timers = [];
  const now = new Date();
  eveSchedule(now);
  if (!remCfg().on) { REM.timers.push(setTimeout(remSchedule, new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 1) - now)); return; }
  for (const p of remPlan(now)) {
    const ms = p.at - now;
    if (ms <= 0) remShow(p);   // eslatma vaqti o'tgan, lekin dars hali boshlanmagan — darhol
    else if (ms < 864e5) REM.timers.push(setTimeout(() => remShow(p), ms));
  }
  // yarim tunda ertangi kun uchun qayta rejalashtirish
  const mid = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 1);
  REM.timers.push(setTimeout(remSchedule, mid - now));
}
// kechki eslatma: D.web.eve = "18:00" (bo'sh — o'chiq); bugungi to'ldirilmagan darslar bo'lsa bildirishnoma
function eveSchedule(now = new Date()) {
  const e = D.web.eve; if (!e || !feat("gaps")) return;
  const [hh, mm] = e.split(":").map(Number), at = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh, mm), t = iso(now);
  const fire = () => { const g = lessonGaps(t, 1); if (g.length) remShow({key: "eve" + t, ci: g[0].ci, title: `📝 Bugun ${g.length} ta dars to'ldirilmagan`, body: g.map((x) => `${label(x.c)}: ${[x.noAtt ? "yo'qlama" : "", x.noTopic ? "mavzu" : ""].filter(Boolean).join(", ")}`).join("\n")}); };
  if (at > now) REM.timers.push(setTimeout(fire, at - now));
  else if (now - at < 3 * 36e5) fire();   // ilova kechroq ochilsa ham (3 soat ichida) eslatadi
}
async function remToggle() {
  const c = remCfg();
  if (!c.on) {
    if (!sched()) { toast("Avval dars jadvalini kiriting — eslatma jadvaldagi soatlarga qarab keladi"); return; }
    if ("Notification" in window && Notification.permission === "default") { try { await Notification.requestPermission(); } catch (e) { /* eski brauzer */ } }
    if (!("Notification" in window) || Notification.permission !== "granted") toast("Brauzer bildirishnomaga ruxsat bermadi — eslatma faqat ilova ichida chiqadi");
  }
  D.web.remind = Object.assign(c, {on: !c.on}); save(); remSchedule(); render();
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && D && D.web) remSchedule(); });

/* ───────── Telegram: avtomatik zaxira va qurilmalar orasida sinxronlash ───────── */
// O'qituvchining o'z boti: token faqat shu brauzerda saqlanadi (journal.json ga yozilmaydi).
// Zaxira botga fayl bo'lib boradi va qadab qo'yiladi; boshqa qurilma qadalgan faylni ko'rib, yangiroq bo'lsa yuklashni taklif qiladi.
const TG_KEY = "yoqlama_tg", TG_GAP = 2 * 36e5;
function tgCfg() { try { return JSON.parse(localStorage.getItem(TG_KEY)) || {}; } catch (e) { return {}; } }
function tgSet(p) { const c = Object.assign(tgCfg(), p); try { localStorage.setItem(TG_KEY, JSON.stringify(c)); } catch (e) {} return c; }
const tgOn = () => { const c = tgCfg(); return !!(c.token && c.chat); };
function tgDev() { let c = tgCfg(); if (!c.dev) c = tgSet({dev: Math.random().toString(36).slice(2, 8)}); return c.dev; }
const tgAge = () => { const l = tgCfg().last; return tgOn() && l ? Math.floor((Date.now() - Date.parse(l)) / 864e5) : null; };
const djb = (t) => { let x = 5381; for (let i = 0; i < t.length; i++) x = (x * 33 ^ t.charCodeAt(i)) >>> 0; return x.toString(36) + t.length; };
// Bot API so'rovi «oddiy» ko'rinishda (form yoki FormData): JSON sarlavhasi brauzerni avval OPTIONS so'rovini yuborishga majbur qilardi,
// ba'zi tarmoqlarda u o'tmay «Telegram'ga ulanib bo'lmadi» chiqardi
async function tgApi(method, params, token = tgCfg().token) {
  const body = params instanceof FormData ? params : new URLSearchParams(Object.entries(params || {}).map(([k, v]) => [k, typeof v === "object" ? JSON.stringify(v) : String(v)]));
  for (let k = 0; ; k++) {
    const r = await tgFetch(`https://api.telegram.org/bot${token}/${method}`, {method: "POST", body});
    const j = await r.json().catch(() => ({}));
    if (j.ok) return j.result;
    // ko'p xabar ketma-ket ketganda Telegram «biroz kuting» deydi — kutib, qayta yuboramiz
    const w = j.parameters && j.parameters.retry_after;
    if (j.error_code === 429 && w && w <= 30 && k < 3) { await new Promise((ok) => setTimeout(ok, w * 1000 + 300)); continue; }
    throw new Error(j.description || `Telegram javob bermadi (${r.status})`);
  }
}
// tarmoq xatosi: bir marta qayta urinadi, so'ng sababini aniqlab tushunarli xabar beradi
async function tgFetch(url, opt = {}, ms = 25000) {
  for (let k = 0; ; k++) {
    const ac = new AbortController(), tm = setTimeout(() => ac.abort(), ms);
    try { return await fetch(url, Object.assign({}, opt, {signal: ac.signal})); }
    catch (e) { if (k) throw await tgNetErr(e); await new Promise((r) => setTimeout(r, 1500)); }
    finally { clearTimeout(tm); }
  }
}
async function tgNetErr(e) {
  if (navigator.onLine === false) return Object.assign(new Error("Internet yo'q — ulanib, qayta urinib ko'ring"), {net: "off"});
  let reach = false;
  try { await fetch("https://api.telegram.org/", {mode: "no-cors", cache: "no-store"}); reach = true; } catch (x) { /* server ochilmadi */ }
  if (reach) return Object.assign(new Error("Telegram serveri ochildi, lekin brauzer javobni qabul qilmadi — sahifani yangilab, qayta urinib ko'ring"), {net: "cors"});
  return Object.assign(new Error(e && e.name === "AbortError" ? "Telegram javob bermadi (vaqt tugadi) — internet sekin yoki Telegram tarmog'ingizda to'silgan. VPN yoqib, qayta urinib ko'ring"
    : "Telegram serveriga ulanib bo'lmadi — internetni tekshiring. Telegram ilovasi VPN bilan ishlasa, brauzerda ham VPN yoqing"), {net: "down"});
}
const tgErrTxt = (e) => e.net ? e.message : "Telegram: " + e.message;
let TG_NEW = null, tgBusy = false; // TG_NEW — boshqa qurilmadan kelgan yangiroq zaxira (Bugun sahifasida taklif qilinadi)
// Telegram fayl manzili (api.telegram.org/file/…) brauzerga CORS ruxsatini bermaydi — faylni qaytarib o'qib bo'lmaydi.
// Shuning uchun zaxira yana siqilgan matn bo'laklari bo'lib xabar sifatida ham boradi; bot API usullari esa CORS bilan ishlaydi.
const TG_PART = 4000, TG_MAXP = 60;
const b64u = (u8) => { let t = ""; for (let i = 0; i < u8.length; i += 0x8000) t += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(t).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
const unb64u = (t) => { const b = atob(t.replace(/-/g, "+").replace(/_/g, "/")), u8 = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u8[i] = b.charCodeAt(i); return u8; };
async function gzipTxt(t) { return new Uint8Array(await new Response(new Blob([t]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer()); }
async function gunzipTxt(u8) { return new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream("gzip"))).text(); }
/* Zaxirani parol bilan shifrlash (ixtiyoriy): PBKDF2-SHA256 → AES-GCM 256, brauzerning o'z crypto.subtle vositasi.
   Telegram akkauntiga begona kirsa ham o'quvchilar ma'lumoti o'qilmaydi. Parol shu qurilmada (bot tokeni yonida) turadi. */
const SEAL_ITER = 310000;
async function sealKey(pass, salt, use) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name: "PBKDF2", salt, iterations: SEAL_ITER, hash: "SHA-256"}, base, {name: "AES-GCM", length: 256}, false, [use]);
}
async function sealTxt(txt, pass) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name: "AES-GCM", iv}, await sealKey(pass, salt, "encrypt"), new TextEncoder().encode(txt)));
  return JSON.stringify({type: "jurnal-sealed", v: 1, salt: b64u(salt), iv: b64u(iv), ct: b64u(ct)});
}
const isSealed = (d) => !!d && d.type === "jurnal-sealed";
async function unsealTxt(d, pass) {
  try {
    const pt = await crypto.subtle.decrypt({name: "AES-GCM", iv: unb64u(d.iv)}, await sealKey(pass, unb64u(d.salt), "decrypt"), unb64u(d.ct));
    return new TextDecoder().decode(pt);
  } catch (e) { throw new Error("Parol noto'g'ri yoki zaxira buzilgan"); }
}
// shifrlangan zaxirani ochish: saqlangan parol bilan, bo'lmasa so'raladi (3 marta)
async function openSealed(d) {
  if (!isSealed(d)) return d;
  const saved = tgCfg().pass;
  if (saved) try { return JSON.parse(await unsealTxt(d, saved)); } catch (e) { /* parol o'zgargan — so'raymiz */ }
  for (let i = 0; i < 3; i++) {
    const p = await ask("Shifrlangan zaxira", i ? "Parol noto'g'ri. Qayta kiriting:" : "Bu zaxira parol bilan shifrlangan. Parolni kiriting:", "", "password");
    if (p === null) throw new Error("Parol kiritilmadi — zaxira yuklanmadi");
    try { const out = JSON.parse(await unsealTxt(d, p)); if (tgOn()) tgSet({pass: p}); return out; } catch (e) { /* yana */ }
  }
  throw new Error("Parol noto'g'ri — zaxira yuklanmadi");
}
const tgBtn = () => ({inline_keyboard: [[{text: "📒 Ilovani ochish", url: `https://akmal1st.github.io/yoqlama-jurnal/#${Date.now().toString(36)}`}]]});
async function tgSendParts(chat, json) {
  if (typeof CompressionStream === "undefined") return [];
  const z = b64u(await gzipTxt(json)), n = Math.ceil(z.length / TG_PART), ids = [];
  if (n > TG_MAXP) return [];
  for (let i = 0; i < n; i++) {
    const m = await tgApi("sendMessage", {chat_id: chat, text: `📦${i + 1}/${n} ${z.slice(i * TG_PART, (i + 1) * TG_PART)}`, disable_notification: true, reply_markup: tgBtn()});
    ids.push(m.message_id);
  }
  return ids;
}
// o'z xabarining matnini qaytarib olish: tugmani yangilash (editMessageReplyMarkup) butun xabarni qaytaradi
async function tgReadParts(ids) {
  const chat = tgCfg().chat, out = [];
  for (let i = 0; i < ids.length; i += 5) {
    const ms = await Promise.all(ids.slice(i, i + 5).map((id) => tgApi("editMessageReplyMarkup", {chat_id: chat, message_id: id, reply_markup: tgBtn()})));
    for (const m of ms) { const t = m.text || ""; out.push(t.slice(t.indexOf(" ") + 1)); }
  }
  return JSON.parse(await gunzipTxt(unb64u(out.join(""))));
}
const tgPartIds = (pm) => (((pm.caption || "").match(/#d([\d.]+)/) || [])[1] || "").split(".").filter(Boolean).map(Number);
async function tgBackup(force) {
  const c = tgCfg(); if (!c.token || !c.chat || tgBusy) return false;
  const hash = djbData();
  if (!force && c.hash === hash) return false;
  tgBusy = true;
  try {
    const json = c.pass ? await sealTxt(JSON.stringify(D), c.pass) : JSON.stringify(D);
    const now = new Date(), hm = `${pad(now.getHours())}:${pad(now.getMinutes())}`, fd = new FormData();
    let parts = [];
    try { parts = await tgSendParts(c.chat, json); } catch (e) { console.warn("Telegram bo'laklar:", e.message); }
    fd.append("chat_id", c.chat);
    fd.append("document", new Blob([json], {type: "application/json"}), `journal_${iso(now)}_${hm.replace(":", "")}.json`);
    fd.append("caption", `📒 Yo'qlama jurnali zaxirasi\n${fmt(iso(now))} ${hm} · ${D.classes.length} ta sinf\n${c.pass ? "🔐 Parol bilan shifrlangan.\n" : ""}Tiklash: ilovada «Sozlamalar → Ma'lumotlar → Telegram'dan yuklash» yoki faylni «Fayldan yuklash» orqali oching.\n#q${tgDev()}${parts.length ? " #d" + parts.join(".") : ""}`);
    fd.append("disable_notification", "true");
    const msg = await tgApi("sendDocument", fd);
    try { await tgApi("pinChatMessage", {chat_id: c.chat, message_id: msg.message_id, disable_notification: true}); } catch (e) { /* qadash shart emas */ }
    // oldingi zaxiraning matn bo'laklari endi kerak emas (fayllar tarix uchun qoladi)
    if (c.parts && c.parts.length) try { await tgApi("deleteMessages", {chat_id: c.chat, message_ids: c.parts}); } catch (e) { /* 48 soatdan eski xabar o'chmaydi — zarari yo'q */ }
    tgSet({hash, last: now.toISOString(), seen: msg.message_id, parts});
    return true;
  } finally { tgBusy = false; }
}
async function tgPinned() {
  const ch = await tgApi("getChat", {chat_id: tgCfg().chat}), pm = ch.pinned_message;
  return pm && pm.document ? pm : null;
}
// saqlash vaqti (web.saved) o'zgarishi «yangi ma'lumot» hisoblanmasin
function djbData() { const w = D.web.saved; delete D.web.saved; const h = djb(JSON.stringify(D)); if (w) D.web.saved = w; return h; }
async function tgPull(pm) {
  const ids = tgPartIds(pm);
  let data;
  if (ids.length && typeof DecompressionStream !== "undefined") data = await tgReadParts(ids);
  else {
    const f = await tgApi("getFile", {file_id: pm.document.file_id});
    try { data = await (await tgFetch(`https://api.telegram.org/file/bot${tgCfg().token}/${f.file_path}`)).json(); }
    catch (e) { if (e.net === "cors") throw Object.assign(new Error("Bu zaxira eski usulda yuborilgan — brauzer uni o'qiy olmaydi. Uni yuborgan qurilmada ilovani yangilab, «Sozlamalar → Ma'lumotlar → 📤 Hozir yuborish»ni bosing, so'ng shu yerda qayta yuklang. Yoki botdagi faylni telefonga saqlab, «Fayldan yuklash» orqali oching"), {net: "file"}); throw e; }
  }
  data = await openSealed(data);
  if (!data || !Array.isArray(data.classes)) throw new Error("bu jurnal fayli emas");
  if (tooNew(data)) throw new Error("zaxira ilovaning yangiroq versiyasida saqlangan — sahifani yangilang");
  await keepBefore();
  D = migrate(normalize(data)); autoDates(); save(); TG_NEW = null;
  tgSet({seen: pm.message_id, hash: djbData(), last: new Date(pm.date * 1000).toISOString(), parts: ids});
}
// ilova ochilganda: avval boshqa qurilmada yangiroq zaxira bormi — bo'lsa, so'ramasdan ustidan yozmaymiz
async function tgAuto() {
  if (!tgOn() || navigator.onLine === false) return;
  try {
    const pm = await tgPinned(), dev = pm && ((pm.caption || "").match(/#q(\w+)/) || [])[1];
    if (pm && dev !== tgDev() && pm.message_id > (tgCfg().seen || 0)) { TG_NEW = pm; if (S.page === "today") render(); return; }
    await tgBackup(false);
  } catch (e) { console.warn("Telegram:", e.message); }
}
document.addEventListener("visibilitychange", () => {
  const l = tgCfg().last;
  if (document.visibilityState === "hidden" && tgOn() && !TG_NEW && (!l || Date.now() - Date.parse(l) > TG_GAP)) tgBackup(false).catch(() => {});
});
function tgSetup() {
  return modal(`<h2>Telegram'ga avtomatik zaxira</h2>
    <div class="muted">Ma'lumotlaringiz o'zingizning Telegram botingizga fayl bo'lib boradi: har gal ilovani ochganingizda (o'zgarish bo'lsa) va ilovadan chiqqaningizda (2 soatda bir martadan ko'p emas). Bot faqat sizniki — boshqa hech kim ko'rmaydi.</div>
    <ol class="vcol" style="gap:8px;padding-left:20px;margin:4px 0">
      <li>Telegram'da <a href="https://t.me/BotFather" target="_blank" rel="noopener"><b>@BotFather</b></a> ni oching, <b>/newbot</b> deb yozing, botga nom va «..._bot» bilan tugaydigan manzil bering.</li>
      <li>BotFather bergan <b>tokenni</b> (masalan, <code>123456789:AAH…</code>) nusxalab shu yerga qo'ying:</li></ol>
    <input class="form-control" type="text" id="tgt" placeholder="123456789:AAH..." autocomplete="off" spellcheck="false">
    <div id="tgs" class="vcol" style="gap:8px"></div>
    <div class="hrow"><span class="sp"></span><button class="btn" data-x>Bekor qilish</button><button class="btn btn-primary" data-ok>Davom etish</button></div>`, (m, close) => {
    let step = 0, bot = null;
    const out = $("#tgs", m), ok = $("[data-ok]", m), tok = () => $("#tgt", m).value.trim();
    $("[data-x]", m).onclick = () => close(false);
    ok.onclick = async () => {
      ok.disabled = true;
      try {
        if (step === 0) {
          if (!/^\d+:[\w-]{20,}$/.test(tok())) throw new Error("Token noto'g'ri ko'rinishda");
          bot = await tgApi("getMe", {}, tok()); step = 1; ok.textContent = "Tekshirish";
          out.innerHTML = `<div>3. Endi botingizni oching va <b>«Start»</b> (yoki «Boshlash») tugmasini bosing:</div>
            <a class="btn" href="https://t.me/${esc(bot.username)}" target="_blank" rel="noopener">✈️ @${esc(bot.username)} ni ochish</a><div class="muted">So'ng shu yerga qaytib «Tekshirish»ni bosing.</div>`;
        } else {
          const ups = await tgApi("getUpdates", {}, tok());
          const u = ups.reverse().find((x) => x.message && x.message.chat && x.message.chat.type === "private");
          if (!u) throw new Error("Botga hali xabar kelmadi — botni ochib «Start» bosing, so'ng qayta tekshiring");
          tgSet({token: tok(), chat: u.message.chat.id, bot: bot.username, hash: "", seen: 0});
          await tgApi("sendMessage", {chat_id: u.message.chat.id, text: "✅ Yo'qlama jurnali ulandi. Zaxira nusxalar shu yerga keladi, oxirgisi doim tepada qadalgan turadi."});
          TG_NEW = null; await tgAuto(); close(true);
        }
      } catch (e) { toast(e.message); }
      ok.disabled = false;
    };
  });
}
async function tgAction(a) {
  try {
    if (a === "tgon") { if (await tgSetup()) { render(); toast(TG_NEW ? "Ulandi. Botda boshqa qurilmadan zaxira bor — «Bugun» sahifasiga qarang" : "Ulandi va birinchi zaxira yuborildi"); } }
    else if (a === "tgpass") {
      const p1 = await ask("Zaxira paroli", "Kamida 6 belgi. Unutsangiz, shifrlangan zaxirani hech kim (biz ham) ocha olmaydi:", "", "password"); if (p1 === null) return;
      if (p1.length < 6) { toast("Parol kamida 6 belgidan iborat bo'lishi kerak"); return; }
      const p2 = await ask("Zaxira paroli", "Parolni takrorlang:", "", "password"); if (p2 !== p1) { toast("Parollar mos kelmadi"); return; }
      tgSet({pass: p1}); toast("Yuborilmoqda…"); await tgBackup(true); render(); toast("Shifrlash yoqildi — zaxira parol bilan yuborildi");
    } else if (a === "tgnopass") {
      if (!await confirmBox("Shifrlashni o'chirish", "Keyingi zaxiralar shifrlanmagan holda yuboriladi.", "O'chirish")) return;
      const c = tgCfg(); delete c.pass; localStorage.setItem(TG_KEY, JSON.stringify(c)); await tgBackup(true); render(); toast("Shifrlash o'chirildi");
    }
    else if (a === "tgsend") { toast("Yuborilmoqda…"); await tgBackup(true); TG_NEW = null; render(); toast("Zaxira Telegram'ga yuborildi"); }
    else if (a === "tgload" || a === "tgnew") {
      const pm = a === "tgnew" ? TG_NEW : await tgPinned();
      if (!pm) { toast("Botda qadalgan zaxira topilmadi"); return; }
      const when = new Date(pm.date * 1000);
      if (!await confirmBox("Telegram'dan yuklash", `${fmt(iso(when))} ${pad(when.getHours())}:${pad(when.getMinutes())} dagi zaxira yuklanadi.\nShu qurilmadagi hozirgi ma'lumotlar uning o'rniga almashtiriladi.`, "Yuklash")) return;
      await tgPull(pm); S.ci = 0; go("today"); toast(`${D.classes.length} ta sinf Telegram'dan yuklandi`);
    } else if (a === "tgkeep") { tgSet({seen: TG_NEW.message_id}); TG_NEW = null; await tgBackup(true); render(); toast("Shu qurilmadagi ma'lumotlar Telegram'ga yuborildi"); }
    else if (a === "tgoff") {
      if (!await confirmBox("Telegram'ni uzish", "Avtomatik zaxira to'xtaydi. Botdagi eski fayllar o'chmaydi.", "Uzish")) return;
      const c = tgCfg(); localStorage.setItem(TG_KEY, JSON.stringify({dev: c.dev})); TG_NEW = null; render();
    }
  } catch (e) { toast(tgErrTxt(e)); }
}
