<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c5d66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jurnal">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Yo'qlama jurnali</title>
<style>
:root{
  --win:#f5f1e8;--base:#fffdf8;--alt:#f8f4eb;--soft:#efe8da;--line:#e4dccb;--text:#1b2a2f;--muted:#6c7774;
  --acc:#0b6f79;--acc-d:#08525a;--acc-fg:#ffffff;--acc-soft:#e1efee;--today:#f2c14e;--today-cell:#fdf3d4;--danger:#b8322a;--ok:#2f7a3a;
  --side-bg:linear-gradient(175deg,#0c5d66 0%,#083f46 100%);--side-fg:#e8f3f2;--side-mut:#9fc4c3;
  --sh:0 1px 2px rgba(60,45,20,.05),0 6px 20px -10px rgba(60,45,20,.18);--sh-lg:0 2px 4px rgba(60,45,20,.06),0 18px 40px -16px rgba(60,45,20,.30);
  --r:18px;--side:232px;
}
:root[data-theme="dark"]{
  --win:#0e1517;--base:#151f22;--alt:#1a262a;--soft:#223136;--line:#2a3b40;--text:#e9eeec;--muted:#93a4a3;
  --acc:#3fb8c2;--acc-d:#6ccdd5;--acc-fg:#062427;--acc-soft:#173a3e;--today:#d9a93a;--today-cell:#3a3320;--danger:#f07a70;--ok:#72c27a;
  --side-bg:linear-gradient(175deg,#0f2a2e 0%,#0a1b1e 100%);--side-fg:#e3efee;--side-mut:#86a7a7;
  --sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);--sh-lg:0 2px 6px rgba(0,0,0,.35),0 20px 48px -18px rgba(0,0,0,.75);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="dark"]){
    --win:#0e1517;--base:#151f22;--alt:#1a262a;--soft:#223136;--line:#2a3b40;--text:#e9eeec;--muted:#93a4a3;
    --acc:#3fb8c2;--acc-d:#6ccdd5;--acc-fg:#062427;--acc-soft:#173a3e;--today:#d9a93a;--today-cell:#3a3320;--danger:#f07a70;--ok:#72c27a;
    --side-bg:linear-gradient(175deg,#0f2a2e 0%,#0a1b1e 100%);--side-fg:#e3efee;--side-mut:#86a7a7;
    --sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);--sh-lg:0 2px 6px rgba(0,0,0,.35),0 20px 48px -18px rgba(0,0,0,.75);
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--win);color:var(--text);font:15px/1.45 "Liberation Serif","Times New Roman",Tinos,Times,serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
/* chap panel */
.side{width:var(--side);flex:none;background:var(--base);border-right:1px solid var(--line);padding:20px 14px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;padding:0 6px 18px}
.logo b{width:36px;height:36px;border-radius:10px;background:var(--acc);color:var(--acc-fg);display:grid;place-items:center;font-weight:800}
.logo span{display:flex;flex-direction:column;font-weight:800;line-height:1.2}.logo small{color:var(--muted);font-weight:500}
.nav{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;border:0;background:transparent;font-weight:600;text-align:left;width:100%}
.nav:hover{background:var(--soft)}
.nav.on{background:var(--acc);color:var(--acc-fg)}
.nav svg{width:20px;height:20px;flex:none}
.side .grow{flex:1}
.compact .side{width:76px}.compact .side .lbl,.compact .logo span{display:none}.compact .nav{justify-content:center;padding:11px 0}
main{flex:1;min-width:0;padding:26px 32px 40px}
/* mobil */
.tabbar{display:none}
@media (max-width:820px){
  .side{display:none}
  main{padding:16px 14px 96px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--base);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tabbar .nav{flex-direction:column;gap:2px;padding:6px 0;font-size:12px;justify-content:center;align-items:center;text-align:center}
}
h1{font-size:28px;font-weight:800;margin:0;line-height:1.2}
h2{font-size:19px;font-weight:800;margin:0}
@media (max-width:820px){h1{font-size:22px}}
.muted{color:var(--muted)}
.card{background:var(--base);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.hot{border:2px solid var(--acc)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:6px}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--base);font-weight:600;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-fg);font-weight:700}
.btn.pri:hover{background:var(--acc-d)}
.btn.sm{min-height:34px;padding:0 12px;font-size:14px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
a.btn{text-decoration:none;color:inherit}a.btn.pri{color:var(--acc-fg)}
.link{border:0;background:none;color:var(--acc);font-weight:700;padding:4px}
.chip{min-height:38px;padding:0 15px;border-radius:99px;border:1px solid var(--line);background:var(--base);font-weight:600;white-space:nowrap}
.chip.on{background:var(--text);border-color:var(--text);color:var(--base)}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:4px;gap:3px}
.seg button{white-space:nowrap;min-height:32px;padding:0 12px;border:0;border-radius:8px;background:transparent;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--base);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.tag{color:var(--acc);font-weight:800;font-size:12px;letter-spacing:1px}
.ok{color:var(--ok);font-weight:700}.warn{color:var(--danger);font-weight:700}
.grid{display:grid;gap:16px}
.lessons{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.two{grid-template-columns:3fr 2fr;align-items:start}
@media (max-width:1000px){.two{grid-template-columns:1fr}}
.big{font-size:24px;font-weight:800}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--soft)}
.av{width:38px;height:38px;border-radius:12px;background:var(--soft);color:var(--acc);display:grid;place-items:center;font-weight:800;flex:none}
table.j .sn{display:none}
.lsns{position:relative;display:flex;flex-direction:column;gap:6px;max-height:min(60vh,520px);overflow:auto;padding-right:2px}
.lsn{display:grid;grid-template-columns:62px minmax(0,1.4fr) minmax(0,1fr);gap:6px;align-items:center;padding:4px;border-radius:10px}
.lsn.today{background:var(--acc-soft)}.lsn b{line-height:1.1}.lsn b small{display:block;color:var(--muted);font-weight:600;font-size:11.5px}
.lsn input{min-height:36px;padding:6px 9px}
.pmsg{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--line);border-radius:12px}.pmsg textarea{min-height:110px;font-size:14px}
@media (max-width:560px){.lsn{grid-template-columns:52px minmax(0,1fr)}.lsn input[data-lh]{grid-column:2}}
.pick{min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:12px;border-radius:14px;background:var(--acc-soft)}
.pname{font-size:30px;font-weight:800;line-height:1.15}.pick.flash{animation:pk .35s ease-out}@keyframes pk{from{transform:scale(.92);opacity:.3}to{transform:none;opacity:1}}
.grps{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;max-height:min(55vh,480px);overflow:auto}.grp{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:3px}
.swp{display:flex;flex-direction:column;gap:14px;max-width:460px;margin:0 auto;width:100%}.swbar{height:6px;border-radius:9px;background:var(--soft);overflow:hidden}.swbar i{display:block;height:100%;background:var(--acc)}
.swc{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:26px 16px;border:1px solid var(--line);border-radius:18px;background:var(--base);box-shadow:0 6px 20px rgba(0,0,0,.08);touch-action:pan-y;user-select:none;transition:transform .15s,background .15s}
.swc.yes{background:color-mix(in srgb,var(--ok) 20%,var(--base))}.swc.no{background:color-mix(in srgb,var(--danger) 20%,var(--base))}.av.big2{width:72px;height:72px;font-size:26px;border-radius:20px}
.swb{gap:10px}.swb .btn{flex:1;min-height:56px;font-size:18px;justify-content:center}.swb .swyes,.swb .swyes:hover{background:var(--ok);border-color:var(--ok);color:var(--base)}.swb .swno,.swb .swno:hover{background:var(--danger);border-color:var(--danger);color:var(--base)}
.smap{overflow:auto}.desk{margin:0 auto 10px;width:max-content;padding:4px 18px;border-radius:8px;background:var(--soft);font-weight:700;font-size:13px}
.seats{display:grid;gap:8px 0;min-width:300px}.seat{min-height:52px;border:1px solid var(--line);background:var(--base);padding:3px;font-size:12.5px;font-weight:700;line-height:1.15;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.seat.l{border-radius:10px 0 0 10px;margin-left:8px}.seat.r{border-radius:0 10px 10px 0;margin-right:8px;border-left-style:dashed}.seat.empty{background:var(--soft);border-style:dashed}.seat.on{outline:3px solid var(--acc);outline-offset:-2px}.seat small{font-size:10.5px;opacity:.9}
.bday{background:color-mix(in srgb,var(--today) 22%,var(--base));border-color:var(--today)}
.hwb{min-height:32px;padding:0 10px;border-radius:8px;border:1px dashed var(--line);background:var(--base);font-weight:700;font-size:12.5px;color:var(--muted)}
.hwb.ok{background:var(--ok);border:1px solid var(--ok);color:var(--base)}.hwb.no{background:var(--danger);border:1px solid var(--danger);color:var(--base)}.hwcard{margin:6px 0;padding:10px 14px}
@media (max-width:560px){.lrow .who.hwn{flex:1 1 calc(100% - 130px)}}
.pcon{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr) minmax(0,.9fr);gap:6px;align-items:center;padding:4px}.pcon input{min-height:36px;padding:6px 9px}
.pcon.one{grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);padding:0}
@media (max-width:560px){.pcon{grid-template-columns:1fr 1fr;border-bottom:1px solid var(--soft);padding-bottom:8px}.pcon b{grid-column:1/-1}.pcon input[data-pn]{grid-column:1/-1}.pcon.one{grid-template-columns:1fr 1fr}.pcon.one span,.pcon.one #cpn{grid-column:1/-1}}
.tag.now{background:var(--acc);color:#fff;padding:2px 8px;border-radius:99px;margin-left:6px}
table.sch td{padding:0}table.sch select{min-width:96px;min-height:36px;padding:4px 6px;font-size:13px}table.sch td.bl{display:flex;flex-direction:column;gap:2px;align-items:center;padding:2px 4px}table.sch td.bl input{width:104px;min-height:32px;padding:2px 6px;font-size:13px;text-align:center}
.badge{font-size:11px;font-weight:800;color:#b42318;background:#fde8e6;padding:1px 7px;border-radius:99px;margin-left:6px;white-space:nowrap}
input[type=text],input[type=tel],input[type=date],input[type=password],input[type=number],select,textarea{background:var(--base);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:40px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
textarea{min-height:120px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:14px}
/* jurnal jadvali */
.tblwrap{overflow:auto;background:var(--base);border:1px solid var(--line);border-radius:var(--r);padding:6px;max-height:calc(100vh - 270px)}
@media (max-width:820px){.tblwrap{max-height:none}}
/* yonga surilganda sana ustuni ism ustuni ostida yarim qolib ketmasin: ustunlar chegarasiga tortiladi */
.tblwrap{scroll-snap-type:x mandatory;position:relative}table.j th:not(.nm){scroll-snap-align:start}
table.j{border-collapse:separate;border-spacing:4px;font-size:14px}
table.j th{font-weight:700;color:var(--muted);position:sticky;top:0;background:var(--base);z-index:2;padding:4px 0}
/* yopishqoq sarlavha: orasidagi va ustidagi bo'shliqlardan pastki qatorlar ko'rinmasin */
table.j th{box-shadow:0 0 0 4px var(--base),0 -14px 0 4px var(--base)}
.dense table.j th{box-shadow:0 0 0 3px var(--base),0 -14px 0 3px var(--base)}
table.j th.d{border-radius:0}table.j th.d.today{border-radius:8px}
table.j th.nm{box-shadow:-8px 0 0 var(--base),1px 0 0 var(--base),0 4px 0 var(--base),0 -18px 0 var(--base),-8px 4px 0 var(--base),-8px -18px 0 var(--base)}
table.j th.d{min-width:40px;text-align:center;line-height:1.15;border-radius:8px}
table.j th.d small{display:block;font-size:11px;font-weight:600}
table.j th.d.today{background:var(--today);color:#12303a}
table.j th.d.x{opacity:.55}
table.j th.d.m small{color:var(--acc);font-weight:800}
table.j .nm{position:sticky;left:0;background:var(--base);box-shadow:-8px 0 0 var(--base),1px 0 0 var(--base);z-index:1;white-space:nowrap;font-weight:600;padding:0 8px 0 2px;max-width:240px;overflow:hidden;text-overflow:ellipsis}
table.j th.nm{z-index:3}
table.j .nm i{font-style:normal;color:var(--muted);font-weight:500;display:inline-block;min-width:22px}
table.j tr.cur .nm{color:var(--acc)}
table.j td.c{padding:0}
.cell{width:100%;min-width:40px;height:36px;border:0;border-radius:7px;font-weight:700;font-size:15px;background:var(--alt);color:var(--text);padding:0;line-height:1}
.cell.t{background:var(--today-cell)}
.cell.sel{box-shadow:0 0 0 3px var(--acc)}
.cell.ro{cursor:default}
table.j td.s{text-align:center;font-weight:800;padding:0 6px;white-space:nowrap}
table.j td.s.a{color:var(--muted);font-weight:600}
.dense table.j{border-spacing:2px;font-size:12.5px}
.dense table.j th.d{min-width:27px}
.dense .cell{min-width:27px;height:23px;font-size:12px;border-radius:4px}
.dense table.j .nm{max-width:190px}
.dense .tblwrap{max-height:calc(100vh - 230px)}
.keys{position:sticky;bottom:0;margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--base);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;z-index:5}
@media (max-width:820px){
  .keys{bottom:64px;flex-wrap:nowrap;overflow-x:auto;padding:8px;gap:5px}
  .keys .hint{flex:none;max-width:120px;white-space:normal;font-size:12px}
  .key{min-width:40px;height:40px;flex:none}
  .chips{flex-wrap:nowrap!important;overflow-x:auto;padding-bottom:2px}
  table.j .nm{max-width:130px}
  .foot .muted{font-size:13px}
}
.key{min-width:44px;height:44px;border-radius:10px;border:1px solid var(--line);font-weight:800;font-size:16px}
.dense .key{min-width:36px;height:34px;font-size:14px}
.keys .hint{flex-basis:100%;font-weight:700;font-size:14px}
@media (min-width:821px){.keys .hint{flex-basis:auto;margin-right:6px}}
/* dars */
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps button{border:0;border-radius:99px;padding:6px 14px;background:var(--soft);color:var(--muted);font-weight:700}
.steps button.on{background:var(--acc);color:var(--acc-fg)}
.lrow{display:flex;align-items:center;gap:10px;padding:9px 4px;border-top:1px solid var(--soft);flex-wrap:wrap}
.lrow .n{width:24px;color:var(--muted)}
.lrow .who{flex:1 1 180px;font-weight:700}
.lrow .who.dim{color:var(--muted);font-weight:500}
.tg{min-height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--base);font-weight:600}
.gb{width:36px;height:34px;border-radius:7px;border:1px solid var(--line);background:var(--base);font-weight:700;padding:0}
.gb:disabled{opacity:.35}
@media (max-width:820px){.tg{padding:0 8px;font-size:13px}.gb{width:30px}}
.foot{position:sticky;bottom:0;background:var(--win);padding:12px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:10px}
@media (max-width:820px){.foot{bottom:60px}}
/* sozlamalar */
.set{display:grid;grid-template-columns:250px 1fr;gap:18px;align-items:start}
@media (max-width:820px){.set{grid-template-columns:1fr}}
.secs{display:flex;flex-direction:column;gap:3px;padding:8px}
@media (max-width:820px){.secs{flex-direction:row;overflow-x:auto}}
.secs button{border:0;background:transparent;text-align:left;padding:10px 14px;border-radius:10px;font-weight:600;white-space:nowrap}
.secs button.on{background:var(--soft)}
.srow{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:14px 0;border-top:1px solid var(--soft);flex-wrap:wrap}
.srow>div:first-child{flex:1 1 260px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{min-width:46px;min-height:38px;border-radius:9px;border:1px solid var(--line);background:var(--base);font-weight:700}
.days button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-fg)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:820px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--alt);border-radius:12px;padding:12px 14px}.tile div:last-child{font-size:22px;font-weight:800}
table.r{border-collapse:collapse;width:100%;font-size:14px}
table.r th,table.r td{padding:8px 8px;border-bottom:1px solid var(--soft);text-align:left}
table.r th{color:var(--muted);font-weight:700}
table.r td.n{text-align:center}
.pill{display:inline-block;min-width:44px;text-align:center;border-radius:7px;padding:2px 6px;font-weight:800}
/* oyna */
.modal{position:fixed;inset:0;background:rgba(10,25,30,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal .card{width:min(560px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--base);padding:10px 18px;border-radius:10px;z-index:60;font-weight:600;max-width:90vw}
@media (max-width:820px){.toast{bottom:80px}}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--base);border-radius:var(--r);padding:14px 16px}
.opt:hover{border-color:var(--acc)}
.opt b{display:block;font-size:16px}
.hide{display:none!important}
/* summativ */
table.sum th{white-space:nowrap;padding:4px 3px}
table.sum th small{display:block;font-size:11px;font-weight:600}
@media (max-width:820px){.seg{max-width:100%;overflow-x:auto}}
table.sum th.wk{padding:0}
.wbtn{border:0;border-radius:8px;padding:4px 6px;font-weight:800;min-width:56px;line-height:1.15;background:#e3f0fb;color:#0d47a1}
.wbtn.chsb{background:#f1e6f8;color:#6a1b9a}
.wbtn small{display:block;font-weight:600;font-size:11px}
input.sc{width:58px;min-height:36px;height:36px;padding:0 4px;text-align:center;font-weight:700;background:var(--alt);border-radius:7px;border:1px solid transparent}
input.sc.ab{color:var(--danger)}
input.sc.lt{width:76px;color:#6d4c41;background:#efe3dc}
input.sc.bad{border-color:var(--danger);background:#fde8e6}
select.g5{width:62px;min-height:34px;padding:0 4px}
.warnbox{border-color:#f0b4ae;background:#fff4f2;color:#8a1c12}
:root[data-theme="dark"] .warnbox{background:#3a2020;color:#ffb4a8}
.key.on2{background:var(--acc);color:var(--acc-fg)}
table.j td.nm[data-st]{cursor:pointer}
.nmlink{padding:0;text-align:left;color:var(--text)}
/* kartochka */
.modal .card.wide{width:min(760px,100%)}
.seg.tabs{flex-wrap:wrap}

const IDB = {db: null, ok: false, ready: false, pend: null, timer: null};

    await idbReq("snap", "readwrite", (st) => st.put({at: new Date().toISOString(), txt}, day));
    const keys = (await idbReq("snap", "readonly", (st) => st.getAllKeys())) || [];
    const old = keys.sort().slice(0, Math.max(0, keys.length - SNAP_DAYS));
    if (old.length) await idbReq("snap", "readwrite", (st) => old.forEach((k) => st.delete(k)));

function quarterOf(s) { for (let q = 1; q <= 4; q++) { const r = qRange(q); if (r && r[0] <= s && s <= r[1]) return q; } return null; }

/* ───────── davr (Kun / Hafta / Oy / Chorak) ───────── */
const V = {mode: "month", anchor: todayIso()};

/* ───────── hisob-kitob ───────── */

function reportRows(c, lo, hi, q = null) {
  const t = todayIso(), rk = D.settings.risk, on = rk.on;
  const dates = c.dates.filter((d) => lo <= d && d <= hi && d <= t && !isNoLesson(c, d));
  const lessons = dates.length, hasQ = !!(q && qRange(q)), works = hasQ ? worksInQuarter(c, q) : [];
  const bsbTaken = c.works.some((w) => w.type === "bsb" && lo <= w.date && w.date <= (hi < t ? hi : t));
  const rows = c.students.map((s) => {
    const vals = dates.filter((d) => s.marks[d]).map((d) => s.marks[d]);
    const gr = vals.flatMap(gradesOf);

    for (const v of vals) { if (lateOf(v)) cnt.kq++; else if (cnt[v] !== undefined) cnt[v]++; }
    const absent = cnt.s + cnt.dq + cnt.k, nch = vals.filter((v) => v === "ch").length, own = lessons - nch;

    const avg = gr.length ? +pyFixed(gr.reduce((a, b) => a + b, 0) / gr.length, 2) : null;
    const qr = hasQ ? quarterResult(c, s, q, works) : null;

    if (few) why.push(`shu kungacha ${gr.length} ta baho (< ${rk.few_lt ?? 4})`);
    if (!few && on.min_n && rk.min_n && lessons && bsbTaken && gr.length < rk.min_n) why.push(`baholar soni ${gr.length} < ${rk.min_n}`);
    if (on.att && att !== null && att < rk.att_below) why.push(`davomat ${pyFixed(att, 0)}% < ${rk.att_below}%`);
    if (on.s && cnt.s >= rk.s_ge) why.push(`sababsiz ${cnt.s} ta`);

      if (a1 - a2 >= +(rk.drop_ge ?? 1.5)) why.push(`baholar pasaymoqda (${pyFixed(a1, 1)} → ${pyFixed(a2, 1)})`);
    }

      const v = (s.scores || {})[w.id];

}

function snapCols() {

/* ───────── o'quvchini faolsizlantirish: jurnal, hisobot va hisob-kitoblardan yashiriladi, ma'lumoti saqlanadi ─────────
   Faolsizlar c.students_off da turadi (kompyuter dasturi bu kalitni bilmaydi, shuning uchun u yerda ham ko'rinmaydi). */
const nMarks = (s) => Object.keys(s.marks).length + Object.keys(s.scores || {}).length;
const offLog = (c, s, kind) => (D.changelog = D.changelog || []).push({t: new Date().toISOString().slice(0, 19), cls: label(c), student: s.name, date: "", old: kind === "off" ? "faol" : "faolsiz", new: kind === "off" ? "faolsiz" : "faol", kind: kind === "off" ? "deactivate" : "activate"});
function deactivate(c, idx) {
  const items = idx.slice().sort((a, b) => a - b).map((i) => [i, c.students[i]]);
  for (const [i, st] of items) { st.off = {at: todayIso(), prev: i ? c.students[i - 1].name : null}; c.students_off.push(st); offLog(c, st, "off"); }
  c.students = c.students.filter((_, i) => !idx.includes(i));
  pushUndo([{kind: "off", c, items: items.map(([, st]) => st)}]); S.sel = null; save();
}
function activate(c, list) {
  for (const st of list) {
    c.students_off = c.students_off.filter((x) => x !== st);
    // o'z joyiga: faolsizlantirilgandagi oldingi qo'shnisidan keyin (u ham faolsiz bo'lsa — uning qo'shnisidan)
    let prev = st.off ? st.off.prev : undefined, pos = c.students.length;
    for (let guard = 0; prev !== undefined && guard < 1000; guard++) {
      if (prev === null) { pos = 0; break; }
      const k = c.students.findIndex((x) => x.name === prev); if (k >= 0) { pos = k + 1; break; }
      const o = c.students_off.find((x) => x.name === prev); prev = o && o.off ? o.off.prev : undefined;
    }
    delete st.off; c.students.splice(pos, 0, st); offLog(c, st, "on");
  }
  S.sel = null; save();
}

const UNDO = [];
function pushUndo(batch) { if (batch.length) { UNDO.push(batch); if (UNDO.length > 100) UNDO.shift(); } }
async function undoLast() {
  const batch = UNDO.pop(); if (!batch) { toast("Bekor qilinadigan o'zgarish yo'q"); return; }
  if (batch[0].kind === "off") {
    const {c, items} = batch[0], back = items.filter((st) => c.students_off.includes(st));
    if (!D.classes.includes(c) || !back.length) { toast("Bu o'quvchilar allaqachon faol"); return; }
    activate(c, back); render(); toast(`${back.length} ta o'quvchi qayta faollashtirildi`); return;
  }
  const live = batch.filter((u) => D.classes.includes(u.c) && u.c.students.includes(u.s) &&
    ((u.kind === "mark" ? u.s.marks[u.key] : (u.s.scores || {})[u.key]) ?? "") === u.nw);
  if (!live.length) { toast("Bu o'zgarish keyin yana o'zgargan — bekor qilinmadi"); return; }
  const prot = live.some((u) => { if (u.old === "") return false; if (u.kind !== "mark") return true; return !isAdditive(u.old, u.nw); });
  if (prot && isLocked() && !await unlock()) { UNDO.push(batch); return; }
  for (const u of live) {
    const b = u.kind === "mark" ? u.s.marks : (u.s.scores = u.s.scores || {});
    if (u.old === "") delete b[u.key]; else b[u.key] = u.old;
    if (u.nw !== "" && u.old !== "") (u.kind === "mark" ? log(u.c, u.s, u.key, u.nw, u.old) : logScore(u.c, u.s, u.key, u.nw, u.old));
  }
  save(); render(); toast(`Bekor qilindi: ${live.length} ta katak`);
}

  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !$(".modal") && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); undoLast(); }

function logScore(c, s, key, old, nw) {

    $("[data-file]", mm).onclick = () => { const f = document.createElement("input"); f.type = "file"; f.accept = ".txt,text/plain"; f.onchange = async () => { if (f.files[0]) { ta.value = await f.files[0].text(); upd(); } }; f.click(); };
    $("[data-x]", mm).onclick = () => close();
    $("[data-ok]", mm).onclick = () => {

      if (c.plan.on && c.plan.topics.length) { const r = reflowPlan(c); msg = `Reja: ${r.assigned} ta mavzu dars kunlariga qo'yildi${r.left.length ? `, ${r.left.length} tasiga kun yetmadi` : ""}`; }
      else for (const [d, les] of Object.entries(c.lessons)) if (les.auto) { if (les.hw) c.lessons[d] = {topic: "", hw: les.hw}; else delete c.lessons[d]; }

    };
  });
}

/* ───────── BSB tahlili: savollar bo'yicha ballar (kompyuter dasturidagi bsb_stats / bsb_recommendations bilan bir xil) ───────── */
const gnum = (v) => String(+(+v).toPrecision(6));
const sumOf = (a) => a.reduce((x, y) => x + y, 0);
function bsbStats(qmax, rows) {
  const nq = qmax.length, totMax = sumOf(qmax.map(Number)), stu = [];
  for (const r of rows) {
    if (!r.in) continue;
    const raw = (r.pts || []).slice(0, nq); while (raw.length < nq) raw.push(null);
    const pts = raw.map((p, i) => Math.min(Math.max(+(p || 0), 0), +qmax[i])), total = sumOf(pts), pct = totMax ? 100 * total / totMax : 0;
    stu.push({name: r.name, pts, total, pct, grade: grade5(pct), empty: raw.filter((p) => p === null || p === undefined).length});
  }
  const absent = rows.filter((r) => !r.in).map((r) => r.name), n = stu.length;
  const out = {n, absent, qmax: qmax.slice(), tot_max: totMax, students: stu, questions: [], grades: {5: 0, 4: 0, 3: 0, 2: 0}};
  if (!n || !totMax) return out;
  const pcts = stu.map((s) => s.pct).sort((a, b) => a - b), mid = Math.floor(n / 2);
  Object.assign(out, {mean_total: sumOf(stu.map((s) => s.total)) / n, mean_pct: sumOf(pcts) / n, median_pct: n % 2 ? pcts[mid] : (pcts[mid - 1] + pcts[mid]) / 2,
    best: stu.reduce((a, s) => s.total > a.total ? s : a), worst: stu.reduce((a, s) => s.total < a.total ? s : a), empty_cells: sumOf(stu.map((s) => s.empty))});
  for (const s of stu) out.grades[s.grade]++;
  const g = out.grades;
  out.quality = 100 * (g[5] + g[4]) / n;          // bilim sifati: «4» va «5» olganlar ulushi
  out.mastery = 100 * (n - g[2]) / n;             // o'zlashtirish: «2» dan yuqori olganlar ulushi
  const ranked = stu.slice().sort((a, b) => b.total - a.total), k = Math.max(1, +pyFixed(0.27 * n, 0));
  for (let i = 0; i < nq; i++) {
    const mx = +qmax[i] || 1, vals = stu.map((s) => s.pts[i]), mean = sumOf(vals) / n, pct = 100 * mean / mx;
    // ajratish indeksi: kuchli va kuchsiz 27% farqi
    const d = n >= 6 ? (sumOf(ranked.slice(0, k).map((s) => s.pts[i])) - sumOf(ranked.slice(-k).map((s) => s.pts[i]))) / k / mx : null;
    out.questions.push({i: i + 1, max: qmax[i], mean, pct, full: vals.filter((v) => v >= mx).length, zero: vals.filter((v) => v <= 0).length, d,
      level: pct < 40 ? "qiyin" : pct < 70 ? "o'rtacha" : "oson"});
  }
  return out;
}
function bsbNames(items, limit = 6) {
  items = [...items]; const t = items.slice(0, limit).join(", ");
  return t + (items.length > limit ? ` va yana ${items.length - limit} ta` : "");
}
function bsbRecs(an) {
  const good = [], bad = [], tips = [], n = an.n, f0 = (x) => pyFixed(x, 0);
  if (!n || !an.questions.length) return {good, bad: ["Tahlil uchun ishtirok etgan o'quvchilar va ballar kerak."], tips};
  const g = an.grades, qs = an.questions, stu = an.students, qp = (q) => `${q.i}-savol (${f0(q.pct)}%)`;
  // — yutuqlar —
  if (an.quality >= 60) good.push(`Bilim sifati yuqori: ${f0(an.quality)}% o'quvchi «4» va «5» baho olgan.`);
  if (g[5]) good.push(`«5» baho olganlar: ${g[5]} ta (${bsbNames(stu.filter((s) => s.grade === 5).map((s) => s.name))}).`);
  const easy = qs.filter((q) => q.pct >= 75);
  if (easy.length) good.push("Yaxshi o'zlashtirilgan savollar: " + easy.map(qp).join(", ") + " — bu mavzular bo'yicha bilim mustahkam.");
  if (an.mastery === 100) good.push("Ishtirok etgan barcha o'quvchi «3» dan past bo'lmagan baho olgan.");
  if (an.mean_pct >= 66 && !good.length) good.push(`O'rtacha natija yaxshi: ${f0(an.mean_pct)}%.`);
  if (!good.length) good.push("Sezilarli yutuqlar aniqlanmadi — quyidagi tavsiyalarga e'tibor bering.");
  // — kamchiliklar —
  const hard = qs.filter((q) => q.pct < 50).sort((a, b) => a.pct - b.pct);
  if (hard.length) bad.push("O'zlashtirishi past savollar: " + hard.map(qp).join(", ") + ".");
  const skipped = qs.filter((q) => q.zero >= Math.max(2, 0.3 * n));
  if (skipped.length) bad.push("Ko'pchilik 0 ball olgan savollar: " + skipped.map((q) => `${q.i}-savol (${q.zero} ta)`).join(", ") + " — mavzu o'tilmagan, shart tushunarsiz yoki vaqt yetmagan bo'lishi mumkin.");
  const weakD = qs.filter((q) => q.d !== null && q.d < 0.2 && q.pct < 90);
  if (weakD.length) bad.push("Kuchli va kuchsiz o'quvchilarni yaxshi ajratmagan savollar: " + weakD.map((q) => `${q.i}-savol`).join(", ") + " — savol shakli yoki murakkabligini ko'rib chiqing.");
  if (qs.length >= 6) {
    const t = Math.floor(qs.length / 3), first = sumOf(qs.slice(0, t).map((q) => q.pct)) / t, last = sumOf(qs.slice(-t).map((q) => q.pct)) / t;
    if (first - last >= 25) bad.push(`Oxirgi savollar (${f0(last)}%) boshidagilardan (${f0(first)}%) ancha past — vaqt yetmagan yoki murakkab topshiriqlar qiyinlik tug'dirgan bo'lishi mumkin.`);
  }
  if (g[2]) bad.push(`«2» baho olganlar: ${g[2]} ta (${f0(100 * g[2] / n)}%): ${bsbNames(stu.filter((s) => s.grade === 2).map((s) => s.name))}.`);
  if (an.quality < 40) bad.push(`Bilim sifati past: faqat ${f0(an.quality)}% o'quvchi «4» va «5» baho olgan.`);
  if (an.absent.length) bad.push(`Ishtirok etmaganlar: ${an.absent.length} ta (${bsbNames(an.absent)}).`);
  if (an.empty_cells) bad.push(`${an.empty_cells} ta katak to'ldirilmagan — hisobda 0 ball deb olindi.`);
  if (!bad.length) bad.push("Jiddiy kamchiliklar aniqlanmadi.");
  // — tavsiyalar —
  for (const q of hard.slice(0, 4)) tips.push(`${q.i}-savol (${f0(q.pct)}%): ${q.pct < 35 ? "mavzuni qayta tushuntiring, o'xshash misollarni sinfda birgalikda yeching" : "xatolarni tahlil qiling va qo'shimcha mashqlar bering"}.`);
  const low = stu.filter((s) => s.grade === 2).map((s) => s.name);
  if (low.length) tips.push(`${bsbNames(low)} bilan yakka tartibda ishlang: asosiy tushunchalarni takrorlash va qo'shimcha dars.`);
  const near = [];
  for (const s of stu) for (const [thr, gr] of [[30, 3], [66, 4], [86, 5]]) if (s.pct < thr) {
    const need = Math.ceil(thr * an.tot_max / 100 - s.total - 1e-9);
    if (need > 0 && need <= Math.max(2, 0.06 * an.tot_max)) near.push(`${s.name} (${gnum(need)} ball → «${gr}»)`);
    break;
  }
  if (near.length) tips.push("Yuqori bahoga yaqin o'quvchilar — qisqa takrorlash bilan natijani oshirish mumkin: " + bsbNames(near) + ".");
  const top = stu.filter((s) => s.grade === 5).map((s) => s.name);
  if (top.length >= 2) tips.push(`${bsbNames(top, 4)} — qiyinroq (olimpiada, qo'shimcha) topshiriqlar bering yoki yordamchi sifatida jalb qiling.`);
  if (an.absent.length) tips.push("Ishtirok etmaganlarga BSB ni qayta topshirish imkonini bering (kasallik va boshqa sabablarni aniqlang).");
  if (an.quality < 40 || hard.length > qs.length / 2) tips.push("Bo'lim bo'yicha umumiy takrorlash darsi o'tkazing, so'ng qisqa nazorat (formativ) ishi bilan natijani tekshiring.");
  else if (an.quality >= 70 && !hard.length) tips.push("Natija yaxshi — keyingi bo'limga o'tishingiz mumkin; qiyin topshiriqlar ulushini oshirib ko'ring.");
  if (!tips.length) tips.push("Joriy yondashuvni davom ettiring; keyingi BSB da natijalarni shu tahlil bilan solishtiring.");
  return {good, bad, tips};
}

/* tahlil ma'lumoti — 1-versiya bilan bir xil: c.analyses = [{id, title, date, q, max[], rows: {ism: {in, pts[]}}}] */
const BA_COL = {5: "#66bb6a", 4: "#c5e1a5", 3: "#fff59d", 2: "#ef9a9a"}, LV_COL = {qiyin: "#ef9a9a", "o'rtacha": "#fff59d", oson: "#c5e1a5"};
function baBlank() { return {ci: S.ci, id: null, title: "", date: todayIso(), q: 5, max: [2, 2, 2, 2, 2], rows: {}, dirty: false}; }
function baFrom(a) { return {ci: S.ci, id: a.id, title: a.title || "", date: a.date, q: a.q, max: a.max.slice(), rows: clone(a.rows || {}), dirty: false}; }
function baCur() {               // har sinf uchun joriy (saqlanmagan bo'lishi mumkin) tahlil xotirada turadi
  const c = D.classes[S.ci], key = label(c); S.bas = S.bas || {};
  if (!S.bas[key]) { const last = c.analyses.slice().sort((a, b) => a.date < b.date ? -1 : 1).pop(); S.bas[key] = last ? baFrom(last) : baBlank(); }
  return S.bas[key];
}
const baRow = (B, name) => B.rows[name] || {in: true, pts: []};
function baAnalysis(c, B) {
  const rows = c.students.map((s) => ({name: s.name, ...baRow(B, s.name)}));
  return bsbStats(B.max, rows);
}
const baMeta = (c, B) => ({label: label(c), cls: c.name, subject: c.subject || "", title: B.title, date: fmt(B.date)});
async function baAskDiscard(B) {
  if (!B.dirty) return "discard";
  return modal(`<h2>Saqlanmagan o'zgarishlar</h2><div class="muted">Joriy BSB tahlilida saqlanmagan o'zgarishlar bor. Davom etsangiz, ular yo'qoladi.</div>
    <div class="row"><span class="sp"></span><button class="btn" data-x>Bekor qilish</button><button class="btn" data-d>Saqlamasdan</button><button class="btn pri" data-s>💾 Saqlash</button></div>`, (mm, close) => {
    $("[data-x]", mm).onclick = () => close(null); $("[data-d]", mm).onclick = () => close("discard"); $("[data-s]", mm).onclick = () => close("save");
  });
}
function baSave(c, B, quiet) {
  if (!B.max.every((v) => v > 0)) { toast("Hamma savol uchun maksimal ball (0 dan katta) kiriting"); return false; }
  const rows = {}; c.students.forEach((s) => { const r = baRow(B, s.name); rows[s.name] = {in: r.in !== false, pts: Array.from({length: B.q}, (_, i) => r.pts[i] ?? null)}; });
  const a = {id: B.id, title: B.title.trim(), date: B.date, q: B.q, max: B.max.slice(), rows};
  if (!B.id) { const ids = c.analyses.map((x) => String(x.id)).filter((x) => /^a\d+$/.test(x)).map((x) => +x.slice(1)); a.id = B.id = "a" + (Math.max(0, ...ids) + 1); c.analyses.push(a); }
  else { const i = c.analyses.findIndex((x) => x.id === B.id); if (i >= 0) c.analyses[i] = a; else c.analyses.push(a); }
  B.dirty = false; save(); if (!quiet) toast("BSB tahlili saqlandi"); return true;
}
const numIn = (t) => { t = String(t).trim().replace(",", "."); if (t === "") return null; const v = Number(t); return isFinite(v) ? Math.round(v * 100) / 100 : NaN; };

function pageBsb(m) {

      <tr class="mx"><td></td><td class="nm"><b>Maksimal ball</b></td>${B.max.map((v, i) => `<td class="c"><input class="sc" data-bx="${i}" value="${gnum(v)}" inputmode="decimal" autocomplete="off"></td>`).join("")}<td class="s">${gnum(tot)}</td><td class="s">100</td><td></td></tr>`;

    <div class="row" style="gap:8px"><div class="seg"><button class="${tab === "tbl" ? "on" : ""}" data-btab="tbl">✎ Ballar jadvali</button><button class="${tab === "an" ? "on" : ""}" data-btab="an">🔍 Tahlil</button></div>

    ${body}</div>`;

const pct0 = (x) => pyFixed(x, 0) + "%";
const bg = (col) => col ? ` style="background:${col}"` : "";
function bsbChart(qs) {
  const w = 700, h = 170, l = 30, b = 22, t = 14, pw = w - l - 6, ph = h - t - b, n = Math.max(1, qs.length), slot = pw / n, bw = Math.max(6, Math.min(44, slot * 0.62));
  const grid = [0, 25, 50, 75, 100].map((v) => { const y = t + ph - ph * v / 100; return `<line x1="${l}" x2="${l + pw}" y1="${y}" y2="${y}" stroke="#ddd"/><text x="${l - 4}" y="${y + 3}" text-anchor="end">${v}</text>`; }).join("");
  const bars = qs.map((q, i) => { const x = l + slot * i + (slot - bw) / 2, bh = ph * Math.min(q.pct, 100) / 100, y = t + ph - bh;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" fill="${LV_COL[q.level]}" stroke="#888" stroke-width=".5"/><text x="${x + bw / 2}" y="${y - 3}" text-anchor="middle">${pyFixed(q.pct, 0)}%</text><text x="${l + slot * i + slot / 2}" y="${h - 6}" text-anchor="middle">${q.i}</text>`; }).join("");
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Savollar bo'yicha o'zlashtirish">${grid}${bars}<line x1="${l}" x2="${l}" y1="${t}" y2="${t + ph}" stroke="#888"/></svg>`;
}

async function baTransfer(c, B) {

  }

  render();
}

    if (confirm("Yo'qlama jurnali: «Sinflarim» sahifasi ochilsinmi? Ochilgach, tugmani yana bir bor bosing.")) location.href = "https://schools.emaktab.uz/v2/myclasses";

  const state = (html) => {
    const i = html.indexOf("__JOURNAL__INITIAL__STATE__"); if (i < 0) return null;
    const k = html.indexOf("{", i); let d = 0, q = false, esc = false;

      if (q) { if (esc) esc = false; else if (ch === "\\") esc = true; else if (ch === '"') q = false; }

    const doc = new DOMParser().parseFromString(await r0.text(), "text/html"), root = doc.getElementById("ContentPanelTeacher") || doc;
    const jobs = [], seen = new Set(); let cls = null;

    const files = [], errs = [];
    for (const [n, jb] of jobs.entries()) {
      say(`Jurnallar yuklanmoqda: ${n + 1} / ${jobs.length}\n${jb.cls} · ${jb.subject}`);
      try {
        const st = state(await (await get(jb.url)).text()), hd = st && st.journalHeader;
        if (!hd) throw new Error("chorak topilmadi");
        const [, school, group, subject] = jb.url.match(/\/school\/(\d+)\/group\/(\d+)\/subject\/(\d+)/);
        const x = await get(`/v2/excel?action=gjsxls&school=${school}&group=${group}&subgroup=0&subject=${subject}&period=${hd.currentPeriodId}`);
        if (/html/i.test(x.headers.get("content-type") || "")) throw new Error("Excel o'rniga sahifa keldi");
        files.push({name: `${jb.cls}_${jb.subject}.xls`, data: await x.arrayBuffer()});

    try { w.focus(); } catch (e) {}
  })().catch((e) => say("✗ " + e.message));
}

    for (const o of c.students) for (const g of gradesOf(o.marks[d] || "")) { cg += g; cn++; }
    run.push(sn ? sg / sn : null); crun.push(cn ? cg / cn : null);

// bugun kelmaganlar (S/DQ/K) chiqarib tashlanadi; joriy davrdagi baholar soni va o'rtachasi
function classPool(c) {
  const t = todayIso(), [lo, hi] = periodNow();
  return c.students.map((s, si) => {
    const gr = Object.entries(s.marks).filter(([d]) => lo <= d && d <= hi && !isNoLesson(c, d)).flatMap(([, m]) => gradesOf(m));
    return {s, si, n: gr.length, avg: gr.length ? gr.reduce((a, b) => a + b, 0) / gr.length : null, today: gradesOf(s.marks[t] || "").length > 0};
  }).filter((x) => !["s", "dq", "k"].includes(attPart(x.s.marks[t] || "")));
}
// «kam so'ralganlar ko'proq»: baholari kam bo'lgan o'quvchining og'irligi katta, bugun baho olgan kamdan-kam chiqadi
function pickWeights(pool, fair) {
  const mx = Math.max(0, ...pool.map((x) => x.n));
  return pool.map((x) => !fair ? 1 : (mx - x.n + 1) * (x.today ? 0.15 : 1));
}
function weightedPick(pool, w, rnd = Math.random) {
  const sum = w.reduce((a, b) => a + b, 0); let r = rnd() * sum;
  for (let i = 0; i < pool.length; i++) { r -= w[i]; if (r < 0) return pool[i]; }
  return pool[pool.length - 1];
}

// guruhlar: tasodifiy yoki teng kuchli (o'rtacha baho bo'yicha muvozanatlangan)
function makeGroups(pool, k, mode, rnd = Math.random) {
  const a = pool.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  const G = Array.from({length: k}, () => []);
  if (mode === "even") {
    // «ilon» usulida tarqatib, keyin guruhlar o'rtachasi yaqinlashguncha o'quvchilarni almashtiramiz
    const v = (x) => x.avg ?? 6, mean = (g) => g.reduce((t, x) => t + v(x), 0) / (g.length || 1);
    const spread = () => { const ms = G.map(mean), m = ms.reduce((t, x) => t + x, 0) / k; return ms.reduce((t, x) => t + (x - m) ** 2, 0); };
    a.sort((x, y) => v(y) - v(x));
    a.forEach((x, i) => { const r = Math.floor(i / k), p = i % k; G[r % 2 ? k - 1 - p : p].push(x); });
    for (let pass = 0, better = true; better && pass < 50; pass++) {
      better = false;
      for (let g1 = 0; g1 < k; g1++) for (let g2 = g1 + 1; g2 < k; g2++) for (let i1 = 0; i1 < G[g1].length; i1++) for (let i2 = 0; i2 < G[g2].length; i2++) {
        const before = spread(); [G[g1][i1], G[g2][i2]] = [G[g2][i2], G[g1][i1]];
        if (spread() < before - 1e-9) better = true; else [G[g1][i1], G[g2][i2]] = [G[g2][i2], G[g1][i1]];
      }
    }
  } else a.forEach((x, i) => G[i % k].push(x));
  return G;
}

}

// D.web.schedule = {bells: [["08:00","08:45"], …], days: [[jurnal kaliti | "" har soat uchun] × 6 kun (Du…Sh)]}
const SCH_DEF_BELLS = [["08:00", "08:45"], ["08:50", "09:35"], ["09:40", "10:25"], ["10:35", "11:20"], ["11:25", "12:10"], ["12:15", "13:00"]];
const ckey = (c) => `${c.name}|${c.subject}`;
function sched() { const s = D.web.schedule; return s && Array.isArray(s.days) && s.days.some((d) => d.some(Boolean)) ? s : null; }

// bugungi darslar soat tartibida: [{c, ci, no, from, to}]
function schedToday(t = todayIso()) {
  const s = sched(), wd = pyWd(t); if (!s || wd > 5) return [];
  return (s.days[wd] || []).map((k, no) => { const ci = D.classes.findIndex((c) => ckey(c) === k); return k && ci >= 0 ? {c: D.classes[ci], ci, no, from: (s.bells[no] || [])[0] || "", to: (s.bells[no] || [])[1] || ""} : null; }).filter(Boolean);
}
// jadvaldan har sinfning dars kunlarini olish; o'chgan kunlardagi bo'sh kelajak sanalar olib tashlanadi
function schedApplyWeekdays() {
  const s = sched(); if (!s) return 0; const q = quarterOf(todayIso()), t = todayIso(); let n = 0;
  for (const c of D.classes) {
    const wds = [0, 1, 2, 3, 4, 5].filter((d) => (s.days[d] || []).includes(ckey(c)));
    if (!wds.length || JSON.stringify(wds) === JSON.stringify((c.weekdays || []).slice().sort())) continue;
    c.weekdays = wds; n++;
    c.dates = c.dates.filter((d) => d < t || wds.includes(pyWd(d)) || hasMarks(c, d) || c.lessons[d] || c.works.some((w) => w.date === d));

const normCls = (x) => String(x || "").toUpperCase().replace(/[«»"'ʻʼ`‘’\s._-]/g, "");
// Excel jadvalni o'qish: kunlar ustunlarda (yoki qatorlarda), har katakda «6-A», «6-A Matematika» kabi yozuv
function parseSchedule(rows) {
  const DAYRX = [/^(du|dush|пн|пон)/i, /^(se|sesh|вт|вто)/i, /^(ch|chor|ср|сре)/i, /^(pa|pay|чт|чет)/i, /^(ju|jum|пт|пят)/i, /^(sh|shan|сб|суб)/i];
  const dayOf = (v) => { const t = String(v || "").trim(); if (t.length < 2) return -1; return DAYRX.findIndex((r) => r.test(t)); };
  rows = rows.map((r) => (r || []).map((v) => v == null ? "" : String(v).trim()));
  let grid = rows, hr = grid.findIndex((r) => r.filter((v) => dayOf(v) >= 0).length >= 3);
  if (hr < 0) { // kunlar birinchi ustunlarda bo'lsa — jadvalni ag'darib qo'yamiz
    const w = Math.max(0, ...rows.map((r) => r.length));
    grid = Array.from({length: w}, (_, j) => rows.map((r) => r[j] || ""));
    hr = grid.findIndex((r) => r.filter((v) => dayOf(v) >= 0).length >= 3);
  }
  if (hr < 0) throw new Error("Jadvalda hafta kunlari (Dushanba, Seshanba …) topilmadi");
  const cols = grid[hr].map(dayOf), TRX = /(\d{1,2})[:.](\d{2})\s*[-–—]\s*(\d{1,2})[:.](\d{2})/;
  const byCls = new Map(); for (const c of D.classes) { const k = normCls(c.name); if (!byCls.has(k)) byCls.set(k, []); byCls.get(k).push(c); }
  const out = {bells: [], days: Array.from({length: 6}, () => [])}, miss = new Set();
  for (const r of grid.slice(hr + 1)) {
    if (r.join("").trim() === "") continue;
    const tm = r.map((v) => v.match(TRX)).find(Boolean);
    const no = out.bells.length; out.bells.push(tm ? [`${pad(+tm[1])}:${tm[2]}`, `${pad(+tm[3])}:${tm[4]}`] : (SCH_DEF_BELLS[no] || ["", ""]).slice());
    for (let d = 0; d < 6; d++) out.days[d][no] = "";
    r.forEach((v, j) => {
      const d = cols[j]; if (d < 0 || d > 5 || !v || v === "-" || v === "—") return;
      // «6 - A», «6-«A»», «6A» → «6A»; so'ng so'zlarga bo'lib sinf nomini qidiramiz
      const toks = new Set(v.toUpperCase().replace(/[«»"'ʻʼ`‘’]/g, "").replace(/(\d)\s*[-–.]?\s*([A-ZА-ЯЁ])(?![A-ZА-ЯЁ])/g, "$1$2").split(/[^0-9A-ZА-ЯЁ]+/));
      const hit = [...byCls.keys()].filter((k) => k && toks.has(k));
      const k = hit.sort((a, b) => b.length - a.length)[0];
      if (!k) { miss.add(v); return; }
      const list = byCls.get(k), low = v.toLowerCase();
      const c = list.find((x) => x.subject && low.includes(x.subject.toLowerCase().slice(0, 4))) || list[0];
      out.days[d][no] = ckey(c);
    });
  }
  while (out.bells.length && out.days.every((d) => !d[out.bells.length - 1])) { out.bells.pop(); out.days.forEach((d) => d.pop()); }
  return {schedule: out, missing: [...miss]};
}
async function scheduleTemplate() {
  const X = await loadXlsx(), s = sched() || schedEmpty();
  const lbl = (k) => { const c = D.classes.find((x) => ckey(x) === k); return c ? label(c).replace(" · ", " ") : ""; };
  const aoa = [["Soat", "Vaqt", ...WD_FULL.slice(0, 6)], ...s.bells.map((b, i) => [i + 1, b[0] ? `${b[0]}-${b[1]}` : "", ...s.days.map((d) => lbl(d[i]))])];
  if (!sched()) aoa[1][2] = D.classes[0] ? label(D.classes[0]).replace(" · ", " ") : "6-A Matematika";
  const ws = X.utils.aoa_to_sheet(aoa); ws["!cols"] = [{wch: 6}, {wch: 13}, ...WD_FULL.slice(0, 6).map(() => ({wch: 18}))];
  const wb = X.utils.book_new(); X.utils.book_append_sheet(wb, ws, "Dars jadvali"); X.writeFile(wb, "dars_jadvali.xlsx");
}
function scheduleImport() {
  const f = document.createElement("input"); f.type = "file"; f.accept = ".xls,.xlsx,.csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
  f.onchange = async () => {
    const file = f.files[0]; if (!file) return;
    try {
      const X = await loadXlsx(), wb = X.read(await file.arrayBuffer(), {type: "array"});
      let res = null, err = null;
      for (const n of wb.SheetNames) { try { res = parseSchedule(X.utils.sheet_to_json(wb.Sheets[n], {header: 1, raw: false, defval: ""})); if (res.schedule.days.some((d) => d.some(Boolean))) break; } catch (e) { err = e; } }
      if (!res || !res.schedule.days.some((d) => d.some(Boolean))) throw err || new Error("Jadvalda sizning sinflaringiz topilmadi");
      scheduleEditor(res.schedule, res.missing);
    } catch (e) { toast("Jadvalni o'qib bo'lmadi: " + e.message); }
  };
  f.click();
}
function scheduleEditor(init, missing = []) {
  const s = clone(init || sched() || schedEmpty());
  const opts = (k) => `<option value="">—</option>${D.classes.map((c) => `<option value="${esc(ckey(c))}" ${ckey(c) === k ? "selected" : ""}>${esc(label(c))}</option>`).join("")}`;
  const draw = () => `<div class="tblwrap"><table class="j sch"><tr><th>Soat</th>${WD.slice(0, 6).map((w) => `<th>${w}</th>`).join("")}</tr>
    ${s.bells.map((b, i) => `<tr><td class="bl"><b>${i + 1}</b><input type="text" inputmode="numeric" data-bf="${i}" value="${b[0] ? `${b[0]}-${b[1]}` : ""}" placeholder="08:00-08:45" aria-label="${i + 1}-soat vaqti"></td>
      ${s.days.map((d, k) => `<td><select data-sd="${k}|${i}">${opts(d[i])}</select></td>`).join("")}</tr>`).join("")}</table></div>`;
  return modal(`<h2>📅 Dars jadvali</h2><div class="muted">Har bir soat va kun uchun sinfni tanlang. Saqlaganda sinflarning dars kunlari shu jadvaldan olinadi, «Bugun» sahifasi darslarni soat tartibida ko'rsatadi.</div>
    ${missing.length ? `<div class="card hot" style="padding:10px 12px">Jurnalda topilmagan yozuvlar (e'tiborsiz qoldirildi): ${missing.slice(0, 12).map(esc).join(", ")}${missing.length > 12 ? " …" : ""}</div>` : ""}
    <div id="schg">${draw()}</div>
    <div class="row wrap" style="gap:8px"><button class="btn sm" data-add>＋ Soat</button><button class="btn sm" data-del>− Soat</button><span class="sp"></span>
      <button class="btn" data-x>Bekor qilish</button><button class="btn pri" data-ok>Saqlash</button></div>`, (m, close) => {
    const bind = () => {
      m.querySelectorAll("[data-sd]").forEach((x) => x.onchange = () => { const [k, i] = x.dataset.sd.split("|").map(Number); s.days[k][i] = x.value; });
      m.querySelectorAll("[data-bf]").forEach((x) => x.onchange = () => {
        const t = x.value.match(/(\d{1,2})[:.](\d{2})\s*[-–—]\s*(\d{1,2})[:.](\d{2})/);
        if (!t && x.value.trim()) { toast("Vaqtni 08:00-08:45 ko'rinishida yozing"); return; }
        s.bells[+x.dataset.bf] = t ? [`${pad(+t[1])}:${t[2]}`, `${pad(+t[3])}:${t[4]}`] : ["", ""];
      });
    };
    const redraw = () => { $("#schg", m).innerHTML = draw(); bind(); }; bind();
    $("[data-add]", m).onclick = () => { s.bells.push(SCH_DEF_BELLS[s.bells.length] ? SCH_DEF_BELLS[s.bells.length].slice() : ["", ""]); s.days.forEach((d) => d.push("")); redraw(); };
    $("[data-del]", m).onclick = () => { if (s.bells.length > 1) { s.bells.pop(); s.days.forEach((d) => d.pop()); redraw(); } };
    $("[data-x]", m).onclick = () => close(false);
    $("[data-ok]", m).onclick = () => {
      D.web.schedule = s; const n = schedApplyWeekdays(); save(); remSchedule(); close(true); render();
      toast(`Dars jadvali saqlandi${n ? ` · ${n} ta sinfning dars kunlari yangilandi` : ""}`);
    };
  });
}

/* ───────── dars eslatmasi: jadval bo'yicha darsdan N daqiqa oldin bildirishnoma ───────── */
// D.web.remind = {on, min}; ilova ochiq (yoki fonda) turganda ishlaydi — server yo'q
const remCfg = () => Object.assign({on: false, min: 5}, D.web.remind || {});
const REM = {timers: [], fired: new Set()};
function remPlan(now = new Date()) {
  const t = iso(now), {min} = remCfg(), out = [];
  for (const x of schedToday(t)) {
    if (!x.from) continue;
    const [hh, mm] = x.from.split(":").map(Number), start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh, mm);
    if (isNoLesson(x.c, t) || start <= now) continue;
    const prev = x.c.dates.filter((d) => d < t && !isNoLesson(x.c, d)).pop(), hw = prev && (x.c.lessons[prev] || {}).hw;
    const topic = (x.c.lessons[t] || {}).topic;
    out.push({key: `${t}|${x.no}`, at: new Date(start - min * 6e4), ci: x.ci, title: `${x.no + 1}-soat · ${x.from} — ${label(x.c)}`,
      body: [topic ? `Mavzu: ${topic}` : "", hw ? `Uyga berilgan edi: ${hw}` : "", `${x.c.students.length} o'quvchi`].filter(Boolean).join("\n")});
  }
  return out;
}
async function remShow(p) {
  if (REM.fired.has(p.key)) return; REM.fired.add(p.key);
  toast(`🔔 ${p.title}`);
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  const opt = {body: p.body, tag: "dars-" + p.key, icon: "icon-192.png", badge: "icon-192.png", data: {ci: p.ci}};
  try { const r = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(); if (r) return await r.showNotification(p.title, opt); } catch (e) { /* oddiy bildirishnomaga o'tamiz */ }
  try { const n = new Notification(p.title, opt); n.onclick = () => { window.focus(); n.close(); }; } catch (e) { /* telefon brauzeri faqat SW orqali ruxsat beradi */ }
}
function remSchedule() {
  REM.timers.forEach(clearTimeout); REM.timers = [];
  if (!remCfg().on) return;
  const now = new Date();
  for (const p of remPlan(now)) {
    const ms = p.at - now;
    if (ms <= 0) remShow(p);   // eslatma vaqti o'tgan, lekin dars hali boshlanmagan — darhol
    else if (ms < 864e5) REM.timers.push(setTimeout(() => remShow(p), ms));
  }
  // yarim tunda ertangi kun uchun qayta rejalashtirish
  const mid = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 1);
  REM.timers.push(setTimeout(remSchedule, mid - now));
}
async function remToggle() {
  const c = remCfg();
  if (!c.on) {
    if (!sched()) { toast("Avval dars jadvalini kiriting — eslatma jadvaldagi soatlarga qarab keladi"); return; }
    if ("Notification" in window && Notification.permission === "default") { try { await Notification.requestPermission(); } catch (e) { /* eski brauzer */ } }
    if (!("Notification" in window) || Notification.permission !== "granted") toast("Brauzer bildirishnomaga ruxsat bermadi — eslatma faqat ilova ichida chiqadi");
  }
  D.web.remind = Object.assign(c, {on: !c.on}); save(); remSchedule(); render();
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && D && D.web) remSchedule(); });

/* ───────── Telegram: avtomatik zaxira va qurilmalar orasida sinxronlash ───────── */
// O'qituvchining o'z boti: token faqat shu brauzerda saqlanadi (journal.json ga yozilmaydi).
// Zaxira botga fayl bo'lib boradi va qadab qo'yiladi; boshqa qurilma qadalgan faylni ko'rib, yangiroq bo'lsa yuklashni taklif qiladi.
const TG_KEY = "yoqlama_tg", TG_GAP = 2 * 36e5;
function tgCfg() { try { return JSON.parse(localStorage.getItem(TG_KEY)) || {}; } catch (e) { return {}; } }
function tgSet(p) { const c = Object.assign(tgCfg(), p); try { localStorage.setItem(TG_KEY, JSON.stringify(c)); } catch (e) {} return c; }
const tgOn = () => { const c = tgCfg(); return !!(c.token && c.chat); };
function tgDev() { let c = tgCfg(); if (!c.dev) c = tgSet({dev: Math.random().toString(36).slice(2, 8)}); return c.dev; }
const tgAge = () => { const l = tgCfg().last; return tgOn() && l ? Math.floor((Date.now() - Date.parse(l)) / 864e5) : null; };
const djb = (t) => { let x = 5381; for (let i = 0; i < t.length; i++) x = (x * 33 ^ t.charCodeAt(i)) >>> 0; return x.toString(36) + t.length; };
async function tgApi(method, params, token = tgCfg().token) {
  const fd = params instanceof FormData;
  const r = await fetch(`https://api.telegram.org/bot${token}/${method}`, {method: "POST", body: fd ? params : JSON.stringify(params || {}), headers: fd ? {} : {"Content-Type": "application/json"}});
  const j = await r.json().catch(() => ({}));
  if (!j.ok) throw new Error(j.description || `Telegram javob bermadi (${r.status})`);
  return j.result;
}
let TG_NEW = null, tgBusy = false; // TG_NEW — boshqa qurilmadan kelgan yangiroq zaxira (Bugun sahifasida taklif qilinadi)
async function tgBackup(force) {
  const c = tgCfg(); if (!c.token || !c.chat || tgBusy) return false;
  const json = JSON.stringify(D), hash = djbData();
  if (!force && c.hash === hash) return false;
  tgBusy = true;
  try {
    const now = new Date(), hm = `${pad(now.getHours())}:${pad(now.getMinutes())}`, fd = new FormData();
    fd.append("chat_id", c.chat);
    fd.append("document", new Blob([json], {type: "application/json"}), `journal_${iso(now)}_${hm.replace(":", "")}.json`);
    fd.append("caption", `📒 Yo'qlama jurnali zaxirasi\n${fmt(iso(now))} ${hm} · ${D.classes.length} ta sinf\nTiklash: ilovada «Sozlamalar → Ma'lumotlar → Telegram'dan yuklash» yoki faylni «Fayldan yuklash» orqali oching.\n#q${tgDev()}`);
    fd.append("disable_notification", "true");
    const msg = await tgApi("sendDocument", fd);
    try { await tgApi("pinChatMessage", {chat_id: c.chat, message_id: msg.message_id, disable_notification: true}); } catch (e) { /* qadash shart emas */ }
    tgSet({hash, last: now.toISOString(), seen: msg.message_id});
    return true;
  } finally { tgBusy = false; }
}
async function tgPinned() {
  const ch = await tgApi("getChat", {chat_id: tgCfg().chat}), pm = ch.pinned_message;
  return pm && pm.document ? pm : null;
}
// saqlash vaqti (web.saved) o'zgarishi «yangi ma'lumot» hisoblanmasin
function djbData() { const w = D.web.saved; delete D.web.saved; const h = djb(JSON.stringify(D)); if (w) D.web.saved = w; return h; }
async function tgPull(pm) {
  const f = await tgApi("getFile", {file_id: pm.document.file_id});
  const data = await (await fetch(`https://api.telegram.org/file/bot${tgCfg().token}/${f.file_path}`)).json();
  if (!data || !Array.isArray(data.classes)) throw new Error("bu jurnal fayli emas");
  if (tooNew(data)) throw new Error("zaxira ilovaning yangiroq versiyasida saqlangan — sahifani yangilang");
  D = migrate(normalize(data)); autoDates(); save(); TG_NEW = null;
  tgSet({seen: pm.message_id, hash: djbData(), last: new Date(pm.date * 1000).toISOString()});
}
// ilova ochilganda: avval boshqa qurilmada yangiroq zaxira bormi — bo'lsa, so'ramasdan ustidan yozmaymiz
async function tgAuto() {
  if (!tgOn() || navigator.onLine === false) return;
  try {
    const pm = await tgPinned(), dev = pm && ((pm.caption || "").match(/#q(\w+)/) || [])[1];
    if (pm && dev !== tgDev() && pm.message_id > (tgCfg().seen || 0)) { TG_NEW = pm; if (S.page === "today") render(); return; }
    await tgBackup(false);
  } catch (e) { console.warn("Telegram:", e.message); }
}
document.addEventListener("visibilitychange", () => {
  const l = tgCfg().last;
  if (document.visibilityState === "hidden" && tgOn() && !TG_NEW && (!l || Date.now() - Date.parse(l) > TG_GAP)) tgBackup(false).catch(() => {});
});
function tgSetup() {
  return modal(`<h2>Telegram'ga avtomatik zaxira</h2>
    <div class="muted">Ma'lumotlaringiz o'zingizning Telegram botingizga fayl bo'lib boradi: har gal ilovani ochganingizda (o'zgarish bo'lsa) va ilovadan chiqqaningizda (2 soatda bir martadan ko'p emas). Bot faqat sizniki — boshqa hech kim ko'rmaydi.</div>
    <ol class="col" style="gap:8px;padding-left:20px;margin:4px 0">
      <li>Telegram'da <a href="https://t.me/BotFather" target="_blank" rel="noopener"><b>@BotFather</b></a> ni oching, <b>/newbot</b> deb yozing, botga nom va «..._bot» bilan tugaydigan manzil bering.</li>
      <li>BotFather bergan <b>tokenni</b> (masalan, <code>123456789:AAH…</code>) nusxalab shu yerga qo'ying:</li></ol>
    <input type="text" id="tgt" placeholder="123456789:AAH..." autocomplete="off" spellcheck="false">
    <div id="tgs" class="col" style="gap:8px"></div>
    <div class="row"><span class="sp"></span><button class="btn" data-x>Bekor qilish</button><button class="btn pri" data-ok>Davom etish</button></div>`, (m, close) => {
    let step = 0, bot = null;
    const out = $("#tgs", m), ok = $("[data-ok]", m), tok = () => $("#tgt", m).value.trim();
    $("[data-x]", m).onclick = () => close(false);
    ok.onclick = async () => {
      ok.disabled = true;
      try {
        if (step === 0) {
          if (!/^\d+:[\w-]{20,}$/.test(tok())) throw new Error("Token noto'g'ri ko'rinishda");
          bot = await tgApi("getMe", {}, tok()); step = 1; ok.textContent = "Tekshirish";
          out.innerHTML = `<div>3. Endi botingizni oching va <b>«Start»</b> (yoki «Boshlash») tugmasini bosing:</div>
            <a class="btn" href="https://t.me/${esc(bot.username)}" target="_blank" rel="noopener">✈️ @${esc(bot.username)} ni ochish</a><div class="muted">So'ng shu yerga qaytib «Tekshirish»ni bosing.</div>`;
        } else {
          const ups = await tgApi("getUpdates", {}, tok());
          const u = ups.reverse().find((x) => x.message && x.message.chat && x.message.chat.type === "private");
          if (!u) throw new Error("Botga hali xabar kelmadi — botni ochib «Start» bosing, so'ng qayta tekshiring");
          tgSet({token: tok(), chat: u.message.chat.id, bot: bot.username, hash: "", seen: 0});
          await tgApi("sendMessage", {chat_id: u.message.chat.id, text: "✅ Yo'qlama jurnali ulandi. Zaxira nusxalar shu yerga keladi, oxirgisi doim tepada qadalgan turadi."});
          TG_NEW = null; await tgAuto(); close(true);
        }
      } catch (e) { toast(e.message === "Failed to fetch" ? "Telegram'ga ulanib bo'lmadi — internetni tekshiring" : e.message); }
      ok.disabled = false;
    };
  });
}
async function tgAction(a) {
  try {
    if (a === "tgon") { if (await tgSetup()) { render(); toast(TG_NEW ? "Ulandi. Botda boshqa qurilmadan zaxira bor — «Bugun» sahifasiga qarang" : "Ulandi va birinchi zaxira yuborildi"); } }
    else if (a === "tgsend") { toast("Yuborilmoqda…"); await tgBackup(true); TG_NEW = null; render(); toast("Zaxira Telegram'ga yuborildi"); }
    else if (a === "tgload" || a === "tgnew") {
      const pm = a === "tgnew" ? TG_NEW : await tgPinned();
      if (!pm) { toast("Botda qadalgan zaxira topilmadi"); return; }
      const when = new Date(pm.date * 1000);
      if (!await confirmBox("Telegram'dan yuklash", `${fmt(iso(when))} ${pad(when.getHours())}:${pad(when.getMinutes())} dagi zaxira yuklanadi.\nShu qurilmadagi hozirgi ma'lumotlar uning o'rniga almashtiriladi.`, "Yuklash")) return;
      await tgPull(pm); S.ci = 0; go("today"); toast(`${D.classes.length} ta sinf Telegram'dan yuklandi`);
    } else if (a === "tgkeep") { tgSet({seen: TG_NEW.message_id}); TG_NEW = null; await tgBackup(true); render(); toast("Shu qurilmadagi ma'lumotlar Telegram'ga yuborildi"); }
    else if (a === "tgoff") {
      if (!await confirmBox("Telegram'ni uzish", "Avtomatik zaxira to'xtaydi. Botdagi eski fayllar o'chmaydi.", "Uzish")) return;
      const c = tgCfg(); localStorage.setItem(TG_KEY, JSON.stringify({dev: c.dev})); TG_NEW = null; render();
    }
  } catch (e) { toast(e.message === "Failed to fetch" ? "Telegram'ga ulanib bo'lmadi — internetni tekshiring" : "Telegram: " + e.message); }
}

/* ───────── PWA: o'rnatish va oflayn ishlash ───────── */
let installEvt = null;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvt = e; if (S.page === "settings") render(); });
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;

/* ───────── ishga tushirish ───────── */
if (document.getElementById("app")) {
  D = load(); autoDates(); if (D.classes.some((c) => c.plan && c.plan.on)) { reflowAll(); save(); }
  if (D.web.density === "kompakt") V.mode = "quarter";
  render(); emkReady(); idbBoot().then(() => { tgAuto(); remSchedule(); });
  setInterval(() => { if (S.page === "journal" && isLocked() !== $("[data-lock]")?.textContent.includes("🔒")) renderNav(); }, 30000);
}
