name: Testlar

on:
  push:
  pull_request:

jobs:
  hisob-kitob:
    name: Hisob-kitoblar (web ilova)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # versiya.test.mjs asosiy shox bilan solishtiradi
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Web ilova = golden.json
        run: node --test tests/web.test.mjs tests/qoidalar.test.mjs tests/sinx.test.mjs tests/versiya.test.mjs
      - name: Umumiy Telegram bot serveri (bot-server/worker.js)
        run: node --test tests/bot_server.test.mjs tests/gas_server.test.mjs

  brauzer:
    name: Web ilova brauzerda (kompyuter va telefon ekrani)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/ui.test.mjs
